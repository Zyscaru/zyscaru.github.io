<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Aprenda JavaScript do zero com lições interativas, exercícios corrigidos na hora, desafios e projetos.">
<meta name="theme-color" content="#22201a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Caderno JS">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Caderno de JavaScript</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: caderno quadriculado — trilha por módulos à esquerda; lição + editor/console lado a lado; no celular vira abas Lição / Código */
:root{
  --paper:#fbf9f1; --grid:#ece7d4; --ink:#22201a; --ink-soft:#5c5747; --line:#d9d2b8;
  --card:#ffffff; --code-bg:#1e1d17; --code-fg:#f1eee2; --code-dim:#9a957f; --key:#2f2d24;
  --mark:#f7df1e; --mark-ink:#22201a; --accent:#7c5800; --chal:#b0174f;
  --ok:#1f8a4c; --ok-bg:#e3f5ea; --err:#c23a3a; --err-bg:#fbe7e7;
  --f-display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-code:"JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#15140f; --grid:#1f1d16; --ink:#efecdf; --ink-soft:#aaa48c; --line:#3a372a;
  --card:#1c1b14; --code-bg:#0e0d09; --code-fg:#f1eee2; --code-dim:#8f8a72; --key:#29271d;
  --mark:#f7df1e; --mark-ink:#15140f; --accent:#f7df1e; --chal:#f48fb1;
  --ok:#5fd394; --ok-bg:#163a2a; --err:#ff8a8a; --err-bg:#45202a; color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#15140f; --grid:#1f1d16; --ink:#efecdf; --ink-soft:#aaa48c; --line:#3a372a;
  --card:#1c1b14; --code-bg:#0e0d09; --code-fg:#f1eee2; --code-dim:#8f8a72; --key:#29271d;
  --mark:#f7df1e; --mark-ink:#15140f; --accent:#f7df1e; --chal:#f48fb1;
  --ok:#5fd394; --ok-bg:#163a2a; --err:#ff8a8a; --err-bg:#45202a; color-scheme:dark;}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.6;
}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1380px;margin:0 auto;padding-block:20px 48px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:grid;grid-template-columns:270px minmax(0,1fr);gap:24px;align-items:start}

/* ---------- trilha ---------- */
.trail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 32px);overflow:auto;padding:0 4px 8px 0;scrollbar-width:thin}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.55rem;line-height:1.05;letter-spacing:-.02em}
.brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:.85rem;color:var(--ink-soft);letter-spacing:0;margin-top:6px}
.progress{display:flex;flex-direction:column;gap:6px;font-size:.85rem;color:var(--ink-soft)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .4s}
.map-btn{display:flex;align-items:center;gap:8px;border:1.5px solid var(--ink);background:var(--card);border-radius:9px;padding:8px 12px;font-weight:700;font-size:.92rem}
.map-btn[aria-current="true"]{background:var(--ink);color:var(--card)}
.mods{display:flex;flex-direction:column;gap:4px}
.mods details{border-radius:10px}
.mods details[open]{background:color-mix(in srgb, var(--card) 70%, transparent)}
.mods summary{list-style:none;display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;padding:7px 8px;border-radius:10px;cursor:pointer;font-weight:700;font-size:.93rem}
.mods summary::-webkit-details-marker{display:none}
.mods summary:hover{background:var(--card)}
.mods summary .mnum{font-family:var(--f-code);font-size:.78rem;color:var(--ink-soft);text-align:center}
.mods summary .mcount{font-family:var(--f-code);font-size:.72rem;color:var(--ink-soft);font-weight:400;font-variant-numeric:tabular-nums}
.mods summary.full .mcount{color:var(--ok);font-weight:600}
.items{list-style:none;margin:0;padding:0 0 6px 0;display:flex;flex-direction:column;gap:1px}
.items button{width:100%;display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:center;text-align:left;
  background:none;border:0;border-radius:8px;padding:5px 8px 5px 12px;font-size:.88rem;color:var(--ink);line-height:1.3}
.items button:hover{background:var(--card)}
.items button[aria-current="true"]{background:var(--card);box-shadow:inset 0 0 0 1.5px var(--ink)}
.ico{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-code);font-size:.7rem;
  border:1.5px solid var(--line);color:var(--ink-soft);font-variant-numeric:tabular-nums}
.k-chal .ico{border-radius:5px;border-color:var(--chal);color:var(--chal)}
.k-quiz .ico{border-style:dashed}
.k-read .ico{border-radius:4px}
.done .ico{background:var(--ok);border-color:var(--ok);color:var(--card);border-style:solid}
.k-chal.done .ico{background:var(--chal);border-color:var(--chal)}
.trail-select{display:none}

/* ---------- abas (só celular) ---------- */
.tabs{display:none}

/* ---------- área principal ---------- */
.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:20px;align-items:start;min-width:0}
.main.solo{grid-template-columns:minmax(0,1fr)}
.main.solo .work{display:none}
.main.solo .lesson{max-width:900px}
.lesson{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:24px 26px;min-width:0}
.eyebrow{font-family:var(--f-code);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.eyebrow.c{color:var(--chal)}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(1.7rem,3vw,2.4rem);line-height:1.1;letter-spacing:-.025em;margin:6px 0 16px;text-wrap:balance}
h1 span{background:linear-gradient(transparent 58%,var(--mark) 58%,var(--mark) 92%,transparent 92%);padding:0 .1em;
  -webkit-box-decoration-break:clone;box-decoration-break:clone}
.lesson p{margin:0 0 14px;max-width:64ch}
.lesson code{font-family:var(--f-code);font-size:.88em;background:var(--grid);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
h2{font-family:var(--f-display);font-weight:700;font-size:1.15rem;margin:22px 0 10px}
.example{background:var(--code-bg);color:var(--code-fg);border-radius:10px;margin:0 0 16px;overflow:hidden}
.example pre{margin:0;padding:14px 16px;font-family:var(--f-code);font-size:.88rem;line-height:1.55;overflow-x:auto;white-space:pre}
.example .ex-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 8px 6px 16px;border-top:1px solid #ffffff1a;font-size:.78rem;color:var(--code-dim)}
.example .ex-bar span:last-child{display:flex;gap:6px}
.example button{background:#ffffff14;border:0;border-radius:6px;padding:6px 10px;color:var(--code-fg);font-size:.8rem}
.example button:hover{background:#ffffff26}
.task{background:var(--mark);color:var(--mark-ink);border-radius:10px;padding:14px 16px;margin-top:8px}
.task strong{font-family:var(--f-display);display:block;font-size:1rem;margin-bottom:4px}
.task p{margin:0}
.task code{background:#1d275418}
.go-code{display:none;margin-top:14px;width:100%}
.pager{display:flex;justify-content:space-between;gap:8px;margin-top:22px;padding-top:14px;border-top:1px dashed var(--line);flex-wrap:wrap}
.pager button{background:none;border:0;color:var(--ink-soft);font-size:.88rem;padding:6px 0;text-align:left;max-width:48%}
.pager button:last-child{text-align:right;margin-left:auto}
.pager button:hover{color:var(--ink)}
.pager b{display:block;color:var(--ink);font-weight:700}

/* mapa */
.map-head p{max-width:60ch}
.continue{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--ink);color:var(--card);border-radius:12px;padding:14px 16px;margin:6px 0 22px}
.continue small{display:block;opacity:.75;font-size:.8rem}
.continue b{font-family:var(--f-display);font-size:1.1rem}
.continue .btn{background:var(--mark);color:var(--mark-ink);border-color:var(--mark)}
.modgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.modcard{display:flex;flex-direction:column;gap:6px;text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:14px;color:var(--ink)}
.modcard:hover{border-color:var(--ink)}
.modcard .mn{font-family:var(--f-code);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.modcard b{font-family:var(--f-display);font-size:1.1rem;line-height:1.2}
.modcard span.s{font-size:.88rem;color:var(--ink-soft);flex:1}
.modcard .row{display:flex;align-items:center;gap:8px;font-family:var(--f-code);font-size:.75rem;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.modcard .row .bar{flex:1}
.modcard.full{border-color:var(--ok)}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:18px;font-size:.82rem;color:var(--ink-soft)}
.legend span{display:flex;align-items:center;gap:6px}
.banner{background:var(--ok-bg);color:var(--ok);border:1.5px solid var(--ok);border-radius:12px;padding:14px 16px;margin:0 0 18px}
.banner b{font-family:var(--f-display);font-size:1.15rem;display:block}

/* quiz */
.qcard{border:1.5px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.qcard .qn{font-family:var(--f-code);font-size:.72rem;color:var(--ink-soft);letter-spacing:.08em;text-transform:uppercase}
.qcard .qq{font-weight:700;margin:4px 0 10px}
.qcard pre{background:var(--code-bg);color:var(--code-fg);border-radius:8px;padding:10px 12px;font-family:var(--f-code);font-size:.86rem;overflow-x:auto;margin:0 0 10px}
.opts{display:grid;gap:6px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:9px;padding:9px 12px;font-family:var(--f-code);font-size:.88rem;min-height:42px}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.right{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);font-weight:600}
.opt.wrong{border-color:var(--err);background:var(--err-bg);color:var(--err);text-decoration:line-through}
.opt:disabled{cursor:default}
.why{margin-top:10px;font-size:.9rem;padding:8px 10px;border-radius:8px;background:var(--paper)}
.qsum{font-weight:700}

/* leitura */
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-top:8px}
.sheet div{border:1.5px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}
.sheet b{display:block;padding:6px 10px;font-family:var(--f-display);font-size:.92rem;border-bottom:1px solid var(--line)}
.sheet pre{margin:0;padding:8px 10px;font-family:var(--f-code);font-size:.8rem;line-height:1.5;overflow-x:auto}
.read-done{margin-top:20px}

/* ---------- editor ---------- */
.work{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:flex;flex-direction:column;gap:12px;min-width:0}
.editor{background:var(--code-bg);border-radius:14px;overflow:hidden;box-shadow:0 10px 30px -18px #0b0f2a}
.ed-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px 10px 16px;border-bottom:1px solid #ffffff14;color:var(--code-dim);font-family:var(--f-code);font-size:.78rem}
.ed-body{display:grid;grid-template-columns:42px 1fr;min-height:250px;max-height:46vh;overflow:auto;-webkit-overflow-scrolling:touch}
.gutter{padding:14px 8px 14px 0;text-align:right;font-family:var(--f-code);font-size:.92rem;line-height:1.6;color:#5a638c;user-select:none;white-space:pre;font-variant-numeric:tabular-nums}
#code{background:transparent;color:var(--code-fg);border:0;resize:none;outline:none;padding:14px 14px 14px 10px;font-family:var(--f-code);font-size:.92rem;line-height:1.6;
  white-space:pre;overflow:hidden;tab-size:4;caret-color:var(--mark);min-height:250px;width:100%}
.keys{display:flex;gap:6px;overflow-x:auto;padding:8px;border-top:1px solid #ffffff14;scrollbar-width:none}
.keys::-webkit-scrollbar{display:none}
.keys button{flex:0 0 auto;min-width:40px;height:40px;padding:0 10px;border:0;border-radius:8px;background:var(--key);color:var(--code-fg);font-family:var(--f-code);font-size:1rem}
.keys button.wide{font-size:.82rem}
.keys button:active{background:var(--accent)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1.5px solid var(--ink);background:var(--card);border-radius:9px;padding:9px 16px;font-weight:700;font-size:.92rem;min-height:42px}
.btn:hover{background:var(--grid)}
.btn.primary{background:var(--ink);color:var(--card)}
.btn.primary:hover{opacity:.9}
.btn.check{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-soft);font-weight:400}
.btn:disabled{opacity:.5;cursor:wait}
.kbd{font-family:var(--f-code);font-size:.72rem;opacity:.75;margin-left:4px}
.console{background:var(--card);border:1.5px solid var(--line);border-radius:14px;overflow:hidden}
.con-head{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 4px 14px;border-bottom:1px solid var(--line);font-family:var(--f-code);font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
#out{margin:0;padding:12px 14px;min-height:110px;max-height:32vh;overflow:auto;font-family:var(--f-code);font-size:.9rem;line-height:1.55;white-space:pre-wrap;word-break:break-word}
#out .muted{color:var(--ink-soft)}
#out .err{color:var(--err)}
#out .in{color:var(--accent);font-weight:600}
.inrow{display:flex;gap:6px;margin-top:4px}
.inrow input{flex:1;min-width:0;font-family:var(--f-code);font-size:16px;padding:8px;border:1.5px solid var(--accent);border-radius:6px;background:var(--paper);color:var(--ink)}
.feedback{border-radius:12px;padding:12px 14px;font-size:.93rem;display:flex;flex-direction:column;gap:6px}
.feedback.ok{background:var(--ok-bg);color:var(--ok);border:1.5px solid var(--ok)}
.feedback.bad{background:var(--err-bg);color:var(--err);border:1.5px solid var(--err)}
.feedback b{font-family:var(--f-display)}
.feedback code{font-family:var(--f-code)}
.feedback .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.feedback .btn{font-size:.85rem;padding:6px 12px}
.hint{color:var(--ink);background:var(--paper);border-radius:8px;padding:8px 10px;font-size:.9rem;white-space:pre-wrap}
.solution{background:var(--code-bg);color:var(--code-fg);border-radius:8px;padding:10px 12px;font-family:var(--f-code);font-size:.85rem;white-space:pre;overflow-x:auto;margin:0}
.loading{font-size:.82rem;color:var(--ink-soft)}

@media (max-width:1080px){.main{grid-template-columns:minmax(0,1fr)}.work{position:static}}
@media (max-width:760px){
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
  .wrap{grid-template-columns:minmax(0,1fr);gap:12px;padding-block:14px 32px}
  .trail{position:static;max-height:none;overflow:visible;gap:10px;padding:0}
  .brand{font-size:1.35rem}
  .brand small,.mods{display:none}
  .nav-row{display:grid;grid-template-columns:auto 1fr;gap:8px}
  .trail-select{display:block;width:100%;min-width:0;font:inherit;font-size:16px;padding:9px;border-radius:9px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink)}
  .has-editor .tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding:6px 0;margin-bottom:6px}
  .tabs button{border:1.5px solid var(--ink);background:var(--card);border-radius:9px;padding:10px;font-weight:700}
  .tabs button[aria-selected="true"]{background:var(--ink);color:var(--card)}
  .main[data-view="lesson"] .work{display:none}
  .main[data-view="code"]:not(.solo) .lesson{display:none}
  .go-code{display:block}
  .lesson{padding:20px 16px}
  .ed-body{max-height:none;min-height:200px}
  #code{font-size:16px;min-height:200px}
  .gutter{font-size:16px}
  .actions{display:grid;grid-template-columns:1fr 1fr}
  .actions .ghost{grid-column:1/-1}
  .kbd{display:none}
  #out{max-height:none}
}
@media (pointer:fine) and (min-width:761px){.keys{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<div class="wrap">
  <aside class="trail">
    <div class="brand">Caderno de JavaScript<small>Do primeiro console.log a programas que esperam, decidem e respondem.</small></div>
    <div class="progress"><span id="progText">0% do curso</span><div class="bar"><i id="progBar"></i></div></div>
    <div class="nav-row">
      <button class="map-btn" id="mapBtn">▦ Mapa do curso</button>
      <label for="lessonSelect" hidden>Escolher etapa</label>
      <select class="trail-select" id="lessonSelect"></select>
    </div>
    <nav class="mods" id="mods" aria-label="Módulos do curso"></nav>
  </aside>

  <div id="area">
    <div class="tabs" role="tablist" aria-label="Alternar entre lição e código">
      <button role="tab" id="tabLesson" aria-selected="true">Lição</button>
      <button role="tab" id="tabCode" aria-selected="false">Código</button>
    </div>
    <div class="main" id="main" data-view="lesson">
      <article class="lesson" id="lesson" aria-live="polite"></article>

      <section class="work" aria-label="Área de prática">
        <div class="editor">
          <div class="ed-head"><span id="fname">script.js</span><span id="engine" class="loading">preparando o JavaScript…</span></div>
          <div class="ed-body"><div class="gutter" id="gutter">1</div><textarea id="code" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off" aria-label="Editor de código"></textarea></div>
          <div class="keys" id="keys" aria-label="Símbolos"></div>
        </div>
        <div class="actions">
          <button class="btn primary" id="run">▶ Executar<span class="kbd">Ctrl+Enter</span></button>
          <button class="btn check" id="check">Corrigir</button>
          <button class="btn ghost" id="reset">Recomeçar código</button>
        </div>
        <div id="feedback"></div>
        <div class="console" id="console">
          <div class="con-head"><span>Saída</span><button class="btn ghost" id="clear" style="min-height:32px;padding:2px 8px;font-size:.75rem">limpar</button></div>
          <pre id="out"><span class="muted">O resultado do seu código aparece aqui.</span></pre>
        </div>
      </section>
    </div>
  </div>

<script>
const MODULES = [{"id": "m1", "title": "Primeiros passos", "summary": "Mostrar coisas na tela, guardar valores, fazer contas e conversar com o usuário.", "items": [{"kind": "lesson", "id": "ola", "title": "Olá, mundo", "eyebrow": "O primeiro comando", "body": "<p>Um programa é uma lista de instruções que o computador segue de cima para baixo. A instrução mais usada para começar em JavaScript é <code>console.log()<\/code>: ela mostra no console o que estiver dentro dos parênteses.<\/p>\n<p>Textos ficam entre aspas, que podem ser duplas <code>\"assim\"<\/code> ou simples <code>'assim'<\/code>. No fim de cada instrução costuma vir um ponto e vírgula <code>;<\/code>. Ele é opcional na maioria dos casos, mas é um bom costume.<\/p>", "examples": ["console.log(\"Oi! Eu sou um programa.\");\nconsole.log('Cada console.log vira uma linha.');"], "task": "Escreva um programa que mostre exatamente a frase <code>Olá, mundo!<\/code>", "starter": "// Escreva seu código abaixo\n", "hint": "Use console.log com o texto entre aspas: console.log(\"...\");", "solution": "console.log(\"Olá, mundo!\");", "tests": [{"expect": "Olá, mundo!"}], "require": [], "forbid": []}, {"kind": "lesson", "id": "comentarios", "title": "Comentários e erros", "eyebrow": "Lendo o que o JavaScript diz", "body": "<p>Tudo que vem depois de <code>//<\/code> numa linha é um <em>comentário<\/em>: o JavaScript ignora. Para comentários de várias linhas, use <code>/* ... */<\/code>.<\/p>\n<p>Errar faz parte. Quando algo dá errado, aparece uma mensagem com o <strong>tipo do erro<\/strong> e o <strong>número da linha<\/strong>. Os mais comuns no começo são <code>SyntaxError<\/code> (escrita errada, como parêntese ou aspas sem fechar) e <code>ReferenceError<\/code> (um nome que o JavaScript não conhece, muitas vezes um texto sem aspas).<\/p>", "examples": ["// Isto é um comentário, o JavaScript pula esta linha\nconsole.log(\"Esta linha roda\"); // comentário no fim da linha também vale\n/* Comentário\n   de várias linhas */", "console.log(\"Vai dar erro aqui:\");\nconsole.log(Ola);"], "task": "O programa no editor tem dois erros. Corrija para ele mostrar <code>Bom dia<\/code> e <code>Tudo bem?<\/code> em duas linhas, e acrescente um comentário explicando o que o programa faz.", "starter": "console.log(\"Bom dia\";\nconsole.log(Tudo bem?);\n", "hint": "A primeira linha está com o parêntese fechando depois do ponto e vírgula: o certo é (\"Bom dia\");. Na segunda, faltam aspas em volta do texto. O comentário começa com //.", "solution": "// Mostra uma saudação\nconsole.log(\"Bom dia\");\nconsole.log(\"Tudo bem?\");", "tests": [{"expect": "Bom dia\nTudo bem?"}], "require": [{"re": "//|/\\*", "flags": "", "msg": "Acrescente um comentário começando com //."}], "forbid": []}, {"kind": "lesson", "id": "variaveis", "title": "Variáveis", "eyebrow": "let e const", "body": "<p>Uma variável é uma caixinha com nome onde você guarda um valor para usar depois. Em JavaScript você cria variáveis com <code>let<\/code> (o valor pode mudar depois) ou <code>const<\/code> (o valor fica fixo). O sinal <code>=<\/code> aqui não significa \"igual\": significa <em>guarde isto<\/em>.<\/p>\n<p>Use <code>const<\/code> sempre que o valor não precisar mudar, e <code>let<\/code> quando for mudar. Nomes de variáveis não têm espaços nem acentos; quando têm várias palavras, o costume é juntar com maiúscula: <code>nomeCompleto<\/code>. No <code>console.log<\/code>, separe vários valores com vírgula e eles saem com um espaço entre eles.<\/p>\n<p>Você vai encontrar <code>var<\/code> em códigos antigos. Ele funciona, mas tem regras confusas; prefira <code>let<\/code> e <code>const<\/code>.<\/p>", "examples": ["const nome = \"Ana\";\nlet cidade = \"Santos\";\nconsole.log(\"Meu nome é\", nome);\nconsole.log(nome, \"mora em\", cidade);\ncidade = \"Recife\"; // com let, o valor pode mudar\nconsole.log(nome, \"agora mora em\", cidade);", "const pi = 3.14;\npi = 3; // const não deixa mudar: dá erro"], "task": "Crie uma constante <code>fruta<\/code> com o valor <code>\"manga\"<\/code> e use-a para mostrar: <code>Eu gosto de manga<\/code>", "starter": "// Crie a constante fruta\n\n// Mostre a frase usando a constante\n", "hint": "Primeiro: const fruta = \"manga\"; Depois: console.log(\"Eu gosto de\", fruta);", "solution": "const fruta = \"manga\";\nconsole.log(\"Eu gosto de\", fruta);", "tests": [{"expect": "Eu gosto de manga"}], "require": [{"re": "const\\s+fruta\\s*=", "flags": "", "msg": "Crie a constante com const fruta = ..."}, {"re": "console\\.log\\([^)]*fruta", "flags": "", "msg": "Use a constante fruta dentro do console.log, em vez de escrever a palavra direto."}], "forbid": []}, {"kind": "lesson", "id": "numeros", "title": "Números e contas", "eyebrow": "JavaScript como calculadora", "body": "<p>Números não levam aspas. Diferente de outras linguagens, o JavaScript tem um tipo só para números: <code>7<\/code> e <code>7.5<\/code> são ambos <code>number<\/code>. Decimais usam <strong>ponto<\/strong>, não vírgula.<\/p>\n<p>As contas usam <code>+<\/code>, <code>-<\/code>, <code>*<\/code> (vezes) e <code>/<\/code> (dividir). Há também <code>%<\/code> (resto da divisão) e <code>**<\/code> (potência). Repare: <code>10 / 4<\/code> dá <code>2.5<\/code>, e não 2. Para pegar só a parte inteira, use <code>Math.floor(10 / 4)<\/code>.<\/p>\n<p>Cuidado com aspas: <code>\"2\" + \"2\"<\/code> dá <code>\"22\"<\/code>, porque com aspas é texto e o <code>+<\/code> junta textos.<\/p>", "examples": ["console.log(10 + 5);\nconsole.log(10 / 4);\nconsole.log(Math.floor(10 / 4));\nconsole.log(10 % 4);\nconsole.log(2 ** 3);\nconsole.log(\"2\" + \"2\");", "const preco = 12;\nconst quantidade = 3;\nconst total = preco * quantidade;\nconsole.log(\"Total:\", total);"], "task": "Um livro custa 35 reais. Guarde o preço em <code>preco<\/code> e a quantidade 4 em <code>quantidade<\/code>, calcule e mostre o total (só o número).", "starter": "const preco = 35;\n\n", "hint": "Crie const quantidade = 4; e depois console.log(preco * quantidade);", "solution": "const preco = 35;\nconst quantidade = 4;\nconsole.log(preco * quantidade);", "tests": [{"expect": "140"}], "require": [{"re": "\\*", "flags": "", "msg": "Use a multiplicação (*) para o JavaScript calcular, em vez de escrever 140 direto."}], "forbid": []}, {"kind": "lesson", "id": "textos", "title": "Textos e template strings", "eyebrow": "Strings", "body": "<p>Texto em programação se chama <em>string<\/em>. Além das aspas comuns, o JavaScript tem a <strong>template string<\/strong>, escrita com crases <code>`assim`<\/code>. Dentro dela, <code>${...}<\/code> coloca o valor de uma variável ou conta no meio do texto.<\/p>\n<p>Strings também têm ferramentas próprias: <code>.length<\/code> conta os caracteres, <code>.toUpperCase()<\/code> deixa tudo maiúsculo e <code>.toLowerCase()<\/code> minúsculo.<\/p>", "examples": ["const nome = \"Bia\";\nconst idade = 15;\nconsole.log(`Oi, ${nome}! Você tem ${idade} anos.`);\nconsole.log(`Ano que vem: ${idade + 1}`);\nconsole.log(nome.toUpperCase(), nome.length);", "// Também dá para juntar textos com +\nconst saudacao = \"Bom dia, \" + \"Bia\" + \"!\";\nconsole.log(saudacao);"], "task": "Com as constantes do editor, use uma template string para mostrar: <code>Carlos tem 6 letras e mora em SALVADOR<\/code> (o tamanho e a cidade em maiúsculas devem ser calculados pelo programa).", "starter": "const nome = \"Carlos\";\nconst cidade = \"Salvador\";\n", "hint": "console.log(`${nome} tem ${nome.length} letras e mora em ${cidade.toUpperCase()}`);", "solution": "const nome = \"Carlos\";\nconst cidade = \"Salvador\";\nconsole.log(`${nome} tem ${nome.length} letras e mora em ${cidade.toUpperCase()}`);", "tests": [{"expect": "Carlos tem 6 letras e mora em SALVADOR"}], "require": [{"re": "`", "flags": "", "msg": "Use uma template string, com crases `...`."}, {"re": "\\.length", "flags": "", "msg": "Use nome.length para o programa contar as letras."}, {"re": "toUpperCase", "flags": "", "msg": "Use .to ": "Qual linha mostra Olá, Ana! usando a variável nome?", "code": "const nome = \"Ana\";", "options": ["console.log(\"Olá, ${nome}!\");", "console.log(`Olá, ${nome}!`);", "console.log('Olá, nome!');", "console.log(`Olá, {nome}!`);"], "answer": 1, "why": "O ${...} só funciona dentro de crases (template string), e precisa do cifrão."}, {"q": "Quanto vale 17 % 5?", "code": null, "options": ["3.4", "3", "2", "12"], "answer": 2, "why": "% é o resto da divisão: 17 dividido por 5 dá 3 e sobram 2."}]}]}, {"id": "m2", "title": "Decisões", "summary": "Verdadeiro e falso, if/else e como combinar condições.", "items": [{"kind": "lesson", "id": "bool", "title": "Verdadeiro ou falso", "eyebrow": "Booleanos e comparações", "body": "<p>Uma comparação tem resposta <code>true<\/code> (verdadeiro) ou <code>false<\/code> (falso). Esses valores são do tipo <em>booleano<\/em>.<\/p>\n<p>Para comparar: <code>&gt;<\/code>, <code>&lt;<\/code>, <code>&gt;=<\/code>, <code>&lt;=<\/code>, <code>===<\/code> (igual) e <code>!==<\/code> (diferente). Repare nos <strong>três<\/strong> sinais de igual. O <code>==<\/code> com dois também existe, mas ele converte tipos de um jeito que confunde (<code>\"5\" == 5<\/code> dá <code>true<\/code>). Use sempre <code>===<\/code>.<\/p>", "examples": ["console.log(5 > 3);\nconsole.log(2 === 3);\nconsole.log(\"ana\" === \"ana\");\nconsole.log(\"5\" === 5);  // texto não é número\nconsole.log(\"5\" == 5);   // por isso evite o ==\nconst idade = 16;\nconsole.log(idade >= 18);"], "task": "Leia a idade e mostre <code>true<\/code> se a pessoa pode tirar carteira de motorista (18 anos ou mais), ou <code>false<\/code> se não pode.", "starter": "const idade = Number(prompt(\"Idade: \"));\n", "hint": "console.log(idade >= 18);", "solution": "const idade = Number(prompt(\"Idade: \"));\nconsole.log(idade >= 18);", "tests": [{"expect": "true", "inputs": ["20"]}, {"expect": "false", "inputs": ["15"]}, {"expect": "true", "inputs": ["18"]}], "require": [], "forbid": []}, {"kind": "lesson", "id": "if", "title": "Tomando decisões", "eyebrow": "if, else if, else", "body": "<p>O <code>if<\/code> roda um bloco de código só quando a condição é verdadeira. A condição fica entre parênteses e o bloco entre chaves <code>{ }<\/code>. O <code>else<\/code> é o \"senão\", e o <code>else if<\/code> testa outra condição quando a anterior falhou.<\/p>\n<p>O JavaScript testa de cima para baixo e para no primeiro que der certo. O código dentro das chaves costuma ser recuado (2 espaços é o costume em JavaScript) para ficar fácil de ler.<\/p>", "examples": ["const temperatura = 31;\nif (temperatura > 30) {\n  console.log(\"Está quente!\");\n  console.log(\"Beba água.\");\n} else if (temperatura > 18) {\n  console.log(\"Clima agradável.\");\n} else {\n  console.log(\"Leve um casaco.\");\n}"], "task": "Leia uma nota de 0 a 10. Mostre <code>Aprovado<\/code> se for 7 ou mais, <code>Recuperação<\/code> se for de 5 até menos de 7, e <code>Reprovado<\/code> se for menor que 5.", "starter": "const nota = Number(prompt(\"Nota: \"));\n", "hint": "if (nota >= 7) { ... } else if (nota >= 5) { ... } else { ... }", "solution": "const nota = Number(prompt(\"Nota: \"));\nif (nota >= 7) {\n  console.log(\"Aprovado\");\n} else if (nota >= 5) {\n  console.log(\"Recuperação\");\n} else {\n  console.log(\"Reprovado\");\n}", "tests": [{"expect": "Aprovado", "inputs": ["8"]}, {"expect": "Aprovado", "inputs": ["7"]}, {"expect": "Recuperação", "inputs": ["5"]}, {"expect": "Reprovado", "inputs": ["3"]}], "require": [{"re": "\\bif\\s*\\(", "flags": "", "msg": "Use if para decidir."}], "forbid": []}, {"kind": "lesson", "id": "logica", "title": "E, ou, não", "eyebrow": "&&, || e !", "body": "<p>Para juntar condições: <code>&amp;&amp;<\/code> (e) exige que as duas sejam verdadeiras; <code>||<\/code> (ou) basta uma; e <code>!<\/code> (não) inverte o resultado.<\/p>\n<p>Exemplo: para entrar no brinquedo, é preciso ter 12 anos <strong>e<\/strong> 1,40 m: <code>idade &gt;= 12 &amp;&amp; altura &gt;= 1.4<\/code>. Fim de semana é sábado <strong>ou<\/strong> domingo: <code>dia === \"sáb\" || dia === \"dom\"<\/code>.<\/p>", "examples": ["const idade = 13;\nconst altura = 1.35;\nconsole.log(idade >= 12 && altura >= 1.4);\nconsole.log(idade >= 12 || altura >= 1.4);\nconst chovendo = false;\nif (!chovendo) {\n  console.log(\"Dá para ir à praia\");\n}"], "task": "Um cinema dá meia-entrada para quem tem menos de 18 <strong>ou<\/strong> 60 anos ou mais. Leia a idade e mostre <code>Meia<\/code> ou <code>Inteira<\/code>.", "starter": "const idade = Number(prompt(\"Idade: \"));\n", "hint": "if (idade < 18 || idade >= 60) { console.log(\"Meia\"); } else { ... }", "solution": "const idade = Number(prompt(\"Idade: \"));\nif (idade < 18 || idade >= 60) {\n  console.log(\"Meia\");\n} else {\n  console.log(\"Inteira\");\n}", "tests": [{"expect": "Meia", "inputs": ["10"]}, {"expect": "Inteira", "inputs": ["30"]}, {"expect": "Meia", "inputs": ["60"]}, {"expect": "Inteira", "inputs": ["18"]}, {"expect": "Meia", "inputs": ["75"]}], "require": [{"re": "\\|\\|", "flags": "", "msg": "Use || (ou) para juntar as duas condições num if só."}], "forbid": []}, {"kind": "lesson", "id": "ternario", "title": "Decisões curtas", "eyebrow": "Operador ternário e switch", "body": "<p>Quando a decisão só escolhe entre dois valores, existe um atalho: <code>condição ? valorSeSim : valorSeNão<\/code>. É o <em>operador ternário<\/em>.<\/p>\n<p>Já quando você compara uma variável com vários valores fixos, o <code>switch<\/code> deixa o código organizado. Cada <code>case<\/code> termina com <code>break<\/code>; o <code>default<\/code> é o que roda se nenhum caso bater.<\/p>", "examples": ["const idade = 20;\nconst tipo = idade >= 18 ? \"adulto\" : \"menor\";\nconsole.log(tipo);", "const dia = 3;\nswitch (dia) {\n  case 1:\n    console.log(\"Domingo\");\n    break;\n  case 7:\n    console.log(\"Sábado\");\n    break;\n  default:\n    console.log(\"Dia de semana\");\n}"], "task": "Leia um número e, usando o operador ternário, mostre <code>par<\/code> ou <code>ímpar<\/code>.", "starter": "const n = Number(prompt(\"Número: \"));\n", "hint": "const tipo = n % 2 === 0 ? \"par\" : \"ímpar\"; console.log(tipo);", "solution": "const n = Number(prompt(\"Número: \"));\nconsole.log(n % 2 === 0 ? \"par\" : \"ímpar\");", "tests": [{"expect": "par", "inputs": ["4"]}, {"expect": "ímpar", "inputs": ["7"]}, {"expect": "par", "inputs": ["0"]}], "require": [{"re": "\\?[^:]+:", "flags": "", "msg": "Use o operador ternário: condição ? ... : ..."}], "forbid": []}, {"kind": "chal", "id": "d-maior3", "title": "O maior de três", "level": "Médio", "task": "Leia três números e mostre o maior deles. Não vale usar <code>Math.max<\/code>: resolva com <code>if<\/code>.", "tip": "Guarde o primeiro numa variável <code>maior<\/code> (com <code>let<\/code>). Depois compare com o segundo e com o terceiro, trocando quando achar um maior.", "starter": "const a = Number(prompt(\"Primeiro: \"));\nconst b = Number(prompt(\"Segundo: \"));\nconst c = Number(prompt(\"Terceiro: \"));\n", "hint": "let maior = a; if (b > maior) { maior = b; } if (c > maior) { maior = c; } console.log(maior);", "solution": "const a = Number(prompt(\"Primeiro: \"));\nconst b = Number(prompt(\"Segundo: \"));\nconst c = Number(prompt(\"Terceiro: \"));\nlet maior = a;\nif (b > maior) {\n  maior = b;\n}\nif (c > maior) {\n  maior = c;\n}\nconsole.log(maior);", "tests": [{"expect": "9", "inputs": ["3", "9", "5"]}, {"expect": "8", "inputs": ["8", "2", "1"]}, {"expect": "7", "inputs": ["1", "2", "7"]}, {"expect": "-1", "inputs": ["-5", "-1", "-3"]}], "require": [], "forbid": [{"re": "Math\\.max", "flags": "", "msg": "Resolva com if, sem Math.max."}]}, {"kind": "chal", "id": "d-ano", "title": "Ano bissexto", "level": "Médio", "task": "Leia um ano e mostre <code>bissexto<\/code> ou <code>comum<\/code>. Um ano é bissexto se for divisível por 4, mas não por 100, a não ser que também seja divisível por 400.", "tip": "Divisível quer dizer resto zero: <code>ano % 4 === 0<\/code>. Junte as regras com <code>&amp;&amp;<\/code> e <code>||<\/code>: (divisível por 4 e não por 100) ou divisível por 400.", "starter": "const ano = Number(prompt(\"Ano: \"));\n", "hint": "if ((ano % 4 === 0 && ano % 100 !== 0) || ano % 400 === 0) { ... }", "solution": "const ano = Number(prompt(\"Ano: \"));\nif ((ano % 4 === 0 && ano % 100 !== 0) || ano % 400 === 0) {\n  console.log(\"bissexto\");\n} else {\n  console.log(\"comum\");\n}", "tests": [{"expect": "bissexto", "inputs": ["2024"]}, {"expect": "comum", "inputs": ["2023"]}, {"expect": "comum", "inputs": ["1900"]}, {"expect": "bissexto", "inputs": ["2000"]}], "require": [], "forbid": []}, {"kind": "quiz", "id": "q2", "title": "Revisão: decisões", "questions": [{"q": "O que este código mostra?", "code": "console.log(5 > 3 && 2 > 4);", "options": ["true", "false", "5", "Dá erro"], "answer": 1, "why": "5 > 3 é true, mas 2 > 4 é false. Com &&, as duas precisam ser verdadeiras."}, {"q": "Qual é a forma recomendada de comparar se dois valores são iguais?", "code": null, "options": ["=", "==", "===", "=>"], "answer": 2, "why": "=== compara valor e tipo. O = guarda valores e o == converte tipos de um jeito confuso."}, {"q": "O que este código mostra?", "code": "const nota = 6;\nif (nota >= 7) {\n  console.log(\"A\");\n} else if (nota >= 5) {\n  console.log(\"B\");\n} else {\n  console.log(\"C\");\n}", "options": ["A", "B", "C", "B e C"], "answer": 1, "why": "6 não é >= 7, então testa o próximo: 6 >= 5 é verdade. Mostra B e para."}, {"q": "Quanto vale x?", "code": "const x = 10 > 20 ? \"sim\" : \"não\";", "options": ["\"sim\"", "\"não\"", "true", "false"], "answer": 1, "why": "10 > 20 é falso, então o ternário escolhe o valor depois dos dois-pontos."}, {"q": "O que acontece se esquecer o break num case do switch?", "code": null, "options": ["Dá erro", "O código continua rodando os cases de baixo", "O switch para", "Nada muda"], "answer": 1, "why": "Sem break, o JavaScript segue executando os próximos cases até achar um break ou o fim do switch."}]}]}, {"id": "m3", "title": "Repetição", "summary": "for, while, break e continue: fazer o computador repetir o trabalho por você.", "items": [{"kind": "lesson", "id": "for", "title": "Repetindo com for", "eyebrow": "Laços", "body": "<p>O <code>for<\/code> repete um bloco um número certo de vezes. Ele tem três partes entre parênteses, separadas por <code>;<\/code>: o começo (<code>let i = 1<\/code>), a condição para continuar (<code>i &lt;= 5<\/code>) e o passo depois de cada volta (<code>i++<\/code>, que soma 1 em <code>i<\/code>).<\/p>\n<p>Lendo em voz alta: \"comece com i valendo 1; enquanto i for até 5, rode o bloco; depois de cada volta, some 1\".<\/p>", "examples": ["for (let i = 1; i <= 5; i++) {\n  console.log(\"Volta número\", i);\n}", "// De 2 em 2, e contando para trás\nfor (let i = 0; i <= 10; i += 2) {\n  console.log(i);\n}\nfor (let i = 3; i >= 1; i--) {\n  console.log(i);\n}\nconsole.log(\"Já!\");"], "task": "Leia um número e mostre a tabuada dele de 1 a 10, no formato <code>7 x 1 = 7<\/code>.", "starter": "const n = Number(prompt(\"Tabuada do: \"));\n", "hint": "for (let i = 1; i <= 10; i++) { console.log(`${n} x ${i} = ${n * i}`); }", "solution": "const n = Number(prompt(\"Tabuada do: \"));\nfor (let i = 1; i <= 10; i++) {\n  console.log(`${n} x ${i} = ${n * i}`);\n}", "tests": [{"expect": "7 x 1 = 7\n7 x 2 = 14\n7 x 3 = 21\n7 x 4 = 28\n7 x 5 = 35\n7 x 6 = 42\n7 x 7 = 49\n7 x 8 = 56\n7 x 9 = 63\n7 x 10 = 70", "inputs": ["7"]}, {"expect": "3 x 1 = 3\n3 x 2 = 6\n3 x 3 = 9\n3 x 4 = 12\n3 x 5 = 15\n3 x 6 = 18\n3 x 7 = 21\n3 x 8 = 24\n3 x 9 = 27\n3 x 10 = 30", "inputs": ["3"]}], "require": [{"re": "\\bfor\\s*\\(", "flags": "", "msg": "Use um laço for."}], "forbid": []}, {"kind": "lesson", "id": "acumuladores", "title": "Contadores e acumuladores", "eyebrow": "Somando dentro do laço", "body": "<p>Um padrão muito comum: criar uma variável com <code>let<\/code> <strong>antes<\/strong> do laço e ir mudando ela <strong>dentro<\/strong> do laço. Um <em>acumulador<\/em> soma valores (<code>total += x<\/code>); um <em>contador<\/em> conta quantas vezes algo aconteceu (<code>contador++<\/code>).<\/p>\n<p><code>total += x<\/code> é um atalho para <code>total = total + x<\/code>. Também existem <code>-=<\/code>, <code>*=<\/code> e <code>/=<\/code>.<\/p>", "examples": ["let total = 0;\nfor (let i = 1; i <= 100; i++) {\n  total += i;\n}\nconsole.log(\"Soma de 1 a 100:\", total);", "let pares = 0;\nfor (let i = 1; i <= 20; i++) {\n  if (i % 2 === 0) {\n    pares++;\n  }\n}\nconsole.log(\"Pares até 20:\", pares);"], "task": "Leia quantas notas serão digitadas e depois cada uma das notas. Mostre a média, no formato <code>Média: 7.5<\/code>.", "starter": "const quantidade = Number(prompt(\"Quantas notas? \"));\nlet soma = 0;\n", "hint": "for (let i = 1; i <= quantidade; i++) { soma += Number(prompt(\"Nota: \")); } e depois mostre soma / quantidade.", "solution": "const quantidade = Number(prompt(\"Quantas notas? \"));\nlet soma = 0;\nfor (let i = 1; i <= quantidade; i++) {\n  soma += Number(prompt(\"Nota: \"));\n}\nconsole.log(`Média: ${soma / quantidade}`);", "tests": [{"expect": "Média: 7.5", "inputs": ["2", "7", "8"]}, {"expect": "Média: 6", "inputs": ["3", "5", "6", "7"]}, {"expect": "Média: 10", "inputs": ["1", "10"]}], "require": [], "forbid": []}, {"kind": "lesson", "id": "while", "title": "Repetindo com while", "eyebrow": "Enquanto for verdade", "body": "<p>O <code>while<\/code> repete enquanto a condição for verdadeira. Use quando você não sabe de antemão quantas voltas serão, como \"pergunte até a pessoa acertar\".<\/p>\n<p>Cuidado: alguma coisa dentro do laço precisa mudar a condição, senão ele roda para sempre. Aqui no caderno, programas que demoram demais são interrompidos depois de alguns segundos.<\/p>", "examples": ["let saldo = 100;\nlet meses = 0;\nwhile (saldo < 200) {\n  saldo = saldo * 1.1;\n  meses++;\n}\nconsole.log(\"Dobrou em\", meses, \"meses\");", "let senha = prompt(\"Senha: \");\nwhile (senha !== \"1234\") {\n  console.log(\"Errada, tente de novo\");\n  senha = prompt(\"Senha: \");\n}\nconsole.log(\"Entrou!\");"], "task": "Leia números até a pessoa digitar <code>0<\/code>. Depois mostre a soma de todos, no formato <code>Soma: 15<\/code>.", "starter": "let soma = 0;\nlet n = Number(prompt(\"Número (0 para parar): \"));\n", "hint": "while (n !== 0) { soma += n; n = Number(prompt(...)); }", "solution": "let soma = 0;\nlet n = Number(prompt(\"Número (0 para parar): \"));\nwhile (n !== 0) {\n  soma += n;\n  n = Number(prompt(\"Número (0 para parar): \"));\n}\nconsole.log(`Soma: ${soma}`);", "tests": [{"expect": "Soma: 15", "inputs": ["5", "4", "6", "0"]}, {"expect": "Soma: 0", "inputs": ["0"]}, {"expect": "Soma: 7", "inputs": ["10", "-3", "0"]}], "require": [{"re": "\\bwhile\\s*\\(", "flags": "", "msg": "Use um laço while."}], "forbid": []}, {"kind": "lesson", "id": "break", "title": "Saindo e pulando", "eyebrow": "break e continue", "body": "<p>Dentro de um laço, <code>break<\/code> sai dele na hora, e <code>continue<\/code> pula o resto desta volta e vai para a próxima.<\/p>\n<p>Um padrão muito usado é o <code>while (true)<\/code> com um <code>break<\/code> lá dentro: o laço roda \"para sempre\" até alguma condição mandar sair.<\/p>", "examples": ["for (let i = 1; i <= 10; i++) {\n  if (i % 3 === 0) {\n    continue; // pula os múltiplos de 3\n  }\n  if (i > 8) {\n    break; // para tudo\n  }\n  console.log(i);\n}", "while (true) {\n  const resposta = prompt(\"Digite sair para terminar: \");\n  if (resposta === \"sair\") {\n    break;\n  }\n  console.log(\"Você digitou\", resposta);\n}"], "task": "Leia palavras com <code>while (true)<\/code> até a pessoa digitar <code>fim<\/code>. Mostre cada palavra em maiúsculas, mas ignore (pule) palavras vazias.", "starter": "while (true) {\n  const palavra = prompt(\"Palavra: \");\n\n}\n", "hint": "if (palavra === \"fim\") break; if (palavra === \"\") continue; console.log(palavra.toUpperCase());", "solution": "while (true) {\n  const palavra = prompt(\"Palavra: \");\n  if (palavra === \"fim\") {\n    break;\n  }\n  if (palavra === \"\") {\n    continue;\n  }\n  console.log(palavra.toUpperCase());\n}", "tests": [{"expect": "OI\nTCHAU", "inputs": ["oi", "", "tchau", "fim"]}, {"expect": "", "inputs": ["fim"]}, {"expect": "A\nB", "inputs": ["", "", "a", "b", "fim"]}], "require": [{"re": "\\bbreak\\b", "flags": "", "msg": "Use break para sair do laço."}, {"re": "\\bcontinue\\b", "flags": "", "msg": "Use continue para pular as palavras vazias."}], "forbid": []}, {"kind": "lesson", "id": "aninhados", "title": "Laços dentro de laços", "eyebrow": "Laços aninhados", "body": "<p>Um laço pode ficar dentro de outro. Para cada volta do laço de fora, o de dentro roda inteiro. É assim que se percorre linhas e colunas de uma tabela.<\/p>\n<p>Para montar uma linha de texto aos poucos, crie uma string vazia e vá juntando com <code>+=<\/code>. Outra ferramenta útil: <code>\"*\".repeat(3)<\/code> dá <code>\"***\"<\/code>.<\/p>", "examples": ["for (let linha = 1; linha <= 3; linha++) {\n  let texto = \"\";\n  for (let coluna = 1; coluna <= 4; coluna++) {\n    texto += `(${linha},${coluna}) `;\n  }\n  console.log(texto);\n}", "for (let i = 1; i <= 4; i++) {\n  console.log(\"#\".repeat(i));\n}"], "task": "Leia um número <code>n<\/code> e desenhe um quadrado de <code>n<\/code> por <code>n<\/code> com <code>*<\/code>, usando dois laços <code>for<\/code> (sem <code>repeat<\/code>).", "starter": "const n = Number(prompt(\"Tamanho: \"));\n", "hint": "for (let i = 0; i < n; i++) { let linha = \"\"; for (let j = 0; j < n; j++) { linha += \"*\"; } console.log(linha); }", "solution": "const n = Number(prompt(\"Tamanho: \"));\nfor (let i = 0; i < n; i++) {\n  let linha = \"\";\n  for (let j = 0; j < n; j++) {\n    linha += \"*\";\n  }\n  console.log(linha);\n}", "tests": [{"expect": "***\n***\n***", "inputs": ["3"]}, {"expect": "*", "inputs": ["1"]}, {"expect": "*****\n*****\n*****\n*****\n*****", "inputs": ["5"]}], "require": [{"re": "for[\\s\\S]*for", "flags": "", "msg": "Use um for dentro de outro for."}], "forbid": [{"re": "\\.repeat\\(", "flags": "", "msg": "Aqui a ideia é treinar o laço dentro do laço, sem usar repeat."}]}, {"kind": "chal", "id": "d-fizz", "title": "FizzBuzz", "level": "Médio", "task": "Mostre os números de 1 a 30, mas troque os múltiplos de 3 por <code>Fizz<\/code>, os de 5 por <code>Buzz<\/code> e os de 3 e 5 ao mesmo tempo por <code>FizzBuzz<\/code>.", "tip": "A ordem dos <code>if<\/code> importa: teste primeiro o caso dos dois (múltiplo de 15), senão o <code>Fizz<\/code> pega antes.", "starter": "for (let i = 1; i <= 30; i++) {\n  \n}\n", "hint": "if (i % 15 === 0) ... else if (i % 3 === 0) ... else if (i % 5 === 0) ... else console.log(i);", "solution": "for (let i = 1; i <= 30; i++) {\n  if (i % 15 === 0) {\n    console.log(\"FizzBuzz\");\n  } else if (i % 3 === 0) {\n    console.log(\"Fizz\");\n  } else if (i % 5 === 0) {\n    console.log(\"Buzz\");\n  } else {\n    console.log(i);\n  }\n}", "tests": [{"expect": "1\n2\nFizz\n4\nBuzz\nFizz\n7\n8\nFizz\nBuzz\n11\nFizz\n13\n14\nFizzBuzz\n16\n17\nFizz\n19\nBuzz\nFizz\n22\n23\nFizz\nBuzz\n26\nFizz\n28\n29\nFizzBuzz"}], "require": [], "forbid": []}, {"kind": "chal", "id": "d-primo", "title": "Número primo", "level": "Difícil", "task": "Leia um número inteiro maior que 1 e mostre <code>primo<\/code> ou <code>não é primo<\/code>. Primo é o número que só é divisível por 1 e por ele mesmo.", "tip": "Teste os divisores de 2 até o número menos 1. Se algum dividir sem resto, não é primo e dá para parar com <code>break<\/code>. Uma variável <code>let ehPrimo = true<\/code> ajuda.", "starter": "const n = Number(prompt(\"Número: \"));\n", "hint": "let ehPrimo = true; for (let d = 2; d < n; d++) { if (n % d === 0) { ehPrimo = false; break; } }", "solution": "const n = Number(prompt(\"Número: \"));\nlet ehPrimo = true;\nfor (let d = 2; d < n; d++) {\n  if (n % d === 0) {\n    ehPrimo = false;\n    break;\n  }\n}\nconsole.log(ehPrimo ? \"primo\" : \"não é primo\");", "tests": [{"expect": "primo", "inputs": ["7"]}, {"expect": "não é primo", "inputs": ["9"]}, {"expect": "primo", "inputs": ["2"]}, {"expect": "primo", "inputs": ["97"]}, {"expect": "não é primo", "inputs": ["91"]}], "require": [], "forbid": []}, {"kind": "quiz", "id": "q3", "title": "Revisão: repetição", "questions": [{"q": "Quantas vezes este laço roda?", "code": "for (let i = 0; i < 5; i++) {\n  console.log(i);\n}", "options": ["4", "5", "6", "Infinitas"], "answer": 1, "why": "i vale 0, 1, 2, 3 e 4. Quando chega em 5, a condição i < 5 fica falsa."}, {"q": "O que i++ faz?", "code": null, "options": ["Soma 1 em i", "Multiplica i por 2", "Compara i com ele mesmo", "Cria a variável i"], "answer": 0, "why": "i++ é o mesmo que i = i + 1, ou i += 1."}, {"q": "O que este código mostra?", "code": "let total = 0;\nfor (let i = 1; i <= 4; i++) {\n  total += i;\n}\nconsole.log(total);", "options": ["4", "10", "1234", "0"], "answer": 1, "why": "1 + 2 + 3 + 4 = 10."}, {"q": "Para que serve o break?", "code": null, "options": ["Pular para a próxima volta", "Sair do laço na hora", "Pausar o programa", "Reiniciar o laço"], "answer": 1, "why": "break sai do laço. Quem pula para a próxima volta é o continue."}, {"q": "Quando usar while em vez de for?", "code": null, "options": ["Nunca, for é sempre melhor", "Quando não se sabe quantas voltas serão", "Só com textos", "Quando o laço tem if dentro"], "answer": 1, "why": "O while combina com repetições que dependem de algo acontecer, como a pessoa digitar a senha certa."}]}]}, {"id": "m4", "title": "Funções", "summary": "Criar seus próprios comandos, devolver resultados e organizar programas maiores.", "items": [{"kind": "lesson", "id": "funcoes", "title": "Funções", "eyebrow": "Seus próprios comandos", "body": "<p>Uma função é um pedaço de código com nome, que você pode chamar quantas vezes quiser. Ela é criada com <code>function nome() { ... }<\/code> e chamada com <code>nome()<\/code>.<\/p>\n<p>Funções podem receber valores (<em>parâmetros<\/em>) e devolver um resultado com <code>return<\/code>. Quando o <code>return<\/code> roda, a função termina na hora. Uma função sem <code>return<\/code> devolve <code>undefined<\/code>.<\/p>", "examples": ["function saudar(nome) {\n  console.log(`Olá, ${nome}!`);\n}\nsaudar(\"Ana\");\nsaudar(\"Leo\");", "function dobro(n) {\n  return n * 2;\n}\nconst x = dobro(21);\nconsole.log(x);\nconsole.log(dobro(5) + dobro(1));"], "task": "Crie a função <code>areaRetangulo(base, altura)<\/code> que devolve a área (base × altura). O corretor vai testar com vários valores.", "starter": "function areaRetangulo(base, altura) {\n  \n}\n\nconsole.log(areaRetangulo(3, 4));\n", "hint": "return base * altura;", "solution": "function areaRetangulo(base, altura) {\n  return base * altura;\n}\n\nconsole.log(areaRetangulo(3, 4));", "tests": [{"expect": "12\n50\n0\n7.5", "suffix": "console.log(areaRetangulo(3, 4));\nconsole.log(areaRetangulo(10, 5));\nconsole.log(areaRetangulo(0, 9));\nconsole.log(areaRetangulo(2.5, 3));"}], "require": [{"re": "\\breturn\\b", "flags": "", "msg": "A função precisa devolver o resultado com return."}], "forbid": []}, {"kind": "lesson", "id": "parametros", "title": "Parâmetros com valor padrão", "eyebrow": "Parâmetros opcionais", "body": "<p>Um parâmetro pode ter um <em>valor padrão<\/em>, usado quando quem chama não passa nada: <code>function saudar(nome, saudacao = \"Olá\")<\/code>.<\/p>\n<p>Se a função for chamada com menos valores do que parâmetros e não houver padrão, o parâmetro que faltou vale <code>undefined<\/code>.<\/p>", "examples": ["function saudar(nome, saudacao = \"Olá\") {\n  return `${saudacao}, ${nome}!`;\n}\nconsole.log(saudar(\"Ana\"));\nconsole.log(saudar(\"Leo\", \"Bom dia\"));", "function teste(a, b) {\n  console.log(a, b);\n}\nteste(1);"], "task": "Crie <code>preco(valor, desconto = 0)<\/code> que devolve o valor com o desconto em porcentagem aplicado. Exemplo: <code>preco(200, 10)<\/code> devolve <code>180<\/code> e <code>preco(50)<\/code> devolve <code>50<\/code>.", "starter": "function preco(valor, desconto = 0) {\n  \n}\n", "hint": "return valor - valor * desconto / 100;", "solution": "function preco(valor, desconto = 0) {\n  return valor - valor * desconto / 100;\n}", "tests": [{"expect": "180\n50\n75\n0", "suffix": "console.log(preco(200, 10));\nconsole.log(preco(50));\nconsole.log(preco(100, 25));\nconsole.log(preco(80, 100));"}], "require": [{"re": "desconto\\s*=\\s*0", "flags": "", "msg": "Mantenha o valor padrão desconto = 0."}], "forbid": []}, {"kind": "lesson", "id": "arrow", "title": "Arrow functions", "eyebrow": "Funções com flecha", "body": "<p>JavaScript tem um jeito mais curto de escrever funções, muito usado: a <em>arrow function<\/em>, com a flecha <code>=&gt;<\/code>. Ela costuma ser guardada numa <code>const<\/code>.<\/p>\n<p>Se o corpo for uma expressão só, dá para tirar as chaves e o <code>return<\/code>: o resultado é devolvido automaticamente. Com um parâmetro só, os parênteses também podem sumir.<\/p>", "examples": ["// As três fazem a mesma coisa\nfunction dobroA(n) {\n  return n * 2;\n}\nconst dobroB = (n) => {\n  return n * 2;\n};\nconst dobroC = n => n * 2;\n\nconsole.log(dobroA(4), dobroB(4), dobroC(4));", "const soma = (a, b) => a + b;\nconst ola = () => \"Olá!\";\nconsole.log(soma(2, 3), ola());"], "task": "Crie duas arrow functions de uma linha: <code>quadrado<\/code>, que devolve o número ao quadrado, e <code>ehPar<\/code>, que devolve <code>true<\/code> ou <code>false<\/code>.", "starter": "const quadrado = \nconst ehPar = \n", "hint": "const quadrado = n => n * n; const ehPar = n => n % 2 === 0;", "solution": "const quadrado = n => n * n;\nconst ehPar = n => n % 2 === 0;", "tests": [{"expect": "9\n100\ntrue\nfalse\ntrue", "suffix": "console.log(quadrado(3));\nconsole.log(quadrado(-10));\nconsole.log(ehPar(4));\nconsole.log(ehPar(7));\nconsole.log(ehPar(0));"}], "require": [{"re": "=>", "flags": "", "msg": "Use arrow functions, com =>."}], "forbid": []}, {"kind": "lesson", "id": "escopo", "title": "Variáveis dentro de funções", "eyebrow": "Escopo", "body": "<p>Uma variável criada com <code>let<\/code> ou <code>const<\/code> só existe dentro do bloco <code>{ }<\/code> onde nasceu. Isso é o <em>escopo<\/em>. Variáveis criadas dentro de uma função não existem fora dela.<\/p>\n<p>Já uma função consegue ler variáveis de fora. Mas o melhor caminho é a função receber o que precisa por parâmetro e devolver o resultado com <code>return<\/code>: fica mais fácil de testar e reaproveitar.<\/p>", "examples": ["const taxa = 0.1; // de fora, a função consegue ler\n\nfunction comTaxa(valor) {\n  const extra = valor * taxa; // só existe aqui dentro\n  return valor + extra;\n}\nconsole.log(comTaxa(50));\nconsole.log(typeof extra); // fora da função, extra não existe", "if (true) {\n  let dentro = \"oi\";\n}\nconsole.log(dentro); // ReferenceError"], "task": "A função no editor tenta mudar uma variável de fora e ainda usa uma variável que só existe dentro do <code>for<\/code>. Reescreva <code>contarVogais(texto)<\/code> para que ela crie o próprio contador e devolva o resultado com <code>return<\/code>.", "starter": "let contador = 0;\n\nfunction contarVogais(texto) {\n  for (const letra of texto) {\n    let achou = \"aeiou\".includes(letra);\n    if (achou) {\n      contador++;\n    }\n  }\n  console.log(achou);\n}\n\ncontarVogais(\"banana\");\nconsole.log(contador);\n", "hint": "Dentro da função: let contador = 0; no começo, e return contador; no fim. Apague o console.log(achou).", "solution": "function contarVogais(texto) {\n  let contador = 0;\n  for (const letra of texto) {\n    if (\"aeiou\".includes(letra)) {\n      contador++;\n    }\n  }\n  return contador;\n}\n\nconsole.log(contarVogais(\"banana\"));", "tests": [{"expect": "3\n0\n3\n3", "suffix": "console.log(contarVogais(\"banana\"));\nconsole.log(contarVogais(\"xyz\"));\nconsole.log(contarVogais(\"banana\"));\nconsole.log(contarVogais(\"programa\"));"}], "require": [{"re": "\\breturn\\b", "flags": "", "msg": "A função precisa devolver o total com return."}], "forbid": []}, {"kind": "lesson", "id": "recursao", "title": "Recursão", "eyebrow": "Uma função que chama a si mesma", "body": "<p>Uma função pode chamar a si mesma. Isso se chama <em>recursão<\/em> e serve para problemas que se repetem em pedaços menores.<\/p>\n<p>Toda recursão precisa de um <strong>caso base<\/strong>: a situação em que a função para de se chamar. Sem ele, ela se chama sem fim e o JavaScript mostra o erro <code>Maximum call stack size exceeded<\/code>.<\/p>", "examples": ["function contagem(n) {\n  if (n === 0) {          // caso base\n    console.log(\"Fogo!\");\n    return;\n  }\n  console.log(n);\n  contagem(n - 1);        // chama a si mesma com um número menor\n}\ncontagem(3);", "// 5! = 5 x 4 x 3 x 2 x 1\nfunction fatorial(n) {\n  if (n <= 1) return 1;\n  return n * fatorial(n - 1);\n}\nconsole.log(fatorial(5));"], "task": "Crie <code>somaAte(n)<\/code> que devolve a soma de 1 até <code>n<\/code> usando recursão (sem laços). <code>somaAte(4)<\/code> é 4 + 3 + 2 + 1 = 10.", "starter": "function somaAte(n) {\n  \n}\n", "hint": "if (n <= 0) return 0; return n + somaAte(n - 1);", "solution": "function somaAte(n) {\n  if (n <= 0) return 0;\n  return n + somaAte(n - 1);\n}", "tests": [{"expect": "10\n1\n0\n5050", "suffix": "console.log(somaAte(4));\nconsole.log(somaAte(1));\nconsole.log(somaAte(0));\nconsole.log(somaAte(100));"}], "require": [{"re": "somaAte\\s*\\([^)]*\\)[\\s\\S]*somaAte\\s*\\(", "flags": "", "msg": "A função precisa chamar a si mesma."}], "forbid": [{"re": "\\b(for|while)\\b", "flags": "", "msg": "Resolva sem laços, só com recursão."}]}, {"kind": "chal", "id": "d-maior", "title": "O maior de três (função)", "level": "Fácil", "task": "Crie a função <code>maior(a, b, c)<\/code> que devolve o maior dos três números, sem usar <code>Math.max<\/code>.", "tip": "Mesma ideia do desafio de decisões, mas agora dentro de uma função que devolve o resultado com <code>return<\/code>.", "starter": "function maior(a, b, c) {\n  \n}\n", "hint": "let m = a; if (b > m) m = b; if (c > m) m = c; return m;", "solution": "function maior(a, b, c) {\n  let m = a;\n  if (b > m) m = b;\n  if (c > m) m = c;\n  return m;\n}", "tests": [{"expect": "9\n8\n7\n-1\n5", "suffix": "console.log(maior(3, 9, 5));\nconsole.log(maior(8, 2, 1));\nconsole.log(maior(1, 2, 7));\nconsole.log(maior(-5, -1, -3));\nconsole.log(maior(5, 5, 5));"}], "require": [], "forbid": [{"re": "Math\\.max", "flags": "", "msg": "Resolva com if, sem Math.max."}]}, {"kind": "chal", "id": "d-vogais", "title": "Contando vogais", "level": "Médio", "task": "Crie <code>contarVogais(texto)<\/code> que devolve quantas vogais o texto tem, contando maiúsculas também (<code>\"Ana\"<\/code> tem 2).", "tip": "Deixe o texto em minúsculas antes com <code>.toLowerCase()<\/code>. Depois percorra letra por letra com <code>for (const letra of texto)<\/code> e teste com <code>\"aeiou\".includes(letra)<\/code>.", "starter": "function contarVogais(texto) {\n  \n}\n", "hint": "let n = 0; for (const l of texto.toLowerCase()) { if (\"aeiou\".includes(l)) n++; } return n;", "solution": "function contarVogais(texto) {\n  let n = 0;\n  for (const letra of texto.toLowerCase()) {\n    if (\"aeiou\".includes(letra)) {\n      n++;\n    }\n  }\n  return n;\n}", "tests": [{"expect": "2\n0\n5\n7", "suffix": "console.log(contarVogais(\"Ana\"));\nconsole.log(contarVogais(\"xyz\"));\nconsole.log(contarVogais(\"AEIOU\"));\nconsole.log(contarVogais(\"Programar em JavaScript\"));"}], "require": [], "forbid": []}, {"kind": "quiz", "id": "q4", "title": "Revisão: funções", "questions": [{"q": "O que este código mostra?", "code": "function f(x) {\n  x * 2;\n}\nconsole.log(f(5));", "options": ["10", "5", "undefined", "Dá erro"], "answer": 2, "why": "A função calcula x * 2 mas não devolve nada: falta o return. Sem return, a função devolve undefined."}, {"q": "Qual arrow function devolve o triplo de n?", "code": null, "options": ["const t = n => n * 3;", "const t = n => { n * 3 };", "const t => n * 3;", "function t = n * 3;"], "answer": 0, "why": "Sem chaves, o valor depois da flecha é devolvido. Com chaves, seria preciso escrever return."}, {"q": "O que é o caso base de uma recursão?", "code": null, "options": ["A primeira chamada", "A condição em que a função para de se chamar", "O valor padrão do parâmetro", "O nome da função"], "answer": 1, "why": "Sem caso base a função se chama para sempre e o programa quebra."}, {"q": "O que este código mostra?", "code": "function oi(nome = \"você\") {\n  return \"Oi, \" + nome;\n}\nconsole.log(oi());", "options": ["\"Oi, \"", "Oi, undefined", "Oi, você", "Dá erro"], "answer": 2, "why": "Como nenhum valor foi passado, o parâmetro usa o valor padrão."}]}]}, {"id": "m5", "title": "Arrays", "summary": "Listas de valores: guardar, acessar, mudar e percorrer.", "items": [{"kind": "lesson", "id": "arrays", "title": "Arrays", "eyebrow": "Vários valores juntos", "body": "<p>Um <em>array<\/em> guarda vários valores em ordem, entre colchetes: <code>[\"maçã\", \"uva\", \"pera\"]<\/code>. Cada item tem uma posição (<em>índice<\/em>) que <strong>começa do 0<\/strong>.<\/p>\n<p><code>frutas[0]<\/code> pega o primeiro, <code>frutas.length<\/code> diz quantos itens há e <code>frutas.at(-1)<\/code> pega o último. Para trocar um item, atribua na posição: <code>frutas[1] = \"kiwi\"<\/code>. Mesmo com <code>const<\/code>, o conteúdo do array pode mudar; o que não pode é trocar o array inteiro por outro.<\/p>", "examples": ["const frutas = [\"maçã\", \"uva\", \"pera\"];\nconsole.log(frutas[0]);\nconsole.log(frutas.length);\nconsole.log(frutas.at(-1));\nfrutas[1] = \"kiwi\";\nconsole.log(frutas);"], "task": "No editor há um array de temperaturas da semana. Mostre a primeira, a última e quantas são, uma por linha. Depois troque a terceira temperatura para <code>25<\/code> e mostre o array inteiro.", "starter": "const temps = [22, 24, 19, 27, 30, 26, 21];\n", "hint": "temps[0], temps.at(-1) (ou temps[temps.length - 1]), temps.length. A terceira é a posição 2: temps[2] = 25;", "solution": "const temps = [22, 24, 19, 27, 30, 26, 21];\nconsole.log(temps[0]);\nconsole.log(temps.at(-1));\nconsole.log(temps.length);\ntemps[2] = 25;\nconsole.log(temps);", "tests": [{"expect": "22\n21\n7\n[\n  22, 24, 25, 27,\n  30, 26, 21\n]"}], "require": [{"re": "temps\\s*\\[\\s*2\\s*\\]\\s*=", "flags": "", "msg": "Troque a terceira temperatura com temps[2] = 25;"}], "forbid": []}, {"kind": "lesson", "id": "arrays2", "title": "Mexendo em arrays", "eyebrow": "push, pop, includes, indexOf", "body": "<p>Arrays têm métodos para mudar e procurar itens:<\/p>\n<p><code>push(x)<\/code> coloca no fim; <code>pop()<\/code> tira o último (e devolve ele); <code>unshift(x)<\/code> coloca no começo; <code>shift()<\/code> tira o primeiro. Para procurar: <code>includes(x)<\/code> diz se existe (<code>true<\/code>/<code>false<\/code>) e <code>indexOf(x)<\/code> diz a posição (ou <code>-1<\/code> se não achar). <code>splice(posição, quantos)<\/code> remove itens do meio.<\/p>", "examples": ["const fila = [\"Ana\", \"Leo\"];\nfila.push(\"Bia\");\nconsole.log(fila);\nconst primeiro = fila.shift();\nconsole.log(primeiro, \"foi atendido\");\nconsole.log(fila.includes(\"Leo\"), fila.indexOf(\"Bia\"), fila.indexOf(\"Zé\"));", "const nums = [10, 20, 30, 40];\nnums.splice(1, 2); // a partir da posição 1, remove 2\nconsole.log(nums);"], "task": "Uma lista de compras começa vazia. Leia itens até a pessoa digitar <code>fim<\/code> e coloque cada um no array, <strong>sem repetir<\/strong> itens que já estão lá. No fim, mostre a quantidade e o array.", "starter": "const compras = [];\n", "hint": "while (true) { const item = prompt(\"Item: \"); if (item === \"fim\") break; if (!compras.includes(item)) compras.push(item); } console.log(compras.length); console.log(compras);", "solution": "const compras = [];\nwhile (true) {\n  const item = prompt(\"Item: \");\n  if (item === \"fim\") break;\n  if (!compras.includes(item)) {\n    compras.push(item);\n  }\n}\nconsole.log(compras.length);\nconsole.log(compras);", "tests": [{"expect": "3\n[ 'arroz', 'feijão', 'café' ]", "inputs": ["arroz", "feijão", "arroz", "café", "fim"]}, {"expect": "0\n[]", "inputs": ["fim"]}], "require": [{"re": "\\.push\\(", "flags": "", "msg": "Use push para colocar itens no array."}, {"re": "includes|indexOf", "flags": "", "msg": "Use includes (ou indexOf) para não repetir itens."}], "forbid": []}, {"kind": "lesson", "id": "percorrer", "title": "Percorrendo arrays", "eyebrow": "for...of", "body": "<p>Para passar por todos os itens, o jeito mais simples é o <code>for...of<\/code>: <code>for (const nota of notas)<\/code> pega um item por volta.<\/p>\n<p>Quando você também precisa da posição, use o <code>for<\/code> com índice, indo de <code>0<\/code> até <code>length - 1<\/code>. Ou use <code>arr.entries()<\/code>, que entrega posição e item juntos.<\/p>", "examples": ["const notas = [7, 9, 5, 10];\nlet soma = 0;\nfor (const nota of notas) {\n  soma += nota;\n}\nconsole.log(\"Média:\", soma / notas.length);", "const nomes = [\"Ana\", \"Leo\", \"Bia\"];\nfor (let i = 0; i < nomes.length; i++) {\n  console.log(i + 1, nomes[i]);\n}\nfor (const [i, nome] of nomes.entries()) {\n  console.log(`${i}: ${nome}`);\n}"], "task": "Crie <code>resumo(numeros)<\/code> que devolve um texto com o menor, o maior e a soma, no formato <code>menor 2, maior 9, soma 20<\/code>. Percorra o array com um laço (sem <code>Math.min<\/code>/<code>Math.max<\/code>).", "starter": "function resumo(numeros) {\n  \n}\n", "hint": "let menor = numeros[0], maior = numeros[0], soma = 0; for (const n of numeros) { ... } return `menor ${menor}, maior ${maior}, soma ${soma}`;", "solution": "function resumo(numeros) {\n  let menor = numeros[0];\n  let maior = numeros[0];\n  let soma = 0;\n  for (const n of numeros) {\n    if (n < menor) menor = n;\n    if (n > maior) maior = n;\n    soma += n;\n  }\n  return `menor ${menor}, maior ${maior}, soma ${soma}`;\n}", "tests": [{"expect": "menor 2, maior 9, soma 20\nmenor 5, maior 5, soma 5\nmenor -4, maior 3, soma -1", "suffix": "console.log(resumo([4, 2, 9, 5]));\nconsole.log(resumo([5]));\nconsole.log(resumo([3, -4, 0]));"}], "require": [], "forbid": [{"re": "Math\\.(min|max)", "flags": "", "msg": "Percorra o array com um laço, sem Math.min/Math.max."}]}, {"kind": "lesson", "id": "spread", "title": "Copiando e juntando", "eyebrow": "Spread ... e sort", "body": "<p>Os três pontinhos <code>...<\/code> (o <em>spread<\/em>) \"espalham\" os itens de um array. Com eles você copia (<code>[...a]<\/code>) e junta arrays (<code>[...a, ...b]<\/code>). Isso importa porque <code>const b = a<\/code> <strong>não copia<\/strong>: as duas variáveis apontam para o mesmo array.<\/p>\n<p>Para ordenar números, use <code>sort((a, b) =&gt; a - b)<\/code>. Sem essa função, o <code>sort<\/code> ordena como texto e o 10 vem antes do 9. O <code>sort<\/code> muda o próprio array; <code>toSorted<\/code> devolve uma cópia ordenada.<\/p>", "examples": ["const a = [1, 2];\nconst b = a;        // não é cópia!\nb.push(3);\nconsole.log(a);\nconst c = [...a];   // cópia de verdade\nc.push(4);\nconsole.log(a, c);\nconsole.log([...a, ...c, 99]);", "const nums = [10, 9, 1, 25];\nconsole.log([...nums].sort());           // ordem de texto\nconsole.log(nums.toSorted((a, b) => a - b));\nconsole.log(nums.toSorted((a, b) => b - a));"], "task": "Crie <code>top3(pontos)<\/code> que devolve um array novo com as 3 maiores pontuações, da maior para a menor, <strong>sem alterar<\/strong> o array original.", "starter": "function top3(pontos) {\n  \n}\n", "hint": "const copia = [...pontos]; copia.sort((a, b) => b - a); return copia.slice(0, 3);", "solution": "function top3(pontos) {\n  const copia = [...pontos];\n  copia.sort((a, b) => b - a);\n  return copia.slice(0, 3);\n}", "tests": [{"expect": "[ 90, 75, 40 ]\n[ 40, 90, 12, 75, 8 ]\n[ 100, 5 ]", "suffix": "const p = [40, 90, 12, 75, 8];\nconsole.log(top3(p));\nconsole.log(p);\nconsole.log(top3([5, 100]));"}], "require": [], "forbid": []}, {"kind": "chal", "id": "d-acima", "title": "Notas acima da média", "level": "Médio", "task": "Crie <code>acimaDaMedia(notas)<\/code> que devolve um array só com as notas maiores que a média do array.", "tip": "Primeiro calcule a média com um laço. Depois percorra de novo e use <code>push<\/code> num array novo para as notas maiores que ela.", "starter": "function acimaDaMedia(notas) {\n  \n}\n", "hint": "let soma = 0; for (const n of notas) soma += n; const media = soma / notas.length; const r = []; for (const n of notas) if (n > media) r.push(n); return r;", "solution": "function acimaDaMedia(notas) {\n  let soma = 0;\n  for (const n of notas) soma += n;\n  const media = soma / notas.length;\n  const resultado = [];\n  for (const n of notas) {\n    if (n > media) resultado.push(n);\n  }\n  return resultado;\n}", "tests": [{"expect": "[ 9, 10 ]\n[]\n[ 8 ]", "suffix": "console.log(acimaDaMedia([5, 9, 6, 10]));\nconsole.log(acimaDaMedia([7, 7, 7]));\nconsole.log(acimaDaMedia([2, 8, 4]));"}], "require": [], "forbid": []}, {"kind": "quiz", "id": "q5", "title": "Revisão: arrays", "questions": [{"q": "O que este código mostra?", "code": "const a = [\"x\", \"y\", \"z\"];\nconsole.log(a[1]);", "options": ["\"x\"", "y", "z", "undefined"], "answer": 1, "why": "A contagem começa do 0: a posição 1 é o segundo item."}, {"q": "Qual método coloca um item no fim do array?", "code": null, "options": ["pop", "push", "shift", "add"], "answer": 1, "why": "push coloca no fim; pop tira do fim."}, {"q": "O que este código mostra?", "code": "const a = [1, 2];\nconst b = a;\nb.push(3);\nconsole.log(a.length);", "options": ["2", "3", "1", "Dá erro"], "answer": 1, "why": "b = a não copia: a e b são o mesmo array. Para copiar, use [...a]."}, {"q": "Quanto vale [3, 1, 2].indexOf(5)?", "code": null, "options": ["0", "undefined", "-1", "false"], "answer": 2, "why": "indexOf devolve -1 quando o item não está no array."}, {"q": "Como ordenar números do menor para o maior?", "code": null, "options": ["nums.sort()", "nums.sort((a, b) => a - b)", "nums.order()", "sort(nums)"], "answer": 1, "why": "Sem a função de comparação, sort ordena como texto e 10 vem antes de 9."}]}]}, {"id": "m6", "title": "Objetos", "summary": "Agrupar informações com nome: propriedades, arrays de objetos, desestruturação e JSON.", "items": [{"kind": "lesson", "id": "objetos", "title": "Objetos", "eyebrow": "Pares de chave e valor", "body": "<p>Um <em>objeto<\/em> junta várias informações sobre uma coisa, cada uma com um nome (a <em>chave<\/em> ou <em>propriedade<\/em>). Ele é escrito entre chaves: <code>{ nome: \"Ana\", idade: 20 }<\/code>.<\/p>\n<p>Para ler uma propriedade use o ponto: <code>pessoa.nome<\/code>. Para mudar ou criar, atribua: <code>pessoa.cidade = \"Natal\"<\/code>. Quando o nome da chave está numa variável, use colchetes: <code>pessoa[campo]<\/code>. Ler uma chave que não existe dá <code>undefined<\/code>, e <code>delete pessoa.idade<\/code> apaga uma.<\/p>", "examples": ["const pessoa = { nome: \"Ana\", idade: 20 };\nconsole.log(pessoa.nome);\npessoa.idade = 21;\npessoa.cidade = \"Natal\";\nconsole.log(pessoa);\nconst campo = \"cidade\";\nconsole.log(pessoa[campo]);\nconsole.log(pessoa.telefone);", "// Objetos podem guardar arrays, outros objetos e até funções\nconst filme = {\n  titulo: \"Central do Brasil\",\n  ano: 1998,\n  elenco: [\"Fernanda\", \"Vinícius\"],\n  descrever() {\n    return `${this.titulo} (${this.ano})`;\n  },\n};\nconsole.log(filme.elenco[0]);\nconsole.log(filme.descrever());"], "task": "Crie o objeto <code>livro<\/code> com <code>titulo<\/code> <code>\"Dom Casmurro\"<\/code>, <code>autor<\/code> <code>\"Machado de Assis\"<\/code> e <code>paginas<\/code> 256. Depois acrescente a propriedade <code>lido<\/code> com <code>true<\/code> e mostre <code>Dom Casmurro, de Machado de Assis<\/code> usando as propriedades.", "starter": "const livro = {\n  \n};\n", "hint": "const livro = { titulo: \"Dom Casmurro\", autor: \"Machado de Assis\", paginas: 256 }; livro.lido = true; console.log(`${livro.titulo}, de ${livro.autor}`);", "solution": "const livro = {\n  titulo: \"Dom Casmurro\",\n  autor: \"Machado de Assis\",\n  paginas: 256,\n};\nlivro.lido = true;\nconsole.log(`${livro.titulo}, de ${livro.autor}`);", "tests": [{"expect": "Dom Casmurro, de Machado de Assis"}, {"expect": "{\n  titulo: 'Dom Casmurro',\n  autor: 'Machado de Assis',\n  paginas: 256,\n  lido: true\n}", "suffix": "console.log(livro);"}], "require": [{"re": "livro\\.lido\\s*=", "flags": "", "msg": "Acrescente a propriedade depois de criar o objeto: livro.lido = true;"}, {"re": "livro\\.titulo", "flags": "", "msg": "Use livro.titulo para montar a frase."}], "forbid": []}, {"kind": "lesson", "id": "percorrer-obj", "title": "Percorrendo objetos", "eyebrow": "Object.keys, values e entries", "body": "<p>Para passar por todas as chaves de um objeto, use <code>Object.keys(obj)<\/code> (array com as chaves), <code>Object.values(obj)<\/code> (os valores) ou <code>Object.entries(obj)<\/code> (pares <code>[chave, valor]<\/code>).<\/p>\n<p>O par do <code>entries<\/code> pode ser desmontado direto no laço: <code>for (const [chave, valor] of Object.entries(obj))<\/code>. Para saber se uma chave existe, use <code>\"chave\" in obj<\/code>.<\/p>", "examples": ["const estoque = { banana: 12, maçã: 0, uva: 30 };\nconsole.log(Object.keys(estoque));\nconsole.log(Object.values(estoque));\nfor (const [fruta, qtd] of Object.entries(estoque)) {\n  console.log(`${fruta}: ${qtd}`);\n}\nconsole.log(\"uva\" in estoque, \"kiwi\" in estoque);", "// Usando um objeto para contar coisas\nconst votos = [\"azul\", \"verde\", \"azul\", \"rosa\", \"azul\"];\nconst contagem = {};\nfor (const cor of votos) {\n  contagem[cor] = (contagem[cor] || 0) + 1;\n}\nconsole.log(contagem);"], "task": "Crie <code>contarLetras(palavra)<\/code> que devolve um objeto com quantas vezes cada letra aparece. <code>contarLetras(\"arara\")<\/code> devolve <code>{ a: 3, r: 2 }<\/code>.", "starter": "function contarLetras(palavra) {\n  const contagem = {};\n  \n  return contagem;\n}\n", "hint": "for (const letra of palavra) { contagem[letra] = (contagem[letra] || 0) + 1; }", "solution": "function contarLetras(palavra) {\n  const contagem = {};\n  for (const letra of palavra) {\n    contagem[letra] = (contagem[letra] || 0) + 1;\n  }\n  return contagem;\n}", "tests": [{"expect": "{ a: 3, r: 2 }\n{ o: 2, v: 1 }\n{}", "suffix": "console.log(contarLetras(\"arara\"));\nconsole.log(contarLetras(\"ovo\"));\nconsole.log(contarLetras(\"\"));"}], "require": [], "forbid": []}, {"kind": "lesson", "id": "lista-objetos", "title": "Arrays de objetos", "eyebrow": "Dados de verdade", "body": "<p>Na prática, quase todos os dados chegam como um <strong>array de objetos<\/strong>: uma lista de produtos, de alunos, de mensagens. Cada item do array é um objeto com as mesmas chaves.<\/p>\n<p>Você percorre o array com <code>for...of<\/code> e lê as propriedades de cada item.<\/p>", "examples": ["const alunos = [\n  { nome: \"Ana\", nota: 8 },\n  { nome: \"Leo\", nota: 5 },\n  { nome: \"Bia\", nota: 9.5 },\n];\nfor (const aluno of alunos) {\n  const situacao = aluno.nota >= 7 ? \"aprovado\" : \"recuperação\";\n  console.log(`${aluno.nome}: ${situacao}`);\n}\nalunos.push({ nome: \"Davi\", nota: 7 });\nconsole.log(alunos.length, \"alunos\");"], "task": "Crie <code>totalCarrinho(itens)<\/code>: cada item tem <code>preco<\/code> e <code>qtd<\/code>. Devolva o valor total (preço × quantidade de cada um, somados).", "starter": "function totalCarrinho(itens) {\n  \n}\n", "hint": "let total = 0; for (const item of itens) { total += item.preco * item.qtd; } return total;", "solution": "function totalCarrinho(itens) {\n  let total = 0;\n  for (const item of itens) {\n    total += item.preco * item.qtd;\n  }\n  return total;\n}", "tests": [{"expect": "37\n0\n100", "suffix": "console.log(totalCarrinho([{ nome: \"pão\", preco: 1, qtd: 10 }, { nome: \"leite\", preco: 9, qtd: 3 }]));\nconsole.log(totalCarrinho([]));\nconsole.log(totalCarrinho([{ nome: \"tênis\", preco: 100, qtd: 1 }]));"}], "require": [], "forbid": []}, {"kind": "lesson", "id": "desestruturar", "title": "Desestruturação e spread", "eyebrow": "Tirando e juntando partes", "body": "<p>A <em>desestruturação<\/em> tira valores de um objeto ou array direto para variáveis: <code>const { nome, idade } = pessoa<\/code> cria duas variáveis de uma vez. Com arrays, a ordem é que manda: <code>const [primeiro, segundo] = lista<\/code>.<\/p>\n<p>O <em>spread<\/em> <code>...<\/code> também funciona com objetos: <code>{ ...pessoa, idade: 30 }<\/code> cria uma cópia trocando só a idade. Funções também podem desestruturar o parâmetro: <code>function f({ nome })<\/code>.<\/p>", "examples": ["const pessoa = { nome: \"Ana\", idade: 20, cidade: \"Natal\" };\nconst { nome, cidade } = pessoa;\nconsole.log(nome, cidade);\n\nconst [a, b] = [10, 20, 30];\nconsole.log(a, b);\n\nconst maisVelha = { ...pessoa, idade: 21 };\nconsole.log(maisVelha, pessoa.idade);", "function apresentar({ nome, idade }) {\n  return `${nome} tem ${idade} anos`;\n}\nconsole.log(apresentar({ nome: \"Leo\", idade: 31 }));"], "task": "Crie <code>etiqueta(produto)<\/code> que recebe um objeto com <code>nome<\/code>, <code>preco<\/code> e <code>marca<\/code>, usa desestruturação e devolve <code>NOME - R$ preco<\/code> (nome em maiúsculas). Crie também <code>comDesconto(produto)<\/code> que devolve uma <strong>cópia<\/strong> do produto com o preço pela metade, sem mudar o original.", "starter": "function etiqueta(produto) {\n  \n}\n\nfunction comDesconto(produto) {\n  \n}\n", "hint": "const { nome, preco } = produto; return `${nome.toUpperCase()} - R$ ${preco}`; e return { ...produto, preco: produto.preco / 2 };", "solution": "function etiqueta(produto) {\n  const { nome, preco } = produto;\n  return `${nome.toUpperCase()} - R$ ${preco}`;\n}\n\nfunction comDesconto(produto) {\n  return { ...produto, preco: produto.preco / 2 };\n}", "tests": [{"expect": "CANECA - R$ 30\n{ nome: 'caneca', preco: 15, marca: 'X' }\n30\nCANECA - R$ 15", "suffix": "const p = { nome: \"caneca\", preco: 30, marca: \"X\" };\nconsole.log(etiqueta(p));\nconst d = comDesconto(p);\nconsole.log(d);\nconsole.log(p.preco);\nconsole.log(etiqueta(d));"}], "require": [{"re": "(const|let)\\s*\\{[^}]*\\}\\s*=|\\(\\s*\\{[^}]*\\}\\s*\\)", "flags": "", "msg": "Use desestruturação: const { nome, preco } = produto;"}, {"re": "\\.\\.\\.", "flags": "", "msg": "Use o spread ... para copiar o produto."}], "forbid": []}, {"kind": "lesson", "id": "json", "title": "JSON", "eyebrow": "Texto que vira objeto", "body": "<p><em>JSON<\/em> é o formato de texto que sites e aplicativos usam para trocar dados. Ele parece muito com um objeto JavaScript, mas as chaves sempre têm aspas duplas.<\/p>\n<p><code>JSON.stringify(obj)<\/code> transforma um objeto em texto JSON, e <code>JSON.parse(texto)<\/code> faz o caminho de volta. Um terceiro argumento no stringify deixa o texto organizado: <code>JSON.stringify(obj, null, 2)<\/code>.<\/p>", "examples": ["const config = { tema: \"escuro\", fonte: 16, atalhos: [\"ctrl\", \"s\"] };\nconst texto = JSON.stringify(config);\nconsole.log(texto);\nconsole.log(typeof texto);\nconsole.log(JSON.stringify(config, null, 2));", "const resposta = '{\"usuario\": \"bia\", \"pontos\": 120}';\nconst dados = JSON.parse(resposta);\nconsole.log(dados.pontos + 10);"], "task": "A variável <code>resposta<\/code> tem um texto JSON com uma lista de pedidos. Transforme em objeto e mostre quantos pedidos há e a soma dos valores, no formato <code>3 pedidos, total 57.5<\/code>.", "starter": "const resposta = '[{\"id\": 1, \"valor\": 20}, {\"id\": 2, \"valor\": 12.5}, {\"id\": 3, \"valor\": 25}]';\n", "hint": "const pedidos = JSON.parse(respost
