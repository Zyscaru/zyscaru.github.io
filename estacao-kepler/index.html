<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Jogo de JavaScript avançado: geradores, classes com campos privados, async avançado, Proxy, regex, heap e Dijkstra numa estação espacial.">
<meta name="theme-color" content="#05070d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kepler">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Estação Kepler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sala de controle — briefing + editor à esquerda, planta da estação fixa à direita.
   Visual único e escuro (estação espacial em órbita), escolhido de propósito. */
:root{
  color-scheme: dark;
  --bg:#05070d; --panel:#0e131f; --panel-2:#141b2b; --ink:#e9eef7; --ink-soft:#93a0b8; --line:#232d42;
  --track:#0f1626; --track-2:#111a2c; --rail:#41e0c4; --bld:#2a3245; --bld-hi:#46526e; --bld-lo:#1b2232; --win:#7e8aa6;
  --train:#e9eef7; --nose:#ff8a3d; --station:#41e0c4; --cargo:#ffb347; --boost:#c792ff; --campo:#7b4dff;
  --accent:#ff8a3d; --accent-ink:#1d0d02; --hot:#ff5c8a;
  --code-bg:#070a12; --code-fg:#e3e9f5; --code-dim:#66728c; --key:#161e30;
  --ok:#5ff2a6; --ok-bg:#0f2f24; --err:#ff8f9a; --err-bg:#371520; --star:#ffd166; --star-off:#283147;
  --kx:#ff5c5c; --ky:#4da3ff; --kz:#5ff2a6;
  --l0:#ff8a3d; --l1:#41e0c4; --l2:#8fa7ff; --l3:#ff5c8a; --l4:#c792ff; --l5:#ffd166;
  --f-display:"Sora", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-code:"JetBrains Mono", ui-monospace, Consolas, monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:radial-gradient(1px 1px at 12% 18%, #fff8 99%, transparent), radial-gradient(1px 1px at 72% 9%, #fff6 99%, transparent), radial-gradient(1.5px 1.5px at 38% 62%, #fff5 99%, transparent), radial-gradient(1px 1px at 88% 44%, #fff7 99%, transparent), radial-gradient(1px 1px at 55% 30%, #fff4 99%, transparent), radial-gradient(900px 380px at 90% -180px, #3a1d0c 0%, transparent 70%), radial-gradient(700px 320px at -10% 0%, #0b2a33 0%, transparent 70%), var(--bg);background-color:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1340px;margin:0 auto;padding-block:14px 4px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:1.5rem;letter-spacing:-.01em;line-height:1}
.logo div{white-space:nowrap}
.logo small{display:block;font-family:var(--f-code);font-weight:400;font-size:.68rem;letter-spacing:.08em;color:var(--ink-soft);margin-top:4px}
.logo svg{width:42px;height:42px;flex:none}
.top-r{display:flex;align-items:center;gap:8px}
.pill{display:flex;align-items:center;gap:6px;white-space:nowrap;border:1.5px solid var(--line);background:var(--panel);border-radius:99px;padding:6px 12px;font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums}
.pill .st{color:var(--star)}
.btn{border:1.5px solid var(--line);background:var(--panel-2);border-radius:10px;padding:9px 16px;font-weight:700;font-size:.92rem;min-height:42px;color:var(--ink)}
.btn:hover{border-color:var(--ink-soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-soft);font-weight:600}
.btn:disabled{opacity:.5;cursor:not-allowed}

.wrap{max-width:1340px;margin:0 auto;padding-block:10px 40px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.game{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"mission board" "editor board";gap:16px;align-items:start}
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;min-width:0}
.mission{grid-area:mission;padding:20px 22px;border-top:4px solid var(--lc)}
.boardcard{grid-area:board;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);padding:14px;display:flex;flex-direction:column;gap:10px}
.edcol{grid-area:editor;display:flex;flex-direction:column;gap:10px;min-width:0}
.eyebrow{font-family:var(--f-code);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--lc)}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(1.7rem,3vw,2.3rem);line-height:1.05;margin:6px 0 12px;letter-spacing:-.02em;text-wrap:balance}
.mission p{margin:0 0 10px;max-width:64ch}
.mission code,.ref code{font-family:var(--f-code);font-size:.84em;background:var(--panel-2);padding:1px 5px;border-radius:4px;color:var(--ink)}
.mission pre,.ref pre{background:var(--code-bg);color:var(--code-fg);font-family:var(--f-code);font-size:.82rem;border-radius:10px;padding:10px 14px;margin:0 0 12px;overflow-x:auto;border:1px solid var(--line)}
.task{background:linear-gradient(135deg,#2a1608,#141018);border:1.5px solid var(--accent);border-radius:12px;padding:12px 14px;margin:6px 0 4px}
.task strong{display:block;font-family:var(--f-code);text-transform:uppercase;letter-spacing:.1em;font-size:.76rem;color:var(--accent);margin-bottom:4px}
.task p{margin:0}
details.ref{margin-top:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--panel-2)}
details.ref summary{cursor:pointer;padding:10px 14px;font-family:var(--f-code);letter-spacing:.06em;text-transform:uppercase;font-size:.8rem;color:var(--ink-soft);list-style:none}
details.ref summary::-webkit-details-marker{display:none}
details.ref summary::before{content:"▸ ";color:var(--accent)}
details.ref[open] summary::before{content:"▾ "}
.refbody{padding:0 14px 12px;display:flex;flex-direction:column;gap:10px;font-size:.88rem}
.goal{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.85rem;color:var(--ink-soft);margin-top:10px}
.goal b{color:var(--ink)}

/* editor */
.editor{background:var(--code-bg);border-radius:14px;overflow:hidden;border:1.5px solid var(--line)}
.ed-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px 9px 16px;border-bottom:1px solid var(--line);color:var(--code-dim);font-family:var(--f-code);font-size:.78rem}
.ed-body{display:grid;grid-template-columns:42px 1fr;min-height:260px;max-height:62vh;overflow:auto}
.gutter{padding:12px 8px 12px 0;text-align:right;font-family:var(--f-code);font-size:.86rem;line-height:1.6;color:#454e80;user-select:none;white-space:pre;font-variant-numeric:tabular-nums}
#code{background:transparent;color:var(--code-fg);border:0;resize:none;outline:none;padding:12px 12px 12px 10px;font-family:var(--f-code);font-size:.86rem;line-height:1.6;white-space:pre;overflow:hidden;tab-size:2;caret-color:var(--accent);min-height:260px;width:100%}
.keys{display:flex;gap:6px;overflow-x:auto;padding:8px;border-top:1px solid var(--line);scrollbar-width:none}
.keys::-webkit-scrollbar{display:none}
.keys button{flex:0 0 auto;min-width:40px;height:40px;padding:0 10px;border:0;border-radius:8px;background:var(--key);color:var(--code-fg);font-family:var(--f-code);font-size:.88rem}
.keys button:active{background:var(--line)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.speed{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;margin-left:auto}
.speed button{border:0;background:var(--panel);padding:8px 10px;font-size:.8rem;font-weight:700;color:var(--ink-soft)}
.speed button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.feedback{border-radius:12px;padding:12px 14px;font-size:.93rem;display:flex;flex-direction:column;gap:6px;overflow-wrap:anywhere}
.feedback.ok{background:var(--ok-bg);color:var(--ok);border:1.5px solid var(--ok)}
.feedback.bad{background:var(--err-bg);color:var(--err);border:1.5px solid var(--err)}
.feedback b{font-family:var(--f-display);font-size:1.05rem}
.feedback .row{display:flex;gap:8px;flex-wrap:wrap}
.feedback .btn{font-size:.85rem;padding:6px 12px;min-height:36px}
.hint{color:var(--ink);background:var(--panel);border-radius:8px;padding:8px 10px;font-size:.86rem;white-space:pre-wrap}
.solution{background:var(--code-bg);color:var(--code-fg);border-radius:8px;padding:10px 12px;font-family:var(--f-code);font-size:.8rem;white-space:pre;overflow-x:auto;margin:0;border:1px solid var(--line);max-height:360px}

/* cidade */
.bhead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.8rem;color:var(--ink-soft);font-variant-numeric:tabular-nums;font-family:var(--f-code)}
.bhead b{color:var(--ink)}
.maps{display:flex;gap:6px;flex-wrap:wrap}
.maps button{border:1.5px solid var(--line);background:var(--panel-2);border-radius:8px;padding:3px 9px;font-size:.76rem;font-weight:700;color:var(--ink-soft)}
.maps button[aria-current="true"]{border-color:var(--ink);color:var(--ink)}
.maps button.ok{border-color:var(--ok);color:var(--ok);background:var(--ok-bg)}
.maps button.bad{border-color:var(--err);color:var(--err);background:var(--err-bg)}
.stage{position:relative;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 0%, #182238 0%, #05070d 75%);border-radius:12px;padding:12px;overflow:hidden;min-height:200px;border:1px solid var(--line)}
.board{position:relative;display:grid;gap:0}
.cell{width:var(--c);height:var(--c);position:relative}
.cell.t{background:var(--track)}
.cell.t.alt{background:var(--track-2)}
.cell.t{box-shadow:inset 0 0 0 1px #1a2338}
.cell.t::before{content:"";position:absolute;inset:38%;border-radius:2px;background:var(--rail);opacity:.18}
.campo{position:absolute;inset:6%;border-radius:20%;background:radial-gradient(circle,rgba(123,77,255,calc(var(--k)*.09)),transparent 75%);border:1.5px dashed rgba(199,146,255,.55);display:grid;place-items:center;color:#d9c6ff;font-family:var(--f-code);font-weight:700;font-size:calc(var(--c)*.42)}
.porta{position:absolute;inset:4%;border-radius:4px;background:repeating-linear-gradient(90deg,var(--k) 0 14%,transparent 14% 28%);border:2px solid var(--k);display:grid;place-items:center;transition:opacity .4s}
.porta b{background:var(--bg);color:var(--k);font-family:var(--f-display);font-size:calc(var(--c)*.34);padding:0 3px;border-radius:3px;line-height:1.2}
.porta.aberta{opacity:.22}
.cartao{position:absolute;inset:24% 18%;border-radius:4px;background:var(--k);box-shadow:0 0 calc(var(--c)*.3) var(--k);display:grid;place-items:center;color:#05070d;font-family:var(--f-display);font-weight:700;font-size:calc(var(--c)*.3);z-index:2;transition:transform .3s,opacity .3s}
.cartao.got{transform:translateY(-80%) scale(.3);opacity:0}
.cell.b{background:var(--bg)}
.cell.b::after{content:"";position:absolute;inset:0;background:
  radial-gradient(circle at 18% 18%, var(--win) 0 5%, transparent 6%), radial-gradient(circle at 82% 18%, var(--win) 0 5%, transparent 6%),
  radial-gradient(circle at 18% 82%, var(--win) 0 5%, transparent 6%), radial-gradient(circle at 82% 82%, var(--win) 0 5%, transparent 6%),
  linear-gradient(150deg,var(--bld-hi),var(--bld) 50%,var(--bld-lo));box-shadow:inset 0 0 0 1px #0007}
.cell.b.v2::after{opacity:.92}
.cell.b.v3::after{opacity:.85}
.est{position:absolute;inset:12%;border-radius:30%;background:var(--station);color:#03211b;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:calc(var(--c)*.42);box-shadow:0 0 calc(var(--c)*.3) rgba(65,224,196,.45);z-index:1}
.box{position:absolute;inset:22%;border-radius:3px;background:linear-gradient(135deg,#ffd9a0,var(--cargo) 50%,#c97a1d);box-shadow:0 0 10px rgba(255,179,71,.5);z-index:2;transition:transform .3s,opacity .3s}
.box::after{content:"";position:absolute;left:45%;top:0;bottom:0;width:10%;background:#8a4d0e;opacity:.6}
.box.got{transform:translateY(-80%) scale(.3);opacity:0}
.boost{position:absolute;inset:0;display:grid;place-items:center;color:var(--boost);font-family:var(--f-code);font-weight:700;font-size:calc(var(--c)*.6);transform:rotate(var(--r));text-shadow:0 0 8px var(--boost)}
.boost span{animation:flow 1s linear infinite}
@keyframes flow{0%{transform:translateX(-16%);opacity:.5}50%{opacity:1}100%{transform:translateX(16%);opacity:.5}}
.garage{position:absolute;inset:4%;z-index:1}
.robot{position:absolute;left:0;top:0;width:var(--c);height:var(--c);z-index:5;transition:transform var(--spd,180ms) ease-in-out}
.robot svg{width:100%;height:100%;transition:transform var(--spd,180ms) ease-in-out;filter:drop-shadow(0 0 6px rgba(255,138,61,.7))}
.robot.crash svg{animation:shake .35s}
@keyframes shake{0%,100%{translate:0}25%{translate:-8% 0}75%{translate:8% 0}}
.boom{position:absolute;width:var(--c);height:var(--c);border-radius:50%;background:radial-gradient(circle,#fff,var(--hot) 40%,transparent 70%);opacity:.85;z-index:6;animation:fade 1s forwards}
.blk{position:absolute;width:var(--c);height:var(--c);border:3px solid var(--hot);border-radius:6px;z-index:6;animation:fade .8s forwards}
@keyframes fade{to{opacity:0}}
.bubble{position:absolute;z-index:8;transform:translate(-50%,-110%);background:var(--ink);color:var(--bg);border-radius:8px;padding:2px 9px;font-weight:700;font-family:var(--f-code);font-size:.78rem;white-space:nowrap;max-width:none;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.bubble::after{content:"";position:absolute;left:50%;bottom:-5px;width:10px;height:10px;background:inherit;transform:translateX(-50%) rotate(45deg)}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(5,7,13,.86);z-index:10;padding:16px}
.win{background:var(--panel);border:2px solid var(--accent);border-radius:16px;padding:18px 20px;text-align:center;max-width:340px;display:flex;flex-direction:column;gap:8px;align-items:center}
.win b{font-family:var(--f-display);font-size:1.5rem}
.stars{display:flex;gap:4px;font-size:2rem;line-height:1}
.stars span{color:var(--star-off)}
.stars span.on{color:var(--star)}
.win .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.out{font-family:var(--f-code);font-size:.78rem;color:var(--ink-soft);white-space:pre-wrap;max-height:90px;overflow:auto;border-top:1px dashed var(--line);padding-top:6px}
.out:empty{display:none}
.note{font-size:.84rem;color:var(--ink-soft);overflow-wrap:anywhere;font-family:var(--f-code)}
.note:empty{display:none}
.legend{display:flex;gap:6px 12px;flex-wrap:wrap;font-size:.76rem;color:var(--ink-soft)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none}

/* mapa de linhas */
.levels{display:flex;flex-direction:column;gap:14px}
.world{padding:18px 20px 20px;border-left:6px solid var(--lc)}
.world h2{font-family:var(--f-display);margin:0;font-size:1.35rem;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.world h2 i{width:14px;height:14px;border-radius:50%;background:var(--lc);box-shadow:0 0 10px var(--lc);flex:none}
.world p{margin:2px 0 14px;color:var(--ink-soft);font-size:.92rem}
.metro{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));position:relative;gap:10px}
.metro::before{content:"";position:absolute;left:calc(100%/6);right:calc(100%/6);top:17px;height:6px;border-radius:3px;background:var(--lc);opacity:.85}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;border:0;background:none;padding:0 4px;color:var(--ink)}
.tile .dot{width:40px;height:40px;border-radius:50%;background:var(--bg);border:5px solid var(--lc);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:.95rem;position:relative;z-index:1;transition:transform .15s}
.tile:hover:not(:disabled) .dot{transform:scale(1.1)}
.tile.done .dot{background:var(--lc);color:var(--bg)}
.tile.next .dot{box-shadow:0 0 0 4px var(--bg),0 0 0 7px var(--accent)}
.tile b{font-size:.92rem;line-height:1.2;margin-top:4px}
.tile .s{font-size:.95rem;letter-spacing:2px}
.tile .s span{color:var(--star-off)} .tile .s span.on{color:var(--star)}
.tile:disabled{opacity:.45;cursor:not-allowed}
.intro-card{padding:20px 22px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.intro-card p{margin:0;max-width:66ch}
.intro-card .pre{font-size:.86rem;color:var(--ink-soft);margin-top:6px}
.loading{font-size:.8rem;color:var(--code-dim)}

@media (max-width:1020px){
  .game{grid-template-columns:minmax(0,1fr);grid-template-areas:"mission" "board" "editor"}
  .boardcard{position:static}
}
@media (max-width:600px){
  .mission{padding:16px}
  .top{gap:8px}
  .logo{font-size:1.05rem;gap:8px;min-width:0}
  .logo div{white-space:normal;line-height:1.05}
  .pill{padding:5px 9px}
  .logo svg{width:34px;height:34px}
  .logo small{display:none}
  .top .btn{padding:8px 12px}
  #code,.gutter{font-size:15px}
  .actions .btn{flex:1}
  .speed{margin-left:0;width:100%}
  .speed button{flex:1}
  .stage{min-height:240px}
  .overlay{overflow:auto;padding:10px}
  .win{padding:12px 14px;gap:6px}
  .win b{font-size:1.2rem}
  .stars{font-size:1.6rem}
  .world{padding:16px 14px}
  .tile b{font-size:.82rem}
}
@media (pointer:fine) and (min-width:1021px){.keys{display:none}}
@media (prefers-reduced-motion:reduce){.robot,.robot svg,.box,.tile .dot{transition:none}.robot.crash svg,.boost span{animation:none}}
</style>
</head>
<body>


<header class="top">
  <div class="logo"><svg viewBox="0 0 42 42" aria-hidden="true"><circle cx="21" cy="21" r="20" fill="#0e131f" stroke="#232d42" stroke-width="1.5"/><ellipse cx="21" cy="21" rx="16" ry="6" fill="none" stroke="#ff8a3d" stroke-width="2" transform="rotate(-20 21 21)"/><rect x="15" y="15" width="12" height="12" rx="3" fill="#e9eef7"/><rect x="6" y="18" width="8" height="6" rx="1" fill="#41e0c4"/><rect x="28" y="18" width="8" height="6" rx="1" fill="#41e0c4"/><circle cx="21" cy="21" r="2.5" fill="#ff8a3d"/><circle cx="34" cy="8" r="1" fill="#fff"/><circle cx="8" cy="33" r="1" fill="#fff"/></svg><div>Estação Kepler<small>JavaScript avançado</small></div></div>
  <div class="top-r">
    <span class="pill" title="Estrelas conquistadas"><span class="st">★</span><span id="starCount">0</span></span>
    <button class="btn" id="levelsBtn">Setores</button>
  </div>
</header>

<main class="wrap" id="view"></main>

<template id="gameTpl">
  <div class="game">
    <section class="card mission" id="mission"></section>
    <section class="card boardcard" aria-label="Planta da estação">
      <div class="bhead"><span id="bstatus"></span><div class="maps" id="maps"></div></div>
      <div class="stage" id="stage"><div class="board" id="board"></div></div>
      <div class="note" id="note"></div>
      <div class="legend" id="legend"></div>
      <div class="out" id="out"></div>
    </section>
    <section class="edcol">
      <div class="editor">
        <div class="ed-head"><span>kepler.js</span><span id="engine" class="loading">preparando o JavaScript…</span></div>
        <div class="ed-body"><div class="gutter" id="gutter">1</div><textarea id="code" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off" aria-label="Editor de código JavaScript"></textarea></div>
        <div class="keys" id="keys" aria-label="Símbolos"></div>
      </div>
      <div class="actions">

    for (const m of "NSLO"){ const nl = best[0] + PASSO[m][0], nc = best[1] + PASSO[m][1]; if (!livreEm(grid, nl, nc)) continue; const nd = bd + custoDe(grid[nl][nc]); if (nd < dist[nl][nc]) dist[nl][nc] = nd; }
  }

}
function resgateRef(grid, ini){
  const key = (l, c, k) => l + "," + c + "," + k;
  const q = [[ini[0], ini[1], 0, 0]]; const seen = new Set([key(ini[0], ini[1], 0)]);
  while (q.length){
    const [l, c, k, d] = q.shift();
    if (grid[l][c] === "@") return d;
    for (const m of "NSLO"){

      const ch = grid[nl][nc];
      if (PORTAS[ch] && !(k & (1 << "xyz".indexOf(PORTAS[ch])))) continue;
      const nk = /[xyz]/.test(ch) ? k | (1 << "xyz".indexOf(ch)) : k;
      if (seen.has(key(nl, nc, nk))) continue;
      seen.add(key(nl, nc, nk)); q.push([nl, nc, nk, d + 1]);

/* ---------- comparação e textos ---------- */
function igual(a, b){
  if (a === b) return true;
  if (typeof a === "number" && typeof b === "number") return Math.abs(a - b) < 1e-9;
  if (Array.isArray(a) && Array.isArray(b)) return a.length === b.length && a.every((x, i) => igual(x, b[i]));
  if (a && b && typeof a === "object" && typeof b === "object" && !Array.isArray(a) && !Array.isArray(b)){
    const ka = Object.keys(a).sort(), kb = Object.keys(b).sort();
    return igual(ka, kb) && ka.every(k => igual(a[k], b[k]));
  }
  return false;
}
function fmt(v){ const s = typeof __fmt === "function" ? __fmt(v) : JSON.stringify(v); return s.length > 160 ? s.slice(0, 160) + " …" : s; }
function exige(ns, nome, tipo){
  const v = ns[nome];
  if (v === undefined) throw new Falha(tipo === "classe" ? `Não encontrei a classe ${nome}. Crie com class ${nome} { ... }` : `Não encontrei a função ${nome}. Crie com function ${nome}(...) { ... }`);
  if (typeof v !== "function") throw new Falha(`${nome} precisa ser ${tipo === "classe" ? "uma classe" : "uma função"}.`);
  if (tipo === "classe" && !/^class\b/.test(Function.prototype.toString.call(v))) throw new Falha(`${nome} precisa ser criada com class ${nome} { ... }`);
  return v;
}

/* roda a verificação: Falha vira resposta; erro dentro do código da estação vira aviso amigável */
async function __rodarVerificacao(verificar, ns, caso, ator){
  try { return await verificar(ns, caso, ator); }
  catch (e){
    if (e instanceof Falha) return { ok: false, msg: e.message };
    const m = /(aluno|estacao)\.js/.exec(String(e && e.stack));
    if (m && m[1] === "estacao") return { ok: false, msg: `A Central recebeu algo inesperado do seu código e não conseguiu continuar (${e.name}: ${e.message}). Confira se as funções devolvem o tipo de valor pedido na tarefa.` };
    throw e;
  }
}

    for (let c = esq; c <= dir; c++) yield [topo, c];

    const esp = quentes.slice(0, caso.n).map(x => x.modulo);
    if (!igual(r, esp)) return { ok: false, msg: `Esperava os módulos ${fmt(esp)}, mas veio ${fmt(r)}.` };
    const precisava = leituras.indexOf(quentes[caso.n - 1]) + 1;
    if (puxadas > precisava) return { ok: false, msg: `Para achar ${caso.n} leituras quentes bastavam ${precisava} leituras da fonte, mas foram puxadas ${puxadas}. O take deve parar logo depois de entregar o último item.` };
    puxadas = 0; const z = [...take(fonte(), 0)];
    if (z.length || puxadas) return { ok: false, msg: `take(fonte, 0) não deveria entregar nem puxar nada, mas puxou ${puxadas} leitura(s).` };
    const arr = [...mapear(filtrar([1, 2, 3, 4], x => x % 2 === 0), x => x * 10)];
    if (!igual(arr, [20, 40])) return { ok: false, msg: `Com um array comum, mapear(filtrar([1, 2, 3, 4], par), x => x * 10) deveria dar [ 20, 40 ], mas deu ${fmt(arr)}.` };
    for (const m of r){ drone.irPara(posDe(drone.grid, m)); drone.dizer(`${m}: quente`); }
    return { ok: true, nota: `${r.join(", ")} · ${puxadas === 0 ? precisava : puxadas} leituras puxadas`, fica: true };
  } },

{ id: "k6", zona: 1, titulo: "Inventário iterável", nomes: ["Inventario"],
  intro: `<p>O almoxarifado da estação precisa de um inventário que funcione com <code>for...of</code>, spread e <code>Array.from</code>, como se fosse um array. Para isso, a classe implementa o <b>protocolo de iteração</b>: um método com a chave especial <code>Symbol.iterator</code>.</p>
  <pre>class Fila {
  *[Symbol.iterator]() {   // método gerador
    yield* this.itens;      // repassa os itens de outro iterável
  }
}
[...new Fila()];</pre>`,
  task: `Crie a classe <code>Inventario</code> com <code>adicionar(nome, qtd, categoria)</code> (se o item já existe, soma a quantidade), o getter <code>total</code> (soma das quantidades), o iterador <code>[Symbol.iterator]</code>, que entrega os itens <code>{ nome, qtd, categoria }</code> em <b>ordem alfabética</b> de nome, e o gerador <code>porCategoria(categoria)</code>, que entrega só os itens daquela categoria, também em ordem.`,
  starter: `class Inventario {
  constructor() {
    this.itens = new Map();
  }

  adicionar(nome, qtd, categoria) {

  }

  *[Symbol.iterator]() {

  }
}
`,
  solution: `class Inventario {
  constructor() {
    this.itens = new Map();
  }

  adicionar(nome, qtd, categoria) {
    const atual = this.itens.get(nome);
    if (atual) atual.qtd += qtd;
    else this.itens.set(nome, { nome, qtd, categoria });
  }

  get total() {
    let soma = 0;
    for (const item of this) soma += item.qtd;
    return soma;
  }

  *[Symbol.iterator]() {
    yield* [...this.itens.values()].sort((a, b) => a.nome.localeCompare(b.nome));
  }

  *porCategoria(categoria) {
    for (const item of this) {
      if (item.categoria === categoria) yield item;
    }
  }
}
`,
  hint: `Guarde os itens num Map por nome. O iterador pode ordenar os valores com sort e localeCompare e repassá-los com yield*. Depois disso, total e porCategoria podem simplesmente percorrer o próprio objeto com for (const item of this).`,
  casos: [
    { ops: [["oxigênio", 12, "suporte"], ["ração", 30, "comida"], ["café", 5, "comida"], ["filtro", 3, "suporte"], ["ração", 10, "comida"]], cat: "comida" },
    { ops: [["parafuso", 200, "peças"], ["água", 50, "comida"], ["bateria", 8, "peças"]], cat: "peças" },
    { ops: [["mapa estelar", 1, "navegação"]], cat: "comida" },
  ].map(k => ({ ...k, map: corredorModulos(["A", "B", "C"], 3), nota: `${k.ops.length} entradas no almoxarifado` })),
  verificar: async (ns, caso, drone) => {
    const Inventario = exige(ns, "Inventario", "classe");
    const inv = new Inventario();
    const ref = new Map();
    for (const [n, q, c] of caso.ops){ inv.adicionar(n, q, c); if (ref.has(n)) ref.get(n).qtd += q; else ref.set(n, { nome: n, qtd: q, categoria: c }); }
    const ordem = [...ref.values()].sort((a, b) => a.nome.localeCompare(b.nome));
    if (typeof inv[Symbol.iterator] !== "function") return { ok: false, msg: `O inventário precisa do método [Symbol.iterator] para funcionar com for...of e spread.` };
    const lista = [...inv].map(x => ({ nome: x.nome, qtd: x.qtd, categoria: x.categoria }));
    if (!igual(lista, ordem)) return { ok: false, msg: `[...inventario] deu ${fmt(lista)}, mas o certo é ${fmt(ordem)} (em ordem alfabética, com as quantidades somadas).` };
    const de2 = [...inv].length;
    if (de2 !== ordem.length) return { ok: false, msg: `Percorrer o inventário duas vezes deu resultados diferentes. Cada chamada de [Symbol.iterator] precisa começar do zero.` };
    const tot = ordem.reduce((a, b) => a + b.qtd, 0);
    if (inv.total !== tot) return { ok: false, msg: `total deveria ser ${tot}, mas é ${fmt(inv.total)}.` };
    if (typeof inv.porCategoria !== "function") return { ok: false, msg: `Falta o gerador porCategoria(categoria).` };
    const pc = Array.from(inv.porCategoria(caso.cat), x => x.nome), espPc = ordem.filter(x => x.categoria === caso.cat).map(x => x.nome);
    if (!igual(pc, espPc)) return { ok: false, msg: `porCategoria("${caso.cat}") deu ${fmt(pc)}, mas o certo é ${fmt(espPc)}.` };
    for (const it of ordem.slice(0, 3)){ drone.dizer(`${it.nome}: ${it.qtd}`); drone.mover("L"); drone.mover("L"); drone.mover("L"); }
    drone.irPara(posDe(drone.grid, "@"));
    return { ok: true, nota: `Total: ${tot} itens · ${caso.cat}: ${pc.join(", ") || "nenhum"}` };
  } },

{ id: "k7", zona: 2, titulo: "Tanques blindados", nomes: ["Tanque"],
  intro: `<p>Os tanques de combustível não podem ter o nível alterado "na mão": só abastecendo e consumindo, com as verificações de segurança. Campos que começam com <code>#</code> são <b>privados</b>: só o código de dentro da classe enxerga.</p>
  <pre>class Cofre {
  #segredo = 42;
  get dica() { return this.#segredo > 40; }
  static vazio() { return new Cofre(); }   // método da classe, não do objeto
}</pre>
  <p>Para recusar uma operação, lance um <code>RangeError</code>, o erro padrão para valores fora do permitido.</p>`,
  task: `Crie a classe <code>Tanque</code> com <code>capacidade</code> (pública) e o nível guardado num campo privado <code>#nivel</code>, começando em 0. Getter <code>nivel</code> (sem setter); <code>abastecer(q)</code> e <code>consumir(q)</code>, que lançam <code>RangeError</code> com as mensagens <code>quantidade inválida</code> (q ≤ 0), <code>capacidade excedida</code> e <code>nível insuficiente</code>; e o método estático <code>Tanque.cheio(capacidade)</code>, que devolve um tanque já cheio.`,
  starter: `class Tanque {
  #nivel = 0;

  constructor(capacidade) {
    this.capacidade = capacidade;
  }
}
`,
  solution: `class Tanque {
  #nivel = 0;

  constructor(capacidade) {
    this.capacidade = capacidade;
  }

  get nivel() {
    return this.#nivel;
  }

  abastecer(q) {
    if (q <= 0) throw new RangeError("quantidade inválida");
    if (this.#nivel + q > this.capacidade) throw new RangeError("capacidade excedida");
    this.#nivel += q;
  }

  consumir(q) {
    if (q <= 0) throw new RangeError("quantidade inválida");
    if (q > this.#nivel) throw new RangeError("nível insuficiente");
    this.#nivel -= q;
  }

  static cheio(capacidade) {
    const t = new Tanque(capacidade);
    t.abastecer(capacidade);
    return t;
  }
}
`,
  hint: `Todos os métodos usam this.#nivel. Em abastecer e consumir, teste os casos ruins primeiro e lance new RangeError("..."). O static cheio cria um Tanque e chama abastecer(capacidade) nele.`,
  casos: [
    { cap: 100, ops: [["a", 30], ["a", 50], ["c", 20], ["a", 41], ["c", 70], ["a", 0]] },
    { cap: 10, ops: [["c", 1], ["a", 10], ["a", 1], ["c", 10], ["c", -5]] },
  ].map(k => ({ ...k, map: corredorModulos(["A", "B"], 4), nota: `Tanque de ${k.cap} litros` })),
  verificar: async (ns, caso, drone) => {
    const Tanque = exige(ns, "Tanque", "classe");
    const t = new Tanque(caso.cap);
    if (t.nivel !== 0) return { ok: false, msg: `Um tanque novo deveria ter nivel 0, mas tem ${fmt(t.nivel)}.` };
    const props = Object.getOwnPropertyNames(t).filter(p => p !== "capacidade");
    if (props.length) return { ok: false, msg: `O tanque tem propriedades públicas além de capacidade: ${fmt(props)}. Guarde o nível no campo privado #nivel.` };
    let nv = 0;
    for (const [op, q] of caso.ops){
      const nome = op === "a" ? "abastecer" : "consumir";
      let espErro = null;
      if (q <= 0) espErro = "quantidade inválida"; else if (op === "a" && nv + q > caso.cap) espErro = "capacidade excedida"; else if (op === "c" && q > nv) espErro = "nível insuficiente";
      let erro = null; try { t[nome](q); } catch (e){ erro = e; }
      if (espErro){
        if (!erro) return { ok: false, msg: `Com nível ${nv} de ${caso.cap}, ${nome}(${q}) deveria lançar RangeError("${espErro}").` };
        if (!(erro instanceof RangeError) || erro.message !== espErro) return { ok: false, msg: `${nome}(${q}) lançou ${fmt(erro)}, mas deveria ser RangeError: ${espErro}.` };
        drone.dizer(`${nome}(${q}): ${espErro}`);
      } else {
        if (erro) return { ok: false, msg: `${nome}(${q}) com nível ${nv} lançou ${fmt(erro)}, mas a operação é válida.` };
        nv += op === "a" ? q : -q;
        drone.dizer(`nível ${nv}`);
      }
      if (t.nivel !== nv) return { ok: false, msg: `Depois de ${nome}(${q}), nivel deveria ser ${nv}, mas é ${fmt(t.nivel)}.` };
    }
    try { t.nivel = 9999; } catch (e){}
    if (t.nivel !== nv) return { ok: false, msg: `Foi possível mudar o nível com tanque.nivel = 9999. O getter nivel não deve ter setter.` };
    if (typeof Tanque.cheio !== "function") return { ok: false, msg: `Falta o método estático Tanque.cheio(capacidade).` };
    const ch = Tanque.cheio(caso.cap);
    if (!(ch instanceof Tanque) || ch.nivel !== caso.cap) return { ok: false, msg: `Tanque.cheio(${caso.cap}) deveria devolver um Tanque com nivel ${caso.cap}.` };
    drone.irPara(posDe(drone.grid, "@"));
    return { ok: true, nota: `Nível final ${nv} de ${caso.cap}` };
  } },

{ id: "k8", zona: 2, titulo: "Central de eventos", nomes: ["Emissor"],
  intro: `<p>Vários sistemas querem saber quando algo acontece na estação: um alarme, uma doca liberada, uma mudança de pressão. Em vez de cada um ficar perguntando, eles se <b>inscrevem</b> num emissor de eventos, e ele avisa todos quando o evento ocorre (o padrão <i>Observer</i>).</p>
  <pre>const central = new Emissor();
const sair = central.on("alarme", (nivel) => console.log("alarme", nivel));
central.emit("alarme", 3);   // chama o ouvinte
sair();                      // cancela a inscrição</pre>`,
  task: `Crie <code>Emissor</code> com <code>on(evento, fn)</code>, que inscreve e devolve uma função de cancelamento; <code>once(evento, fn)</code>, que ouve só uma vez; e <code>emit(evento, ...args)</code>, que chama os ouvintes na ordem de inscrição e devolve quantos foram chamados. Um ouvinte que se cancela durante o emit não pode atrapalhar os outros.`,
  starter: `class Emissor {
  constructor() {
    this.ouvintes = {};
  }

  on(evento, fn) {

  }

  emit(evento, ...args) {

  }
}
`,
  solution: `class Emissor {
  constructor() {
    this.ouvintes = {};
  }

  on(evento, fn) {
    (this.ouvintes[evento] ??= []).push(fn);
    return () => {
      this.ouvintes[evento] = this.ouvintes[evento].filter(f => f !== fn);
    };
  }

  once(evento, fn) {
    const sair = this.on(evento, (...args) => {
      sair();
      fn(...args);
    });
    return sair;
  }

  emit(evento, ...args) {
    const lista = [...(this.ouvintes[evento] || [])];
    for (const fn of lista) fn(...args);
    return lista.length;
  }
}
`,
  hint: `Guarde um array de funções por evento. on devolve uma arrow function que filtra a função para fora. once pode reaproveitar on, com um ouvinte que primeiro se cancela e depois chama fn. No emit, percorra uma CÓPIA da lista ([...lista]), assim cancelamentos durante o laço não pulam ninguém.`,
  casos: [{ seq: 1 }, { seq: 2 }].map(k => ({ ...k, map: corredorModulos(["A", "B", "C"], 3), nota: k.seq === 1 ? "Alarmes e cancelamentos" : "Ouvintes de uma vez só" })),
  verificar: async (ns, caso, drone) => {
    const Emissor = exige(ns, "Emissor", "classe");
    const e = new Emissor(); const log = [];
    if (caso.seq === 1){
      const s1 = e.on("alarme", n => log.push("painel " + n));
      e.on("alarme", n => log.push("sirene " + n));
      e.on("doca", d => log.push("doca " + d));
      if (typeof s1 !== "function") return { ok: false, msg: `on(evento, fn) precisa devolver uma função que cancela a inscrição.` };
      let r = e.emit("alarme", 2);
      if (r !== 2) return { ok: false, msg: `emit("alarme") deveria devolver 2 (ouvintes chamados), mas devolveu ${fmt(r)}.` };
      s1(); r = e.emit("alarme", 5);
      if (r !== 1) return { ok: false, msg: `Depois de cancelar um ouvinte, emit("alarme") deveria chamar 1, mas devolveu ${fmt(r)}.` };
      r = e.emit("nada");
      if (r !== 0) return { ok: false, msg: `emit de um evento sem ouvintes deveria devolver 0, mas devolveu ${fmt(r)}.` };
      e.emit("doca", "B");
      const esp = ["painel 2", "sirene 2", "sirene 5", "doca B"];
      if (!igual(log, esp)) return { ok: false, msg: `Os ouvintes foram chamados assim: ${fmt(log)}, mas o certo é ${fmt(esp)}.` };
    } else {
      if (typeof e.once !== "function") return { ok: false, msg: `Falta o método once(evento, fn).` };
      e.once("pronto", x => log.push("uma vez " + x));
      let sair; sair = e.on("pronto", x => { log.push("A " + x); sair(); });
      e.on("pronto", x => log.push("B " + x));
      let r = e.emit("pronto", 1);
      if (r !== 3) return { ok: false, msg: `O primeiro emit("pronto") deveria chamar 3 ouvintes, mas devolveu ${fmt(r)}.` };
      r = e.emit("pronto", 2);
      if (r !== 1) return { ok: false, msg: `No segundo emit("pronto"), só o ouvinte B deveria continuar inscrito (devolver 1), mas devolveu ${fmt(r)}.` };
      const esp = ["uma vez 1", "A 1", "B 1", "B 2"];
      if (!igual(log, esp)) return { ok: false, msg: `Os ouvintes foram chamados assim: ${fmt(log)}, mas o certo é ${fmt(esp)}. Percorra uma cópia da lista no emit.` };
    }
    for (const x of log.slice(0, 3)){ drone.dizer(x); drone.mover("L"); drone.mover("L"); drone.mover("L"); }
    drone.irPara(posDe(drone.grid, "@"));
    return { ok: true, nota: log.join(" · ") };
  } },

{ id: "k9", zona: 2, titulo: "A comporta de ar", nomes: ["Comporta", "TransicaoInvalida"],
  intro: `<p>A comporta entre a estação e o vácuo só pode mudar de estado em certas ordens: abrir sem pressurizar seria um desastre. Isso é uma <b>máquina de estados</b>. A tabela de transições permitidas já está no editor, congelada com <code>Object.freeze</code> para ninguém alterar.</p>
  <p>Quando alguém pede uma transição proibida, lançamos um <b>erro personalizado</b>, uma classe que herda de <code>Error</code> e carrega informações extras:</p>
  <pre>class ErroDeSenha extends Error {
  constructor(usuario) {
    super(\`senha errada para \${usuario}\`);
    this.name = "ErroDeSenha";
    this.usuario = usuario;
  }
}</pre>`,
  task: `Crie <code>TransicaoInvalida</code> (herda de <code>Error</code>, com <code>name</code> igual ao nome da classe, propriedades <code>de</code> e <code>para</code> e a mensagem <code>de X para Y</code>) e a classe <code>Comporta</code>: começa <code>"FECHADA"</code>, tem o getter <code>estado</code>, o método <code>ir(novo)</code> e o array <code>historico</code> com todos os estados pelos quais passou, incluindo o inicial.`,
  starter: `const TRANSICOES = Object.freeze({
  FECHADA: ["PRESSURIZANDO"],
  PRESSURIZANDO: ["ABERTA", "FECHADA"],
  ABERTA: ["FECHANDO"],
  FECHANDO: ["FECHADA"],
});

class TransicaoInvalida extends Error {

}

class Comporta {

}
`,
  solution: `const TRANSICOES = Object.freeze({
  FECHADA: ["PRESSURIZANDO"],
  PRESSURIZANDO: ["ABERTA", "FECHADA"],
  ABERTA: ["FECHANDO"],
  FECHANDO: ["FECHADA"],
});

class TransicaoInvalida extends Error {
  constructor(de, para) {
    super(\`de \${de} para \${para}\`);
    this.name = "TransicaoInvalida";
    this.de = de;
    this.para = para;
  }
}

class Comporta {
  #estado = "FECHADA";
  historico = ["FECHADA"];

  get estado() {
    return this.#estado;
  }

  ir(novo) {
    if (!TRANSICOES[this.#estado].includes(novo)) {
      throw new TransicaoInvalida(this.#estado, novo);
    }
    this.#estado = novo;
    this.historico.push(novo);
  }
}
`,
  hint: `No constructor de TransicaoInvalida, chame super com a mensagem e depois guarde name, de e para em this. Em ir(novo): se TRANSICOES[estado atual] não incluir novo, throw new TransicaoInvalida(atual, novo); senão, atualize o estado e faça push no historico.`,
  casos: [
    { seq: ["PRESSURIZANDO", "ABERTA", "FECHANDO", "FECHADA"] },
    { seq: ["ABERTA", "PRESSURIZANDO", "FECHADA", "FECHANDO", "PRESSURIZANDO", "ABERTA", "ABERTA"] },
  ].map(k => ({ ...k, map: corredorModulos(["A"], 6), nota: `${k.seq.length} comandos para a comporta` })),
  verificar: async (ns, caso, drone) => {
    const Comporta = exige(ns, "Comporta", "classe"), TI = exige(ns, "TransicaoInvalida", "classe");
    const TR = { FECHADA: ["PRESSURIZANDO"], PRESSURIZANDO: ["ABERTA", "FECHADA"], ABERTA: ["FECHANDO"], FECHANDO: ["FECHADA"] };
    const c = new Comporta();
    if (c.estado !== "FECHADA") return { ok: false, msg: `Uma comporta nova deveria estar "FECHADA", mas está ${fmt(c.estado)}.` };
    let atual = "FECHADA"; const hist = ["FECHADA"];
    for (const novo of caso.seq){
      const pode = TR[atual].includes(novo);
      let erro = null; try { c.ir(novo); } catch (e){ erro = e; }
      if (pode){
        if (erro) return { ok: false, msg: `ir("${novo}") a partir de ${atual} é permitido, mas lançou ${fmt(erro)}.` };
        atual = novo; hist.push(novo); drone.dizer(novo);
      } else {
        if (!erro) return { ok: false, msg: `ir("${novo}") a partir de ${atual} é proibido e deveria lançar TransicaoInvalida.` };
        if (!(erro instanceof TI) || !(erro instanceof Error)) return { ok: false, msg: `O erro lançado deveria ser um TransicaoInvalida (que herda de Error), mas foi ${fmt(erro)}.` };
        if (erro.name !== "TransicaoInvalida") return { ok: false, msg: `O name do erro deveria ser "TransicaoInvalida", mas é ${fmt(erro.name)}.` };
        if (erro.de !== atual || erro.para !== novo) return { ok: false, msg: `O erro deveria ter de = "${atual}" e para = "${novo}", mas veio de = ${fmt(erro.de)}, para = ${fmt(erro.para)}.` };
        if (erro.message !== `de ${atual} para ${novo}`) return { ok: false, msg: `A mensagem deveria ser "de ${atual} para ${novo}", mas é ${fmt(erro.message)}.` };
        drone.dizer(`bloqueado: ${novo}`);
      }
      if (c.estado !== atual) return { ok: false, msg: `Depois de ir("${novo}"), o estado deveria ser ${atual}, mas é ${fmt(c.estado)}.` };
    }
    if (!igual(c.historico, hist)) return { ok: false, msg: `historico deveria ser ${fmt(hist)}, mas é ${fmt(c.historico)}.` };
    if (atual === "ABERTA" || hist.includes("ABERTA")) drone.irPara(posDe(drone.grid, "@"));
    return { ok: true, nota: hist.join(" → "), fica: true };
  } },

{ id: "k10", zona: 3, titulo: "Tempo esgotado", nomes: ["comTempoLimite"],
  intro: `<p>A Terra às vezes demora para responder, e a estação não pode ficar esperando para sempre. <code>Promise.race</code> recebe várias Promises e se resolve (ou rejeita) junto com a <b>primeira</b> que terminar.</p>
  <pre>const relogio = new Promise((_, rejeitar) =>
  setTimeout(() => rejeitar(new Error("tempo esgotado")), 500));
await Promise.race([buscarDados(), relogio]);</pre>`,
  task: `Escreva <code>comTempoLimite(promessa, ms)</code>, que devolve uma Promise com o mesmo resultado de <code>promessa</code>, ou que é rejeitada com <code>Error("tempo esgotado")</code> se passarem <code>ms</code> milissegundos antes. Se a promessa original falhar antes do prazo, repasse o erro dela.`,
  starter: `function comTempoLimite(promessa, ms) {

}
`,
  solution: `function comTempoLimite(promessa, ms) {
  const relogio = new Promise((_, rejeitar) => {
    setTimeout(() => rejeitar(new Error("tempo esgotado")), ms);
  });
  return Promise.race([promessa, relogio]);
}
`,
  hint: `Crie uma Promise "relógio" que só rejeita, com setTimeout de ms. Depois return Promise.race([promessa, relogio]).`,
  casos: [
    { demora: 200, ok: true, ms: 500 }, { demora: 900, ok: true, ms: 400 }, { demora: 100, ok: false, ms: 300 }, { demora: 300, ok: true, ms: 300 },
  ].map(k => ({ ...k, map: corredorModulos(["A"], 5), nota: `Resposta em ${k.demora} ms${k.ok ? "" : " (com falha)"}, limite de ${k.ms} ms` })),
  verificar: async (ns, caso, drone) => {
    const f = exige(ns, "comTempoLimite");
    const t0 = Date.now();
    const original = new Promise((res, rej) => setTimeout(() => caso.ok ? res("dados da Terra") : rej(new Error("antena desalinhada")), caso.demora));
    const p = f(original, caso.ms);
    if (!p || typeof p.then !== "function") return { ok: false, msg: `comTempoLimite precisa devolver uma Promise.` };
    let v, erro = null; try { v = await p; } catch (e){ erro = e; }
    const dt = Date.now() - t0;
    const ganha = caso.demora < caso.ms || (caso.demora === caso.ms);
    if (ganha && caso.ok){
      if (erro) return { ok: false, msg: `A resposta chegou em ${caso.demora} ms (limite ${caso.ms} ms), mas comTempoLimite rejeitou com ${fmt(erro)}.` };
      if (v !== "dados da Terra") return { ok: false, msg: `Deveria resolver com ${fmt("dados da Terra")}, mas resolveu com ${fmt(v)}.` };
      drone.dizer("dados recebidos"); drone.irPara(posDe(drone.grid, "@"));
      return { ok: true, nota: `Resposta em ${dt} ms` };
    }
    if (ganha && !caso.ok){
      if (!erro || erro.message !== "antena desalinhada") return { ok: false, msg: `A promessa original falhou com "antena desalinhada" antes do prazo; esse erro deveria ser repassado, mas veio ${fmt(erro ? erro.message : v)}.` };
      drone.dizer("antena desalinhada"); return { ok: true, nota: `Erro repassado em ${dt} ms`, fica: true };
    }
    if (!erro) return { ok: false, msg: `A resposta demorou ${caso.demora} ms e o limite era ${caso.ms} ms: deveria rejeitar com "tempo esgotado".` };
    if (erro.message !== "tempo esgotado") return { ok: false, msg: `Deveria rejeitar com Error("tempo esgotado"), mas rejeitou com ${fmt(erro)}.` };
    if (dt !== caso.ms) return { ok: false, msg: `O tempo esgotado deveria ser avisado em ${caso.ms} ms, mas foi em ${dt} ms.` };
    drone.dizer("tempo esgotado");
    return { ok: true, nota: `Desistiu em ${dt} ms`, fica: true };
  } },

{ id: "k11", zona: 3, titulo: "Fila de transmissões", nomes: ["transmitirTodos"],
  intro: `<p>A antena da estação aguenta poucas transmissões ao mesmo tempo. Mandar tudo junto com <code>Promise.all</code> sobrecarregaria o rádio; mandar uma por vez seria lento demais. O meio-termo é um <b>limite de concorrência</b>: no máximo <code>n</code> transmissões ativas, e quando uma termina, a próxima da fila começa.</p>
  <p>Um jeito elegante: criar <code>n</code> "trabalhadores" assíncronos que pegam a próxima tarefa de um índice compartilhado até a fila acabar.</p>
  <pre>let proxima = 0;
async function trabalhador() {
  while (proxima < tarefas.length) {
    const i = proxima++;
    resultados[i] = await tarefas[i]();
  }
}</pre>`,
  task: `Escreva a função <code>async</code> <code>transmitirTodos(tarefas, limite)</code>. Cada tarefa é uma função que devolve uma Promise. Rode no máximo <code>limite</code> ao mesmo tempo e devolva o array de resultados <b>na ordem original</b>. A Central mede a concorrência e o tempo total.`,
  starter: `async function transmitirTodos(tarefas, limite) {
  const resultados = [];

  return resultados;
}
`,
  solution: `async function transmitirTodos(tarefas, limite) {
  const resultados = [];
  let proxima = 0;
  async function trabalhador() {
    while (proxima < tarefas.length) {
      const i = proxima++;
      resultados[i] = await tarefas[i]();
    }
  }
  const n = Math.min(limite, tarefas.length);
  await Promise.all(Array.from({ length: n }, () => trabalhador()));
  return resultados;
}
`,
  hint: `Crie os trabalhadores com Array.from({ length: limite }, () => trabalhador()) e espere todos com Promise.all. Cada trabalhador pega o índice com proxima++ (antes do await, para dois não pegarem o mesmo) e guarda o resultado em resultados[i].`,
  casos: [
    { duracoes: [300, 100, 200, 100, 400, 100], limite: 2 },
    { duracoes: [100, 100, 100, 100, 100, 100, 100], limite: 3 },
    { duracoes: [500, 100], limite: 4 },
    { duracoes: [200, 200, 200], limite: 1 },
  ].map(k => ({ ...k, map: corredorModulos(["A", "B"], 4), nota: `${k.duracoes.length} transmissões, limite ${k.limite}` })),
  verificar: async (ns, caso, drone) => {
    const f = exige(ns, "transmitirTodos");
    let ativos = 0, pico = 0, chamadas = 0; const t0 = Date.now();
    const tarefas = caso.duracoes.map((d, i) => () => { chamadas++; ativos++; pico = Math.max(pico, ativos); return new Promise(r => setTimeout(() => { ativos--; r(`msg ${i + 1}`); }, d)); });
    const p = f(tarefas, caso.limite);
    if (!p || typeof p.then !== "function") return { ok: false, msg: `transmitirTodos precisa ser uma função async.` };
    const r = await p; const dt = Date.now() - t0;
    const esp = caso.duracoes.map((_, i) => `msg ${i + 1}`);
    if (!igual(r, esp)) return { ok: false, msg: `transmitirTodos devolveu ${fmt(r)}, mas o certo é ${fmt(esp)} (na ordem original).` };
    if (chamadas !== caso.duracoes.length) return { ok: false, msg: `Cada tarefa deveria ser chamada uma vez, mas houve ${chamadas} chamadas para ${caso.duracoes.length} tarefas.` };
    if (pico > caso.limite) return { ok: false, msg: `Chegaram a rodar ${pico} transmissões ao mesmo tempo, acima do limite de ${caso.limite}.` };
    const fim = Array(Math.min(caso.limite, caso.duracoes.length)).fill(0);
    for (const d of caso.duracoes){ fim.sort((a, b) => a - b); fim[0] += d; }
    const ideal = Math.max(...fim);
    if (dt > ideal) return { ok: false, msg: `Levou ${dt} ms, mas com ${caso.limite} transmissões em paralelo dava para terminar em ${ideal} ms. Comece a próxima assim que uma terminar.` };
    drone.dizer(`${r.length} enviadas em ${dt} ms`); drone.irPara(posDe(drone.grid, "@"));
    return { ok: true, nota: `Pico de ${pico} simultâneas · ${dt} ms` };
  } },

{ id: "k12", zona: 3, titulo: "Telemetria em fluxo", nomes: ["primeiroAlerta"],
  intro: `<p>As leituras de radiação chegam aos poucos por um <b>iterador assíncrono</b>: cada próxima leitura é uma Promise. O <code>for await...of</code> percorre esse fluxo esperando cada valor:</p>
  <pre>for await (const leitura of fluxo) {
  console.log(leitura);
  if (leitura > 100) break;   // parar cedo libera o fluxo
}</pre>
  <p>O alarme só deve tocar quando houver <b>3 leituras seguidas</b> acima do limite (uma só pode ser ruído).</p>`,
  task: `Escreva a função <code>async</code> <code>primeiroAlerta(fluxo, limite)</code>, que devolve a posição (contando do 0) da leitura que completa a primeira sequência de 3 seguidas acima de <code>limite</code>, ou <code>-1</code> se o fluxo terminar sem isso. Pare de ler assim que achar: a Central conta quantas leituras você pediu.`,
  starter: `async function primeiroAlerta(fluxo, limite) {
  let i = 0;
  let seguidas = 0;
  for await (const leitura of fluxo) {

  }
  return -1;
}
`,
  solution: `async function primeiroAlerta(fluxo, limite) {
  let i = 0;
  let seguidas = 0;
  for await (const leitura of fluxo) {
    seguidas = leitura > limite ? seguidas + 1 : 0;
    if (seguidas === 3) return i;
    i++;
  }
  return -1;
}
`,
  hint: `A cada leitura: se for maior que o limite, some 1 em seguidas; senão, volte para 0. Quando seguidas chegar a 3, return i (o return dentro do for await encerra o fluxo). Não esqueça de i++ no fim de cada volta.`,
  casos: [
    { leituras: [10, 50, 61, 70, 20, 65, 66, 80, 90, 12, 5], limite: 60 },
    { leituras: [61, 62, 10, 70, 71, 72, 73, 74], limite: 60 },
    { leituras: [5, 99, 99, 4, 99, 99], limite: 50 },
    { leituras: [], limite: 1 },
  ].map(k => ({ ...k, map: corredorModulos(["A"], 6), nota: `${k.leituras.length} leituras, limite ${k.limite}` })),
  verificar: async (ns, caso, drone) => {
    const f = exige(ns, "primeiroAlerta");
    let pedidas = 0, fechou = false;
    async function* fluxo(){
      try { for (const x of caso.leituras){ pedidas++; await new Promise(r => setTimeout(r, 100)); yield x; } }
      finally { fechou = true; }
    }
    const p = f(fluxo(), caso.limite);
    if (!p || typeof p.then !== "function") return { ok: false, msg: `primeiroAlerta precisa ser uma função async.` };
    const r = await p;
    let seg = 0, esp = -1; for (let i = 0; i < caso.leituras.length; i++){ seg = caso.leituras[i] > caso.limite ? seg + 1 : 0; if (seg === 3){ esp = i; break; } }
    if (r !== esp) return { ok: false, msg: `Com as leituras ${fmt(caso.leituras)} e limite ${caso.limite}, a resposta é ${esp}, mas veio ${fmt(r)}.` };
    const deveria = esp === -1 ? caso.leituras.length : esp + 1;
    if (pedidas > deveria) return { ok: false, msg: `Foram pedidas ${pedidas} leituras, mas a resposta já era conhecida depois de ${deveria}. Saia do laço assim que achar.` };
    if (esp !== -1 && !fechou) return { ok: false, msg: `O fluxo não foi encerrado. Use return (ou break) dentro do for await para liberá-lo.` };
    drone.dizer(esp === -1 ? "tudo normal" : `alerta na leitura ${esp}`);
    if (esp === -1) drone.irPara(posDe(drone.grid, "@"));
    return { ok: true, nota: esp === -1 ? "Nenhum alerta" : `Alerta na posição ${esp}, depois de ${pedidas} leituras`, fica: true };
  } },

{ id: "k13", zona: 4, titulo: "Sensores vigiados", nomes: ["vigiar"],
  intro: `<p>O painel do reator precisa saber de qualquer mudança nos sensores, sem que cada parte do código tenha que avisar. Um <b>Proxy</b> embrulha um objeto e intercepta as operações sobre ele: leitura, escrita, exclusão...</p>
  <pre>const p = new Proxy(alvo, {
  set(obj, prop, valor) {
    console.log("mudou", prop);
    obj[prop] = valor;
    return true;          // a escrita deu certo
  },
});</pre>
  <p><code>prop in obj</code> diz se a propriedade existe. <code>Reflect.set(obj, prop, valor)</code> faz a escrita "normal".</p>`,
  task: `Escreva <code>vigiar(alvo, aoMudar)</code>, que devolve um Proxy do alvo. Ao escrever numa propriedade existente com um valor <b>diferente</b>, chame <code>aoMudar(prop, antigo, novo)</code> (com o mesmo valor, não chame). Escrever numa propriedade que não existe lança <code>TypeError("propriedade desconhecida: X")</code>, e apagar qualquer propriedade lança <code>TypeError("não é permitido apagar")</code>. Leituras funcionam normalmente.`,
  starter: `function vigiar(alvo, aoMudar) {
  return new Proxy(alvo, {
    set(obj, prop, valor) {

      return true;
    },
  });
}
`,
  solution: `function vigiar(alvo, aoMudar) {
  return new Proxy(alvo, {
    set(obj, prop, valor) {
      if (!(prop in obj)) throw new TypeError(\`propriedade desconhecida: \${String(prop)}\`);
      const antigo = obj[prop];
      obj[prop] = valor;
      if (antigo !== valor) aoMudar(prop, antigo, valor);
      return true;
    },
    deleteProperty() {
      throw new TypeError("não é permitido apagar");
    },
  });
}
`,
  hint: `No set: se !(prop in obj), throw new TypeError(...). Guarde o antigo, escreva o novo e só chame aoMudar se forem diferentes. Para impedir delete, use a armadilha deleteProperty() lançando o TypeError.`,
  casos: [{ seq: 1 }, { seq: 2 }].map(k => ({ ...k, map: corredorModulos(["A", "B"], 4), nota: k.seq === 1 ? "Reator: temperatura e pressão" : "Escritas inválidas" })),
  verificar: async (ns, caso, drone) => {
    const vigiar = exige(ns, "vigiar");
    const alvo = { temperatura: 300, pressao: 1, ligado: true };
    const log = [];
    const p = vigiar(alvo, (prop, a, n) => log.push([prop, a, n]));
    if (!p || typeof p !== "object") return { ok: false, msg: `vigiar deveria devolver um Proxy (um objeto), mas devolveu ${fmt(p)}.` };
    if (p.temperatura !== 300) return { ok: false, msg: `Ler p.temperatura pelo Proxy deveria dar 300, mas deu ${fmt(p.temperatura)}.` };
    if (caso.seq === 1){
      p.temperatura = 320; p.temperatura = 320; p.pressao = 0.9; p.ligado = false;
      const esp = [["temperatura", 300, 320], ["pressao", 1, 0.9], ["ligado", true, false]];
      if (!igual(log, esp)) return { ok: false, msg: `aoMudar foi chamado com ${fmt(log)}, mas o certo é ${fmt(esp)} (nada quando o valor não muda).` };
      if (alvo.temperatura !== 320) return { ok: false, msg: `A escrita pelo Proxy precisa mudar o objeto original: alvo.temperatura deveria ser 320.` };
      for (const [prop, , n] of log){ drone.dizer(`${prop}: ${n}`); drone.mover("L"); drone.mover("L"); }
    } else {
      let e1 = null; try { p.radiacao = 5; } catch (e){ e1 = e; }
      if (!(e1 instanceof TypeError) || e1.message !== "propriedade desconhecida: radiacao") return { ok: false, msg: `p.radiacao = 5 deveria lançar TypeError("propriedade desconhecida: radiacao"), mas ${e1 ? "lançou " + fmt(e1) : "não lançou nada"}.` };
      if ("radiacao" in alvo) return { ok: false, msg: `A propriedade desconhecida não pode ser criada no objeto.` };
      let e2 = null; try { delete p.pressao; } catch (e){ e2 = e; }
      if (!(e2 instanceof TypeError) || e2.message !== "não é permitido apagar") return { ok: false, msg: `delete p.pressao deveria lançar TypeError("não é permitido apagar"), mas ${e2 ? "lançou " + fmt(e2) : "não lançou nada"}.` };
      if (!("pressao" in alvo)) return { ok: false, msg: `A propriedade pressao foi apagada do objeto original.` };
      if (log.length) return { ok: false, msg: `aoMudar não deveria ser chamado em escritas recusadas, mas foi: ${fmt(log)}.` };
      drone.dizer("escritas inválidas bloqueadas");
    }
    drone.irPara(posDe(drone.grid, "@"));
    return { ok: true, nota: caso.seq === 1 ? `${log.length} mudanças registradas` : "TypeError nas operações proibidas" };
  } },

{ id: "k14", zona: 4, titulo: "Logs da estação", nomes: ["lerLog"],
  intro: `<p>O computador de bordo grava um log de texto, uma linha por evento, mas linhas corrompidas aparecem no meio. Expressões regulares com <b>grupos nomeados</b> transformam texto em dados com segurança:</p>
  <pre>const re = /^(?&lt;h&gt;\\d{2}):(?&lt;m&gt;\\d{2})$/;
const m = "09:41".match(re);
m.groups.h;   // '09'
"pressão 0.82 atm".match(/-?\\d+(\\.\\d+)?/)[0];   // '0.82'</pre>
  <p>O formato de uma linha válida é <code>[HH:MM:SS] MOD-n NIVEL: mensagem</code>, com <code>NIVEL</code> sendo <code>INFO</code>, <code>ALERTA</code> ou <code>ERRO</code>.</p>`,
  task: `Escreva <code>lerLog(texto)</code>, que devolve um array de objetos <code>{ hora, modulo, nivel, mensagem, valor }</code>, um por linha válida: <code>hora</code> como texto, <code>modulo</code> como número, <code>mensagem</code> sem espaços nas pontas e <code>valor</code> o primeiro número da mensagem (pode ser negativo ou decimal) ou <code>null</code>. Linhas fora do formato são ignoradas.`,
  starter: `const LINHA = /^\\[(?<hora>\\d{2}:\\d{2}:\\d{2})\\] MOD-(?<modulo>\\d+) /;

function lerLog(texto) {
  const entradas = [];
  for (const linha of texto.split("\\n")) {

  }
  return entradas;
}
`,
  solution: `const LINHA = /^\\[(?<hora>\\d{2}:\\d{2}:\\d{2})\\] MOD-(?<modulo>\\d+) (?<nivel>INFO|ALERTA|ERRO): (?<mensagem>.*)$/;

function lerLog(texto) {
  const entradas = [];
  for (const linha of texto.split("\\n")) {
    const m = linha.trim().match(LINHA);
    if (!m) continue;
    const { hora, modulo, nivel, mensagem } = m.groups;
    const num = mensagem.match(/-?\\d+(\\.\\d+)?/);
    entradas.push({
      hora,
      modulo: Number(modulo),
      nivel,
      mensagem: mensagem.trim(),
      valor: num ? Number(num[0]) : null,
    });
  }
  return entradas;
}
`,
  hint: `Complete a regex com (?<nivel>INFO|ALERTA|ERRO): (?<mensagem>.*)$. Para cada linha, match; se não bater, continue. Desestruture m.groups, converta modulo com Number e procure o primeiro número com /-?\\d+(\\.\\d+)?/.`,
  casos: [
    { texto: "[08:00:01] MOD-3 INFO: sistemas nominais\n[08:00:07] MOD-12 ALERTA: pressão 0.82 atm\nlixo no meio da linha\n[8:00:09] MOD-1 INFO: hora com formato errado\n[08:01:00] MOD-4 ERRO: temperatura -17.5 graus no tanque 2" },
    { texto: "[23:59:59] MOD-7 AVISO: nível desconhecido\n[00:00:00] MOD-7 INFO: virada do dia\n   [12:30:45] MOD-2 ALERTA:   radiação 140 mSv   \n[12:30:46] MOD-x INFO: módulo sem número" },
  ].map(k => ({ ...k, map: corredorModulos(["A", "B", "C"], 3), nota: `${k.texto.split("\n").length} linhas no log` })),
  verificar: async (ns, caso, drone) => {
    const f = exige(ns, "lerLog");
    const re = /^\[(?<hora>\d{2}:\d{2}:\d{2})\] MOD-(?<modulo>\d+) (?<nivel>INFO|ALERTA|ERRO): (?<mensagem>.*)$/;
    const esp = [];
    for (const l of caso.texto.split("\n")){ const m = l.trim().match(re); if (!m) continue; const { hora, modulo, nivel, mensagem } = m.groups; const n = mensagem.match(/-?\d+(\.\d+)?/); esp.push({ hora, modulo: +modulo, nivel, mensagem: mensagem.trim(), valor: n ? +n[0] : null }); }
    const r = f(caso.texto);
    if (!Array.isArray(r)) return { ok: false, msg: `lerLog precisa devolver um array, mas devolveu ${fmt(r)}.` };
    if (r.length !== esp.length) return { ok: false, msg: `O log tem ${esp.length} linhas válidas, mas lerLog devolveu ${r.length} entradas: ${fmt(r)}.` };
    for (let i = 0; i < esp.length; i++){
      const a = r[i] && { hora: r[i].hora, modulo: r[i].modulo, nivel: r[i].nivel, mensagem: r[i].mensagem, valor: r[i].valor };
      if (!igual(a, esp[i])) return { ok: false, msg: `A entrada ${i + 1} deveria ser ${fmt(esp[i])}, mas veio ${fmt(r[i])}.` };
    }
    for (const e of esp){ drone.dizer(`MOD-${e.modulo} ${e.nivel}`); drone.mover("L"); drone.mover("L"); drone.mover("L"); }
    drone.irPara(posDe(drone.grid, "@"));
    return { ok: true, nota: `${esp.length} entradas válidas` };
  } },

{ id: "k15", zona: 4, titulo: "Cópia de segurança", nomes: ["clonarProfundo", "congelarProfundo"],
  intro: `<p>Antes de cada manobra, o computador guarda uma cópia do estado da estação. Uma cópia <b>rasa</b> (<code>{ ...obj }</code>) não basta: os objetos de dentro continuam compartilhados. É preciso uma cópia <b>profunda</b>, que desce recursivamente por arrays, objetos, <code>Date</code>, <code>Map</code> e <code>Set</code>.</p>
  <p>Depois, a cópia é congelada para ninguém mexer nela por engano. <code>Object.freeze</code> também é raso: congela só o primeiro nível.</p>
  <pre>Object.freeze(obj);
Object.isFrozen(obj);       // true
obj instanceof Date;        // testa o tipo</pre>`,
  task: `Escreva <code>clonarProfundo(valor)</code>, que copia primitivos, arrays, objetos simples, <code>Date</code>, <code>Map</code> e <code>Set</code> em todos os níveis (sem compartilhar nada com o original), e <code>congelarProfundo(obj)</code>, que congela o objeto e tudo o que houver dentro dele (objetos e arrays) e devolve o próprio objeto.`,
  starter: `function clonarProfundo(valor) {
  if (valor === null || typeof valor !== "object") return valor;

}

function congelarProfundo(obj) {

}
`,
  solution: `function clonarProfundo(valor) {
  if (valor === null || typeof valor !== "object") return valor;
  if (valor instanceof Date) return new Date(valor.getTime());
  if (valor instanceof Map) return new Map([...valor].map(([k, v]) => [clonarProfundo(k), clonarProfundo(v)]));
  if (valor instanceof Set) return new Set([...valor].map(clonarProfundo));
  if (Array.isArray(valor)) return valor.map(clonarProfundo);
  const copia = {};
  for (const [k, v] of Object.entries(valor)) copia[k] = clonarProfundo(v);
  return copia;
}

function congelarProfundo(obj) {
  for (const v of Object.values(obj)) {
    if (v !== null && typeof v === "object" && !Object.isFrozen(v)) congelarProfundo(v);
  }
  return Object.freeze(obj);
}
`,
  hint: `Em clonarProfundo, trate cada tipo antes do caso geral: Date (new Date(getTime())), Map e Set (recrie clonando cada elemento), array (map recursivo) e objeto (Object.entries recursivo). Em congelarProfundo, primeiro congele os valores de dentro (recursão) e depois o próprio objeto.`,
  casos: [{ seq: 1 }, { seq: 2 }].map(k => ({ ...k, map: corredorModulos(["A", "B"], 4), nota: k.seq === 1 ? "Clonando o estado da estação" : "Congelando a cópia" })),
  verificar: async (ns, caso, drone) => {
    const clonar = exige(ns, "clonarProfundo"), congelar = exige(ns, "congelarProfundo");
    const estado = () => ({ nome: "Kepler", orbita: { altitude: 408, inclinacao: 51.6 }, tripulacao: [{ nome: "Ana", tarefas: ["reparo"] }, { nome: "Rui", tarefas: [] }], lancamento: new Date(Date.UTC(2031, 2, 14)), modulos: new Map([["A", { pressao: 1 }], ["B", { pressao: 0.98 }]]), alertas: new Set(["calor"]), ativo: true, codigo: null });
    if (caso.seq === 1){

{ id: "k16", zona: 5, titulo: "Fila de prioridade", nomes: ["FilaPrioridade"],
  intro: `<p>Os pedidos de reparo têm prioridades, e o drone sempre atende o mais urgente (menor número). Ordenar a lista inteira a cada pedido novo é lento demais para os milhares de pedidos de um dia. A estrutura certa é um <b>heap binário</b>.</p>

pop:  tire o [0], ponha o último no lugar e "desça" trocando com o menor filho</pre>`,

  solution: `class FilaPrioridade {
  constructor() {
    this.heap = [];
  }

  get tamanho() {
    return this.heap.length;
  }

  peek() {
    return this.heap.length ? this.heap[0].item : undefined;
  }

  push(item, prioridade) {
    const h = this.heap;
    h.push({ item, prioridade });
    let i = h.length - 1;
    while (i > 0) {
      const pai = (i - 1) >> 1;
      if (h[pai].prioridade <= h[i].prioridade) break;
      [h[pai], h[i]] = [h[i], h[pai]];
      i = pai;
    }
  }

  pop() {
    const h = this.heap;
    if (!h.length) return undefined;
    const topo = h[0];
    const ultimo = h.pop();
    if (h.length) {
      h[0] = ultimo;
      let i = 0;
      for (;;) {
        const e = 2 * i + 1, d = e + 1;
        let menor = i;
        if (e < h.length && h[e].prioridade < h[menor].prioridade) menor = e;
        if (d < h.length && h[d].prioridade < h[menor].prioridade) menor = d;
        if (menor === i) break;
        [h[menor], h[i]] = [h[i], h[menor]];
        i = menor;
      }
    }
    return topo.item;
  }
}
`,
  hint: `push: h.push({ item, prioridade }) e suba: enquanto i > 0 e o pai (i - 1) >> 1 tiver prioridade maior, troque e continue do pai. pop: guarde h[0], coloque o último elemento na raiz e desça trocando com o menor dos filhos 2i+1 e 2i+2 até não haver filho menor.`,
  casos: [{ n: 12, seed: 4 }, { n: 100000, seed: 9 }].map(k => ({ ...k, map: corredorModulos(["A", "B", "C"], 3), nota: k.n > 1000 ? "100 mil pedidos de reparo" : "Pedidos do turno da manhã" })),
  verificar: async (ns, caso, drone) => {
    const FP = exige(ns, "FilaPrioridade", "classe");
    const f = new FP();
    if (f.pop() !== undefined) return { ok: false, msg: `pop() numa fila vazia deveria devolver undefined.` };
    if (typeof f.peek !== "function") return { ok: false, msg: `Falta o método peek().` };
    const R = rng(caso.seed); const prios = Array.from({ length: caso.n }, (_, i) => i); for (let i = prios.length - 1; i > 0; i--){ const j = Math.floor(R() * (i + 1)); [prios[i], prios[j]] = [prios[j], prios[i]]; }
    const nomes = ["painel", "filtro", "antena", "válvula", "bomba", "cabo", "luz", "sensor", "porta", "trava", "fusível", "tubo"];
    const metade = Math.floor(caso.n / 2);
    for (let i = 0; i < metade; i++) f.push(nomes[i % nomes.length] + "#" + prios[i], prios[i]);
    if (f.tamanho !== metade) return { ok: false, msg: `Depois de ${metade} push, tamanho deveria ser ${metade}, mas é ${fmt(f.tamanho)}.` };
    const tirados = [];
    const k1 = Math.floor(metade / 2);
    for (let i = 0; i < k1; i++) tirados.push(f.pop());
    for (let i = metade; i < caso.n; i++) f.push(nomes[i % nomes.length] + "#" + prios[i], prios[i]);
    const espTopo = [...prios.slice(0, metade)].sort((a, b) => a - b).slice(k1);
    const resto = [...espTopo, ...prios.slice(metade)].sort((a, b) => a - b);
    const espPrimeiros = [...prios.slice(0, metade)].sort((a, b) => a - b).slice(0, k1);
    for (let i = 0; i < k1; i++){ const p = +String(tirados[i]).split("#")[1]; if (p !== espPrimeiros[i]){ return { ok: false, msg: `O pop número ${i + 1} devolveu ${fmt(tirados[i])}, mas deveria ser o de prioridade ${espPrimeiros[i]}.` }; } }

    if (f.tamanho !== resto.length) return { ok: false, msg: `peek() não pode tirar o item da fila.` };
    for (let i = 0; i < resto.length; i++){ const x = f.pop(); if (+String(x).split("#")[1] !== resto[i]) return { ok: false, msg: `Na reta final, o pop devolveu ${fmt(x)}, mas deveria ser o de prioridade ${resto[i]}.` }; }
    if (f.tamanho !== 0 || f.pop() !== undefined) return { ok: false, msg: `Depois de tirar tudo, a fila deveria ficar vazia.` };

  } },

{ id: "k17", zona: 5, titulo: "Rota de menor consumo", nomes: ["rotaMaisBarata"],
  intro: `<p>Nem todo corredor custa o mesmo: trechos com números (1 a 9) são áreas com campo magnético, e entrar nelas gasta aquela quantidade de energia. Corredores comuns gastam 1. O menor caminho em passos pode não ser o mais barato!</p>
  <p>O <b>algoritmo de Dijkstra</b> resolve: sempre expanda a casa com menor custo acumulado ainda não visitada. A sua <code>FilaPrioridade</code> da missão anterior é perfeita para isso (cole ela aqui).</p>

  solution: `const PASSO = { N: [-1, 0], S: [1, 0], L: [0, 1], O: [0, -1] };
const custoDe = (ch) => (/[1-9]/.test(ch) ? Number(ch) : 1);

class FilaPrioridade {
  constructor() { this.itens = []; }
  get tamanho() { return this.itens.length; }
  push(item, prioridade) {
    this.itens.push({ item, prioridade });
    this.itens.sort((a, b) => a.prioridade - b.prioridade);
  }
  pop() { return this.itens.shift()?.item; }
}

function rotaMaisBarata(mapa, inicio, fim) {
  const chave = ([l, c]) => l + "," + c;
  const dist = new Map([[chave(inicio), 0]]);
  const veioDe = new Map();
  const fila = new FilaPrioridade();
  fila.push(inicio, 0);
  while (fila.tamanho) {
    const atual = fila.pop();
    const d = dist.get(chave(atual));
    if (atual[0] === fim[0] && atual[1] === fim[1]) break;
    for (const [mov, [dl, dc]] of Object.entries(PASSO)) {
      const viz = [atual[0] + dl, atual[1] + dc];
      const ch = mapa[viz[0]][viz[1]];
      if (ch === "#") continue;
      const nd = d + custoDe(ch);
      if (nd < (dist.get(chave(viz)) ?? Infinity)) {
        dist.set(chave(viz), nd);
        veioDe.set(chave(viz), [chave(atual), mov]);
        fila.push(viz, nd);
      }
    }
  }
  const movimentos = [];
  for (let k = chave(fim); veioDe.has(k); k = veioDe.get(k)[0]) movimentos.push(veioDe.get(k)[1]);
  return { custo: dist.get(chave(fim)), movimentos: movimentos.reverse() };
}
`,
  hint: `Guarde dist (menor custo conhecido de cada casa) e veioDe. Tire da fila a casa de menor custo; para cada vizinha, calcule nd = dist + custoDe(vizinha). Se nd for menor que o que já se sabia, atualize dist e veioDe e coloque na fila. No fim, refaça a rota pelo veioDe a partir do fim.`,
  casos: [
    ["##########", "#S..9...@#", "#.#.9.#..#", "#.#.9.#..#", "#...1....#", "##########"],
    ["############", "#S.5.5.5.5.#", "#.#########.#", "#.1.1.1.1..#", "#.#####9##.#", "#....9..9.@#", "############"],
    ["###########", "#S2222222.#", "#.#######.#", "#.........#", "#########.#", "#@3.......#", "###########"],
  ].map(rows => { const m = mapaDe(rows); return { map: m, nota: "Números são áreas de campo magnético" }; }),
  verificar: async (ns, caso, drone) => {
    const f = exige(ns, "rotaMaisBarata");
    const ini = [caso.map.start[1], caso.map.start[0]], fim = posDe(caso.map.grid, "@");
    const r = f(caso.map.grid.slice(), ini.slice(), fim.slice());
    const ref = dijkstraRef(caso.map.grid, ini, fim);
    if (!r || typeof r !== "object" || !Array.isArray(r.movimentos)) return { ok: false, msg: `rotaMaisBarata precisa devolver { custo, movimentos }, mas devolveu ${fmt(r)}.` };
    const s = seguir(drone, r.movimentos); if (!s.ok) return s;
    const c = chegada(drone); if (!c.ok) return c;
    if (drone.custo !== r.custo) return { ok: false, msg: `A rota devolvida gasta ${drone.custo} de energia, mas custo veio ${fmt(r.custo)}. Os dois precisam bater.` };
    if (r.custo > ref) return { ok: false, msg: `A rota gasta ${r.custo} de energia, mas dá para chegar gastando só ${ref}.` };
    return { ok: true, nota: `Energia gasta: ${r.custo} (o mínimo possível) em ${r.movimentos.length} passos` };
  } },

  solution: `const PASSO = { N: [-1, 0], S: [1, 0], L: [0, 1], O: [0, -1] };

function planejarResgate(mapa, inicio) {
  const chave = (pos, cartoes) => pos.join(",") + "," + cartoes;
  const fila = [{ pos: inicio, cartoes: "", movimentos: [] }];
  const vistos = new Set([chave(inicio, "")]);
  while (fila.length) {
    const { pos, cartoes, movimentos } = fila.shift();
    if (mapa[pos[0]][pos[1]] === "@") return movimentos;
    for (const [mov, [dl, dc]] of Object.entries(PASSO)) {
      const viz = [pos[0] + dl, pos[1] + dc];
      const ch = mapa[viz[0]][viz[1]];
      if (ch === "#") continue;
      if ("XYZ".includes(ch) && !cartoes.includes(ch.toLowerCase())) continue;
      let novos = cartoes;
      if ("xyz".includes(ch) && !novos.includes(ch)) novos = [...novos, ch].sort().join("");
      if (vistos.has(chave(viz, novos))) continue;
      vistos.add(chave(viz, novos));
      fila.push({ pos: viz, cartoes: novos, movimentos: [...movimentos, mov] });
    }
  }
  return null;
}
`,

const MOTOR_URL = URL.createObjectURL(new Blob([MOTOR_SRC], { type: "text/javascript" }));
let semWorker = false;
function rodarSemWorker(msg){
  return new Promise((resolve) => {
    const falso = { postMessage: (m) => resolve(m), addEventListener(){}, onmessage: null };
    try { new Function("self", MOTOR_SRC)(falso); falso.onmessage({ data: msg }); }
    catch (e){ resolve({ out: [], error: { name: "Erro", message: String(e && e.message || e) } }); }
  });
}
function rodarJS(msg, timeout = 4000){
  if (semWorker) return rodarSemWorker(msg);
  return new Promise((resolve) => {
    let w;
    try { w = new Worker(MOTOR_URL); } catch (e){ semWorker = true; resolve(rodarSemWorker(msg)); return; }
    const t = setTimeout(() => { w.terminate(); resolve({ out: [], error: { name: "Timeout", message: "demorou demais" } }); }, timeout);
    w.onmessage = (e) => { clearTimeout(t); w.terminate(); resolve(e.data); };
    w.onerror = (e) => { e.preventDefault(); clearTimeout(t); w.terminate(); semWorker = true; resolve(rodarSemWorker(msg)); };
    w.postMessage(msg);
  });
}
const preludio = (m, caso) => ESTACAO_SRC + `\nconst caso = ${JSON.stringify(caso)};\nconst __verificar = (${m.verificar.toString()});\nconst drone = new Drone(caso.map);\nlet __res = null;\nreturn { globais: { __est: { async rodar(ns){ __res = await __rodarVerificacao(__verificar, ns, caso, drone); } } }, final: () => ({ res: __res, trace: drone.trace }) };`;

function checarSintaxe(code){
  try { acorn.parse(code, { ecmaVersion: "latest", sourceType: "script", allowAwaitOutsideFunction: true }); return null; }
  catch (e){
    const msg = String(e.message).replace(/\s*\(\d+:\d+\)\s*$/, "");
    let txt = "algo inesperado: confira parênteses, chaves, colchetes, vírgulas e aspas";
    if (/Unterminated string/.test(msg)) txt = "aspas abertas que não foram fechadas";
    else if (/Unterminated template/.test(msg)) txt = "uma template string (crase `) que não foi fechada";
    else if (/already been declared/.test(msg)) txt = (msg.match(/'(.+)'/) || [, "um nome"])[1] + " foi declarado duas vezes";
    else if (/Unexpected character/.test(msg)) txt = "um caractere estranho no código";
    else if (/Cannot use keyword 'await'|await is only valid/.test(msg)) txt = "await só funciona dentro de uma função async";
    return { line: e.loc ? e.loc.line : null, msg: txt };
  }
}
const HINTS = [
  [/is not defined/, "O JavaScript não conhece esse nome. Confira a grafia (maiúsculas contam) e se a variável ou função foi criada antes de ser usada."],
  [/before initialization/, "Uma variável foi usada antes da linha em que é criada com let/const."],
  [/Assignment to constant/, "Uma variável criada com const não pode receber outro valor. Use let se ela precisa mudar."],
  [/is not a function/, "Você chamou com parênteses algo que não é função. Confira o nome do método e se o objeto é do tipo que você imagina."],
  [/Cannot read properties of (undefined|null)|can't access property|undefined is not an object/i, "Você leu uma propriedade de algo que está undefined ou null. Confira índices de arrays, nomes de propriedades e se a função devolveu um valor."],
  [/is not iterable/, "for...of e o spread (...) precisam de algo percorrível, como um array."],
  [/Maximum call stack|too much recursion/i, "Uma função se chamou vezes demais. Confira o caso base da recursão."],
  [/must call super|super constructor/i, "Na classe filha, chame super(...) no constructor antes de usar this."],
  [/without 'new'/, "Classes precisam de new para criar objetos."],

function explicarErro(e){
  if (e.name === "Timeout") return { msg: "O código demorou demais e a estação interrompeu.", hint: "Algum laço nunca termina, a busca está repetindo estados já visitados, ou a estrutura é lenta demais para o volume de dados." };
  const base = `${e.name}: ${e.message}${e.line ? ` (linha ${e.line})` : ""}`;
  const h = HINTS.find(([re]) => re.test(base));
  return { msg: base, hint: h ? h[1] : "Um erro escapou do seu código sem ser tratado." };
}
async function rodarCaso(m, k, code){

}

function syncGutter(){
  if (!codeEl) return;

function insert(t, back=0){
  codeEl.setRangeText(t, codeEl.selectionStart, codeEl.selectionEnd, "end");
  if (back){ const p = codeEl.selectionStart-back; codeEl.setSelectionRange(p,p); }
  codeEl.dispatchEvent(new Event("input"));
}
function newline(){
  const v = codeEl.value, s = codeEl.selectionStart;
  const line = v.slice(v.lastIndexOf("\n", s-1)+1, s);
  const ind = line.match(/^ */)[0];
  if (/[{[(]\s*$/.test(line)){
    if (/^[}\])]/.test(v.slice(codeEl.selectionEnd))){ insert("\n" + ind + "  " + "\n" + ind, ind.length + 1); return; }
    insert("\n" + ind + "  "); return;
  }
  insert("\n"+ind);
}
function dedent(){
  const v = codeEl.value, s = codeEl.selectionStart, ls = v.lastIndexOf("\n", s-1)+1;
  const sp = v.slice(ls).match(/^ {1,2}/);
  if (sp){ codeEl.setRangeText("", ls, ls+sp[0].length, "end"); const p = Math.max(ls, s-sp[0].length); codeEl.setSelectionRange(p,p); codeEl.dispatchEvent(new Event("input")); }
