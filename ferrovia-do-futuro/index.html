<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Jogo de JavaScript intermediário: funções, objetos, classes, closures, código assíncrono e algoritmos comandando trens maglev.">
<meta name="theme-color" content="#0b0f1f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ferrovia">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Ferrovia do Futuro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: central de controle — briefing + editor à esquerda, painel da cidade fixo à direita.
   Visual único e escuro (cidade à noite com trilhos maglev em neon), escolhido de propósito. */
:root{
  color-scheme: dark;
  --bg:#0b0f1f; --panel:#121833; --panel-2:#18204a; --ink:#e8ecff; --ink-soft:#98a1cf; --line:#283163;
  --track:#151b3a; --track-2:#171e40; --rail:#3be6ff; --bld:#232b5a; --bld-hi:#343f7e; --bld-lo:#1a2048; --win:#ffd36b;
  --train:#f2f6ff; --nose:#3be6ff; --station:#ffd23f; --cargo:#ffb347; --boost:#ff4fd8;
  --accent:#3be6ff; --accent-ink:#04121a; --hot:#ff4fd8;
  --code-bg:#080b18; --code-fg:#e3e8ff; --code-dim:#6d76a6; --key:#1a2148;
  --ok:#5ff2a6; --ok-bg:#0f3327; --err:#ff8f9a; --err-bg:#3a1520; --star:#ffd23f; --star-off:#2e3769;
  --l0:#4da3ff; --l1:#3ddc84; --l2:#ffd23f; --l3:#ff5a5f; --l4:#b57bff; --l5:#f5b942;
  --f-display:"Space Grotesk", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-code:"JetBrains Mono", ui-monospace, Consolas, monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:radial-gradient(900px 360px at 85% -160px, #26206a 0%, transparent 70%), radial-gradient(700px 320px at -10% 0%, #0f2a55 0%, transparent 70%), var(--bg);background-color:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1340px;margin:0 auto;padding-block:14px 4px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:1.5rem;letter-spacing:-.01em;line-height:1}
.logo div{white-space:nowrap}
.logo small{display:block;font-family:var(--f-code);font-weight:400;font-size:.68rem;letter-spacing:.08em;color:var(--ink-soft);margin-top:4px}
.logo svg{width:42px;height:42px;flex:none}
.top-r{display:flex;align-items:center;gap:8px}
.pill{display:flex;align-items:center;gap:6px;white-space:nowrap;border:1.5px solid var(--line);background:var(--panel);border-radius:99px;padding:6px 12px;font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums}
.pill .st{color:var(--star)}
.btn{border:1.5px solid var(--line);background:var(--panel-2);border-radius:10px;padding:9px 16px;font-weight:700;font-size:.92rem;min-height:42px;color:var(--ink)}
.btn:hover{border-color:var(--ink-soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-soft);font-weight:600}
.btn:disabled{opacity:.5;cursor:not-allowed}

.wrap{max-width:1340px;margin:0 auto;padding-block:10px 40px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.game{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"mission board" "editor board";gap:16px;align-items:start}
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;min-width:0}
.mission{grid-area:mission;padding:20px 22px;border-top:4px solid var(--lc)}
.boardcard{grid-area:board;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);padding:14px;display:flex;flex-direction:column;gap:10px}
.edcol{grid-area:editor;display:flex;flex-direction:column;gap:10px;min-width:0}
.eyebrow{font-family:var(--f-code);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--lc)}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(1.7rem,3vw,2.3rem);line-height:1.05;margin:6px 0 12px;letter-spacing:-.02em;text-wrap:balance}
.mission p{margin:0 0 10px;max-width:64ch}
.mission code,.ref code{font-family:var(--f-code);font-size:.84em;background:var(--panel-2);padding:1px 5px;border-radius:4px;color:var(--ink)}
.mission pre,.ref pre{background:var(--code-bg);color:var(--code-fg);font-family:var(--f-code);font-size:.82rem;border-radius:10px;padding:10px 14px;margin:0 0 12px;overflow-x:auto;border:1px solid var(--line)}
.task{background:linear-gradient(135deg,#0d2a3a,#0d1830);border:1.5px solid var(--accent);border-radius:12px;padding:12px 14px;margin:6px 0 4px}
.task strong{display:block;font-family:var(--f-code);text-transform:uppercase;letter-spacing:.1em;font-size:.76rem;color:var(--accent);margin-bottom:4px}
.task p{margin:0}
details.ref{margin-top:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--panel-2)}
details.ref summary{cursor:pointer;padding:10px 14px;font-family:var(--f-code);letter-spacing:.06em;text-transform:uppercase;font-size:.8rem;color:var(--ink-soft);list-style:none}
details.ref summary::-webkit-details-marker{display:none}
details.ref summary::before{content:"▸ ";color:var(--accent)}
details.ref[open] summary::before{content:"▾ "}
.refbody{padding:0 14px 12px;display:flex;flex-direction:column;gap:10px;font-size:.88rem}
.goal{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.85rem;color:var(--ink-soft);margin-top:10px}
.goal b{color:var(--ink)}

/* editor */
.editor{background:var(--code-bg);border-radius:14px;overflow:hidden;border:1.5px solid var(--line)}
.ed-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px 9px 16px;border-bottom:1px solid var(--line);color:var(--code-dim);font-family:var(--f-code);font-size:.78rem}
.ed-body{display:grid;grid-template-columns:42px 1fr;min-height:260px;max-height:62vh;overflow:auto}
.gutter{padding:12px 8px 12px 0;text-align:right;font-family:var(--f-code);font-size:.86rem;line-height:1.6;color:#454e80;user-select:none;white-space:pre;font-variant-numeric:tabular-nums}
#code{background:transparent;color:var(--code-fg);border:0;resize:none;outline:none;padding:12px 12px 12px 10px;font-family:var(--f-code);font-size:.86rem;line-height:1.6;white-space:pre;overflow:hidden;tab-size:2;caret-color:var(--accent);min-height:260px;width:100%}
.keys{display:flex;gap:6px;overflow-x:auto;padding:8px;border-top:1px solid var(--line);scrollbar-width:none}
.keys::-webkit-scrollbar{display:none}
.keys button{flex:0 0 auto;min-width:40px;height:40px;padding:0 10px;border:0;border-radius:8px;background:var(--key);color:var(--code-fg);font-family:var(--f-code);font-size:.88rem}
.keys button:active{background:var(--line)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.speed{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;margin-left:auto}
.speed button{border:0;background:var(--panel);padding:8px 10px;font-size:.8rem;font-weight:700;color:var(--ink-soft)}
.speed button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.feedback{border-radius:12px;padding:12px 14px;font-size:.93rem;display:flex;flex-direction:column;gap:6px;overflow-wrap:anywhere}
.feedback.ok{background:var(--ok-bg);color:var(--ok);border:1.5px solid var(--ok)}
.feedback.bad{background:var(--err-bg);color:var(--err);border:1.5px solid var(--err)}
.feedback b{font-family:var(--f-display);font-size:1.05rem}
.feedback .row{display:flex;gap:8px;flex-wrap:wrap}
.feedback .btn{font-size:.85rem;padding:6px 12px;min-height:36px}
.hint{color:var(--ink);background:var(--panel);border-radius:8px;padding:8px 10px;font-size:.86rem;white-space:pre-wrap}
.solution{background:var(--code-bg);color:var(--code-fg);border-radius:8px;padding:10px 12px;font-family:var(--f-code);font-size:.8rem;white-space:pre;overflow-x:auto;margin:0;border:1px solid var(--line);max-height:360px}

/* cidade */
.bhead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.8rem;color:var(--ink-soft);font-variant-numeric:tabular-nums;font-family:var(--f-code)}
.bhead b{color:var(--ink)}
.maps{display:flex;gap:6px;flex-wrap:wrap}
.maps button{border:1.5px solid var(--line);background:var(--panel-2);border-radius:8px;padding:3px 9px;font-size:.76rem;font-weight:700;color:var(--ink-soft)}
.maps button[aria-current="true"]{border-color:var(--ink);color:var(--ink)}
.maps button.ok{border-color:var(--ok);color:var(--ok);background:var(--ok-bg)}
.maps button.bad{border-color:var(--err);color:var(--err);background:var(--err-bg)}
.stage{position:relative;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 0%, #1b2457 0%, #0a0e20 75%);border-radius:12px;padding:12px;overflow:hidden;min-height:200px;border:1px solid var(--line)}
.board{position:relative;display:grid;gap:0}
.cell{width:var(--c);height:var(--c);position:relative}
.cell.t{background:var(--track)}
.cell.t.alt{background:var(--track-2)}
.cell.t::before{content:"";position:absolute;left:50%;top:50%;width:14%;height:14%;transform:translate(-50%,-50%);border-radius:50%;background:var(--rail);opacity:.35;box-shadow:0 0 calc(var(--c)*.2) var(--rail)}
.cell.b{background:var(--bg)}
.cell.b::after{content:"";position:absolute;inset:6%;border-radius:calc(var(--c)*.12);background:
  radial-gradient(circle at 28% 30%, var(--win) 0 7%, transparent 8%), radial-gradient(circle at 70% 30%, var(--win) 0 7%, transparent 8%),
  radial-gradient(circle at 28% 66%, var(--win) 0 7%, transparent 8%), linear-gradient(160deg,var(--bld-hi),var(--bld) 55%,var(--bld-lo));opacity:.9}
.cell.b.v2::after{background:radial-gradient(circle at 70% 66%, var(--win) 0 7%, transparent 8%), radial-gradient(circle at 28% 30%, var(--win) 0 7%, transparent 8%), linear-gradient(160deg,var(--bld-hi),var(--bld) 55%,var(--bld-lo))}
.cell.b.v3::after{background:linear-gradient(160deg,var(--bld-hi),var(--bld) 55%,var(--bld-lo))}
.est{position:absolute;inset:12%;border-radius:50%;background:var(--station);color:#1a1400;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:calc(var(--c)*.42);box-shadow:0 0 calc(var(--c)*.3) rgba(255,210,63,.45);z-index:1}
.box{position:absolute;inset:22%;border-radius:3px;background:linear-gradient(135deg,#ffd9a0,var(--cargo) 50%,#c97a1d);box-shadow:0 0 10px rgba(255,179,71,.5);z-index:2;transition:transform .3s,opacity .3s}
.box::after{content:"";position:absolute;left:45%;top:0;bottom:0;width:10%;background:#8a4d0e;opacity:.6}
.box.got{transform:translateY(-80%) scale(.3);opacity:0}
.boost{position:absolute;inset:0;display:grid;place-items:center;color:var(--boost);font-family:var(--f-code);font-weight:700;font-size:calc(var(--c)*.6);transform:rotate(var(--r));text-shadow:0 0 8px var(--boost)}
.boost span{animation:flow 1s linear infinite}
@keyframes flow{0%{transform:translateX(-16%);opacity:.5}50%{opacity:1}100%{transform:translateX(16%);opacity:.5}}
.garage{position:absolute;inset:4%;z-index:1}
.robot{position:absolute;left:0;top:0;width:var(--c);height:var(--c);z-index:5;transition:transform var(--spd,180ms) ease-in-out}
.robot svg{width:100%;height:100%;transition:transform var(--spd,180ms) ease-in-out;filter:drop-shadow(0 0 6px rgba(59,230,255,.7))}
.robot.crash svg{animation:shake .35s}
@keyframes shake{0%,100%{translate:0}25%{translate:-8% 0}75%{translate:8% 0}}
.boom{position:absolute;width:var(--c);height:var(--c);border-radius:50%;background:radial-gradient(circle,#fff,var(--hot) 40%,transparent 70%);opacity:.85;z-index:6;animation:fade 1s forwards}
.blk{position:absolute;width:var(--c);height:var(--c);border:3px solid var(--hot);border-radius:6px;z-index:6;animation:fade .8s forwards}
@keyframes fade{to{opacity:0}}
.bubble{position:absolute;z-index:8;transform:translate(-50%,-110%);background:var(--ink);color:var(--bg);border-radius:8px;padding:2px 9px;font-weight:700;font-family:var(--f-code);font-size:.78rem;white-space:nowrap;max-width:none;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.bubble::after{content:"";position:absolute;left:50%;bottom:-5px;width:10px;height:10px;background:inherit;transform:translateX(-50%) rotate(45deg)}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(8,11,26,.86);z-index:10;padding:16px}
.win{background:var(--panel);border:2px solid var(--accent);border-radius:16px;padding:18px 20px;text-align:center;max-width:340px;display:flex;flex-direction:column;gap:8px;align-items:center}
.win b{font-family:var(--f-display);font-size:1.5rem}
.stars{display:flex;gap:4px;font-size:2rem;line-height:1}
.stars span{color:var(--star-off)}
.stars span.on{color:var(--star)}
.win .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.out{font-family:var(--f-code);font-size:.78rem;color:var(--ink-soft);white-space:pre-wrap;max-height:90px;overflow:auto;border-top:1px dashed var(--line);padding-top:6px}
.out:empty{display:none}
.note{font-size:.84rem;color:var(--ink-soft);overflow-wrap:anywhere;font-family:var(--f-code)}
.note:empty{display:none}
.legend{display:flex;gap:6px 12px;flex-wrap:wrap;font-size:.76rem;color:var(--ink-soft)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none}

/* mapa de linhas */
.levels{display:flex;flex-direction:column;gap:14px}
.world{padding:18px 20px 20px;border-left:6px solid var(--lc)}
.world h2{font-family:var(--f-display);margin:0;font-size:1.35rem;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.world h2 i{width:14px;height:14px;border-radius:50%;background:var(--lc);box-shadow:0 0 10px var(--lc);flex:none}
.world p{margin:2px 0 14px;color:var(--ink-soft);font-size:.92rem}
.metro{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));position:relative;gap:10px}
.metro::before{content:"";position:absolute;left:calc(100%/6);right:calc(100%/6);top:17px;height:6px;border-radius:3px;background:var(--lc);opacity:.85}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;border:0;background:none;padding:0 4px;color:var(--ink)}
.tile .dot{width:40px;height:40px;border-radius:50%;background:var(--bg);border:5px solid var(--lc);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:.95rem;position:relative;z-index:1;transition:transform .15s}
.tile:hover:not(:disabled) .dot{transform:scale(1.1)}
.tile.done .dot{background:var(--lc);color:var(--bg)}
.tile.next .dot{box-shadow:0 0 0 4px var(--bg),0 0 0 7px var(--accent)}
.tile b{font-size:.92rem;line-height:1.2;margin-top:4px}
.tile .s{font-size:.95rem;letter-spacing:2px}
.tile .s span{color:var(--star-off)} .tile .s span.on{color:var(--star)}
.tile:disabled{opacity:.45;cursor:not-allowed}
.intro-card{padding:20px 22px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.intro-card p{margin:0;max-width:66ch}
.intro-card .pre{font-size:.86rem;color:var(--ink-soft);margin-top:6px}
.loading{font-size:.8rem;color:var(--code-dim)}

@media (max-width:1020px){
  .game{grid-template-columns:minmax(0,1fr);grid-template-areas:"mission" "board" "editor"}
  .boardcard{position:static}
}
@media (max-width:600px){
  .mission{padding:16px}
  .top{gap:8px}
  .logo{font-size:1.05rem;gap:8px;min-width:0}
  .logo div{white-space:normal;line-height:1.05}
  .pill{padding:5px 9px}
  .logo svg{width:34px;height:34px}
  .logo small{display:none}
  .top .btn{padding:8px 12px}
  #code,.gutter{font-size:15px}
  .actions .btn{flex:1}
  .speed{margin-left:0;width:100%}
  .speed button{flex:1}
  .stage{min-height:240px}
  .overlay{overflow:auto;padding:10px}
  .win{padding:12px 14px;gap:6px}
  .win b{font-size:1.2rem}
  .stars{font-size:1.6rem}
  .world{padding:16px 14px}
  .tile b{font-size:.82rem}
}
@media (pointer:fine) and (min-width:1021px){.keys{display:none}}
@media (prefers-reduced-motion:reduce){.robot,.robot svg,.box,.tile .dot{transition:none}.robot.crash svg,.boost span{animation:none}}
</style>
</head>
<body>


<header class="top">
  <div class="logo"><svg viewBox="0 0 42 42" aria-hidden="true"><circle cx="21" cy="21" r="20" fill="#121833" stroke="#283163" stroke-width="1.5"/><path d="M4 30h34" stroke="#3be6ff" stroke-width="2" opacity=".6"/><path d="M7 27c0-5 4-9 11-9h9c5 0 9 3 10 9z" fill="#f2f6ff"/><path d="M28 18c4 1 7 4 9 9h-9z" fill="#3be6ff"/><rect x="11" y="21" width="5" height="3" rx="1" fill="#283163"/><rect x="18" y="21" width="5" height="3" rx="1" fill="#283163"/><circle cx="31" cy="12" r="1.4" fill="#ffd23f"/><circle cx="12" cy="10" r="1" fill="#ff4fd8"/></svg><div>Ferrovia do Futuro<small>JavaScript intermediário</small></div></div>
  <div class="top-r">
    <span class="pill" title="Estrelas conquistadas"><span class="st">★</span><span id="starCount">0</span></span>
    <button class="btn" id="levelsBtn">Linhas</button>
  </div>
</header>

<main class="wrap" id="view"></main>

<template id="gameTpl">
  <div class="game">
    <section class="card mission" id="mission"></section>
    <section class="card boardcard" aria-label="Painel da cidade">
      <div class="bhead"><span id="bstatus"></span><div class="maps" id="maps"></div></div>
      <div class="stage" id="stage"><div class="board" id="board"></div></div>
      <div class="note" id="note"></div>
      <div class="legend" id="legend"></div>
      <div class="out" id="out"></div>
    </section>
    <section class="edcol">
      <div class="editor">
        <div class="ed-head"><span>central.js</span><span id="engine" class="loading">preparando o JavaScript…</span></div>
        <div class="ed-body"><div class="gutter" id="gutter">1</div><textarea id="code" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off" aria-label="Editor de código JavaScript"></textarea></div>
        <div class="keys" id="keys" aria-label="Símbolos"></div>
      </div>
      <div class="actions">
        <button class="btn primary" id="run">▶ Enviar à Central</button>
        <button class="btn" id="stop" hidden>■ Parar</button>
        <button class="btn ghost" id="reset">Recomeçar código</button>
        <div class="speed" role="group" aria-label="Velocidade">
          <button data-speed="360">Lento</button><button data-speed="150">Normal</button><button data-speed="45">Rápido</button>
        </div>
      </div>
      <div id="feedback"></div>
    </section>
  </div>

  embarcar(n) {

  }
}
`,
  solution: `class Vagao {
  constructor(capacidade) {
    this.capacidade = capacidade;
    this.ocupados = 0;
  }

  get livres() {
    return this.capacidade - this.ocupados;
  }

  get lotado() {
    return this.livres === 0;
  }

  embarcar(n) {
    const entram = Math.min(n, this.livres);
    this.ocupados += entram;
    return entram;
  }

  desembarcar(n) {

`,
  hint: `livres é capacidade - ocupados. Em embarcar, quem entra é Math.min(n, this.livres); some isso em ocupados e devolva. desembarcar é parecido, com Math.min(n, this.ocupados).`,
  casos: [
    { cap: 40, ops: [["e", 25], ["e", 10], ["d", 5], ["e", 20], ["d", 50]] },
    { cap: 10, ops: [["e", 10], ["e", 1], ["d", 3], ["e", 2]] },

      const nome = op === "e" ? "embarcar" : "desembarcar";

      const r = v[nome](n);
      const esp = op === "e" ? Math.min(n, caso.cap - oc) : Math.min(n, oc);
      oc += op === "e" ? esp : -esp;
      if (r !== esp) return { ok: false, msg: `Vagão de ${caso.cap} lugares com ${oc - (op === "e" ? esp : -esp)} ocupados: ${nome}(${n}) devolveu ${fmt(r)}, mas o certo é ${esp}.` };
      if (v.ocupados !== oc) return { ok: false, msg: `Depois de ${nome}(${n}), ocupados deveria ser ${oc}, mas está ${fmt(v.ocupados)}.` };

{ id: "t8", zona: 2, titulo: "Engatando vagões", nomes: ["Composicao", "Vagao"],
  intro: `<p>Uma <b>composição</b> é o trem inteiro: um nome e vários vagões engatados. A classe <code>Vagao</code> da missão anterior já está pronta no editor.</p>

  starter: `class Vagao {

  }

}

class Composicao {

`,
  solution: `class Vagao {
  constructor(capacidade) {
    this.capacidade = capacidade;
    this.ocupados = 0;
  }
  get livres() {
    return this.capacidade - this.ocupados;
  }
  embarcar(n) {
    const entram = Math.min(n, this.livres);
    this.ocupados += entram;
    return entram;
  }
}

class Composicao {
  constructor(nome) {
    this.nome = nome;
    this.vagoes = [];
  }
  engatar(vagao) {
    this.vagoes.push(vagao);
    return this;
  }
  get capacidade() {
    return this.vagoes.reduce((t, v) => t + v.capacidade, 0);
  }
  get ocupados() {
    return this.vagoes.reduce((t, v) => t + v.ocupados, 0);
  }
  embarcar(n) {
    let entraram = 0;
    for (const v of this.vagoes) {
      entraram += v.embarcar(n - entraram);
    }
    return entraram;
  }
  toString() {
    return \`\${this.nome}: \${this.vagoes.length} vagões, \${this.ocupados}/\${this.capacidade}\`;
  }
}
`,
  hint: `capacidade e ocupados cabem num reduce sobre this.vagoes. Em embarcar, vá vagão por vagão pedindo para embarcar o que ainda falta (n - entraram) e somando o que cada um aceitou.`,
  casos: [
    { nome: "Expresso", caps: [40, 30], emb: [45, 30] },
    { nome: "Noturno", caps: [20, 20, 20], emb: [15, 15, 15, 15] },
    { nome: "Rápido", caps: [50], emb: [10] },
  ].map(k => ({ ...k, map: linhaComGaragem(["A", "B", "C", "D"], 3), nota: `${k.nome}: vagões de ${k.caps.join(", ")} lugares` })),
  verificar: async (ns, caso, trem) => {
    const Composicao = exige(ns, "Composicao", "classe");
    const Vagao = exige(ns, "Vagao", "classe");
    const c = new Composicao(caso.nome);
    if (c.nome !== caso.nome) return { ok: false, msg: `new Composicao("${caso.nome}") precisa guardar o nome em this.nome.` };
    if (!Array.isArray(c.vagoes) || c.vagoes.length) return { ok: false, msg: `Uma composição nova precisa começar com vagoes = [].` };
    let cadeia = c;
    for (const cap of caso.caps){
      const r = cadeia.engatar(new Vagao(cap));
      if (r !== c) return { ok: false, msg: `engatar(vagao) precisa devolver o próprio objeto (return this), para permitir trem.engatar(...).engatar(...).` };
      cadeia = r;
    }
    const capT = caso.caps.reduce((a, b) => a + b, 0);
    if (c.capacidade !== capT) return { ok: false, msg: `Com vagões de ${caso.caps.join(" + ")} lugares, capacidade deveria ser ${capT}, mas é ${fmt(c.capacidade)}.` };
    let oc = 0;
    for (const n of caso.emb){
      const r = c.embarcar(n), esp = Math.min(n, capT - oc); oc += esp;
      if (r !== esp) return { ok: false, msg: `Com ${oc - esp} de ${capT} ocupados, embarcar(${n}) devolveu ${fmt(r)}, mas o certo é ${esp}.` };
      if (c.ocupados !== oc) return { ok: false, msg: `Depois de embarcar(${n}), ocupados deveria ser ${oc}, mas está ${fmt(c.ocupados)}.` };
      trem.dizer(`+${r}`); trem.mover("L"); trem.mover("L"); trem.mover("L");
    }
    let resto = oc;
    for (const [i, cap] of caso.caps.entries()){ const esp = Math.min(cap, resto); resto -= esp; if (c.vagoes[i].ocupados !== esp) return { ok: false, msg: `Os vagões precisam encher em ordem: o vagão ${i + 1} deveria ter ${esp} pessoas, mas tem ${c.vagoes[i].ocupados}.` }; }
    const txt = `${caso.nome}: ${caso.caps.length} vagões, ${oc}/${capT}`;
    if (`${c}` !== txt) return { ok: false, msg: `toString() devolveu ${fmt(`${c}`)}, mas o certo é ${fmt(txt)}.` };
    trem.dizer(txt);
    while (!trem.naGaragem()) trem.mover("L");
    return { ok: true, nota: txt };
  } },

{ id: "t9", zona: 2, titulo: "Frota variada", nomes: ["Trem", "Maglev", "Cargueiro", "criarFrota"],

  task: `Crie <code>Maglev</code> e <code>Cargueiro</code> (herdando de <code>Trem</code>) e a função <code>criarFrota(dados)</code>, que transforma um array como <code>[{ tipo: "maglev", nome: "M1" }, { tipo: "carga", nome: "C1", toneladas: 300 }, { tipo: "comum", nome: "T1", velocidade: 90 }]</code> num array de objetos das classes certas.`,

  solution: `class Trem {
  constructor(nome, velocidade) {
    this.nome = nome;
    this.velocidade = velocidade; // km/h
  }
  tempoAte(km) {
    return Math.round(km / this.velocidade * 60);
  }
}

class Maglev extends Trem {
  constructor(nome) {
    super(nome, 480);
  }
  tempoAte(km) {
    return super.tempoAte(km) + 3;
  }
}

class Cargueiro extends Trem {

  }

function criarFrota(dados) {

  hint: `No Maglev, sobrescreva tempoAte e some 3 ao super.tempoAte(km). O Cargueiro só precisa calcular a velocidade no constructor: super(nome, Math.max(40, 120 - Math.floor(toneladas / 10))). Em criarFrota, um map com if para cada tipo.`,

    if (!(Object.getPrototypeOf(Maglev) === Trem)) return { ok: false, msg: `Maglev precisa herdar de Trem: class Maglev extends Trem.` };
    if (!(Object.getPrototypeOf(Cargueiro) === Trem)) return { ok: false, msg: `Cargueiro precisa herdar de Trem: class Cargueiro extends Trem.` };
    const frota = criarFrota(caso.dados.map(d => ({ ...d })));

    for (const [i, d] of caso.dados.entries()){
      const t = frota[i], Cls = d.tipo === "maglev" ? Maglev : d.tipo === "carga" ? Cargueiro : Trem;

      const vel = d.tipo === "maglev" ? 480 : d.tipo === "carga" ? Math.max(40, 120 - Math.floor(d.toneladas / 10)) : d.velocidade;
      const esp = Math.round(caso.km / vel * 60) + (d.tipo === "maglev" ? 3 : 0);

{ id: "t10", zona: 3, titulo: "Piloto automático", nomes: ["piloto"],
  intro: `<p>Agora quem dirige é o seu código. A cada passo, a estação chama <code>piloto(sensor)</code> e o trem anda para a direção que a função devolver: <code>"N"</code>, <code>"S"</code>, <code>"L"</code> ou <code>"O"</code>.</p>
  <p>O <code>sensor</code> é um objeto com métodos:</p>
  <pre>sensor.livre("L")     // true se há trilho para o leste
sensor.direcao()      // direção do último passo (começa em "L")
sensor.naGaragem()    // true quando chegou</pre>
  <p>Os trilhos não têm bifurcação, mas fazem curvas, e o mapa muda em cada caso. O trem nunca deve voltar pelo caminho de onde veio.</p>`,
  task: `Escreva <code>piloto(sensor)</code>: siga em frente se der; senão, vire para o lado livre (sem voltar de ré).`,
  starter: `const OPOSTO = { N: "S", S: "N", L: "O", O: "L" };

function piloto(sensor) {
  const frente = sensor.direcao();

}
`,
  solution: `const OPOSTO = { N: "S", S: "N", L: "O", O: "L" };

function piloto(sensor) {
  const frente = sensor.direcao();
  if (sensor.livre(frente)) return frente;
  for (const d of ["N", "S", "L", "O"]) {
    if (d !== OPOSTO[frente] && sensor.livre(d)) return d;
  }
}
`,
  hint: `Se sensor.livre(frente), devolva frente. Senão, percorra ["N", "S", "L", "O"] e devolva a primeira direção livre que não seja OPOSTO[frente].`,
  casos: [[4, 3, 5, 2], [6, 2, 3, 4, 2], [3, 5, 4, 3, 6], [2, 2, 2, 2, 2, 2], [9]].map((segs, i) => ({ map: rotaMapa(rotaDeSegmentos(segs, i % 2 === 0)), nota: `Trilho com ${segs.length - 1} curva${segs.length === 2 ? "" : "s"}` })),
  verificar: async (ns, caso, trem) => {
    const piloto = exige(ns, "piloto");
    let ultima = "L";
    const sensor = { livre: d => trem.livre(d), direcao: () => ultima, naGaragem: () => trem.naGaragem() };
    let n = 0;
    while (!trem.naGaragem()){
      if (++n > 300) return { ok: false, msg: "O trem andou demais sem chegar à garagem." };
      const d = piloto(sensor);
      if (d === OPOSTO[ultima] && n > 1) { trem.mover(d); return { ok: false, msg: `O piloto mandou o trem voltar de ré (para "${d}"). Nunca escolha a direção oposta à de onde veio.` }; }
      trem.mover(d); ultima = d;
    }
    return { ok: true, nota: `Chegou em ${n} passos` };
  } },

{ id: "t11", zona: 3, titulo: "Catracas", nomes: ["criarCatraca"],
  intro: `<p>Cada estação tem catracas que deixam passar um número limitado de pessoas por viagem e recusam o mesmo bilhete duas vezes. Como cada catraca precisa lembrar quem já passou, vamos usar uma <b>closure</b>: uma função criada dentro de outra, que continua enxergando as variáveis de lá.</p>
  <pre>function criarContador() {
  let n = 0;               // fica "guardado" dentro da função devolvida
  return () => ++n;
}
const c1 = criarContador(), c2 = criarContador();
c1(); c1(); c2();          // c1 está em 2, c2 está em 1</pre>
  <p>Um <code>Set</code> guarda valores sem repetição: <code>vistos.add(x)</code> e <code>vistos.has(x)</code>.</p>`,
  task: `Escreva <code>criarCatraca(limite)</code>, que devolve uma função <code>passar(bilhete)</code>. Ela devolve <code>true</code> se a pessoa pode passar, ou <code>false</code> se o bilhete já foi usado nesta catraca ou se o limite já foi atingido. Cada catraca é independente das outras.`,
  starter: `function criarCatraca(limite) {

  return function passar(bilhete) {

  };
}
`,
  solution: `function criarCatraca(limite) {
  const usados = new Set();
  return function passar(bilhete) {
    if (usados.has(bilhete) || usados.size >= limite) return false;
    usados.add(bilhete);
    return true;
  };
}
`,
  hint: `Crie um Set antes do return: ele fica guardado para cada catraca. Dentro de passar: se o Set já tem o bilhete ou já tem limite elementos, devolva false; senão, adicione e devolva true.`,
  casos: [
    { limites: [3], ops: [[0, "A1"], [0, "A2"], [0, "A1"], [0, "A3"], [0, "A4"]] },
    { limites: [2, 1], ops: [[0, "X"], [1, "X"], [1, "Y"], [0, "X"], [0, "Y"], [0, "Z"]] },
    { limites: [1, 1, 2], ops: [[2, "B1"], [0, "B1"], [2, "B1"], [1, "B2"], [2, "B3"], [2, "B4"], [0, "B2"]] },
  ].map(k => ({ ...k, map: linhaComGaragem(k.limites.map((_, i) => "ABC"[i]), 4), nota: `${k.limites.length} catraca${k.limites.length > 1 ? "s" : ""}` })),
  verificar: async (ns, caso, trem) => {
    const criar = exige(ns, "criarCatraca");
    const cats = caso.limites.map(l => criar(l));
    if (cats.some(c => typeof c !== "function")) return { ok: false, msg: `criarCatraca(limite) precisa devolver uma função, mas devolveu ${fmt(cats.find(c => typeof c !== "function"))}.` };
    const ref = caso.limites.map(l => ({ l, s: new Set() }));
    for (const [i, b] of caso.ops){
      const r = cats[i](b), R = ref[i];
      const esp = !(R.s.has(b) || R.s.size >= R.l); if (esp) R.s.add(b);
      if (r !== esp) return { ok: false, msg: `Na catraca ${i + 1} (limite ${R.l}), passar("${b}") devolveu ${fmt(r)}, mas o certo é ${esp}.${caso.limites.length > 1 ? " Lembre que cada catraca guarda seus próprios bilhetes." : ""}` };
      trem.dizer(`${"ABC"[i]} ${b}: ${r ? "✓" : "✗"}`);
    }
    while (!trem.naGaragem()) trem.mover("L");
    return { ok: true, nota: `${caso.ops.length} bilhetes conferidos` };
  } },

{ id: "t12", zona: 3, titulo: "Ordens com defeito", nomes: ["interpretar", "executar"],
  intro: `<p>Às vezes o rádio chega com ruído. As ordens agora vêm como <code>"L:3, S:2"</code>, e algumas estão estragadas: direção desconhecida, quantidade que não é um número inteiro positivo.</p>
  <p>Em vez de devolver um valor especial, a função que interpreta <b>lança um erro</b>, e quem chama decide o que fazer com <code>try/catch</code>:</p>
  <pre>throw new Error("Direção inválida: X");

try {
  movimentos.push(...interpretar(ordem));
} catch (e) {
  erros.push(e.message);
}</pre>
  <p><code>/^\\d+$/.test(texto)</code> confere se o texto tem só algarismos.</p>`,
  task: `Escreva <code>interpretar(ordem)</code>, que devolve o array de movimentos ou lança <code>Error</code> com a mensagem <code>Direção inválida: X</code> ou <code>Quantidade inválida: Y</code> (com o pedaço que veio, sem espaços nas pontas). E <code>executar(ordens)</code>, que devolve <code>{ movimentos, erros }</code>: todos os movimentos das ordens válidas, em ordem, e as mensagens de erro das inválidas. Uma ordem com qualquer parte ruim é descartada inteira.`,
  starter: `function interpretar(ordem) {
  const movimentos = [];
  for (const parte of ordem.split(",")) {
    const [direcao, quantidade] = parte.trim().split(":");

  }
  return movimentos;
}

function executar(ordens) {
  const movimentos = [];
  const erros = [];

  return { movimentos, erros };
}
`,
  solution: `function interpretar(ordem) {
  const movimentos = [];
  for (const parte of ordem.split(",")) {
    const [direcao, quantidade = ""] = parte.trim().split(":");
    if (!["N", "S", "L", "O"].includes(direcao)) {
      throw new Error(\`Direção inválida: \${direcao}\`);
    }
    const q = quantidade.trim();
    if (!/^\\d+$/.test(q) || Number(q) <= 0) {
      throw new Error(\`Quantidade inválida: \${q}\`);
    }
    for (let i = 0; i < Number(q); i++) movimentos.push(direcao);
  }
  return movimentos;
}

function executar(ordens) {
  const movimentos = [];
  const erros = [];
  for (const ordem of ordens) {
    try {
      movimentos.push(...interpretar(ordem));
    } catch (e) {
      erros.push(e.message);
    }
  }
  return { movimentos, erros };
}
`,
  hint: `Em interpretar: teste a direção com includes e a quantidade com /^\\d+$/ (e maior que zero); se algo falhar, throw new Error(...). Só depois coloque os movimentos no array. Em executar, chame interpretar dentro de try, junte os movimentos com push(...array) e guarde e.message no catch.`,
  casos: [
    { ordens: ["L:3", "S:2", "X:4", "L:dois", "L:1", "N:0", "S:3"], marcas: { 4: "E" } },
    { ordens: ["L:2, S:3", "L:4, Q:1", "L:5", "N:2,L:2"], marcas: { 7: "E" } },
    { ordens: ["L:3", "L:2.5", "O:-1", "S:2", "L:3", "N:três"], marcas: { 2: "E", 6: "E" } },
  ].map(k => {
    const movs = []; for (const o of k.ordens){ try { movs.push(...interpretarRef(o)); } catch (e){} }
    return { ordens: k.ordens, map: rotaMapa(movs, k.marcas), nota: `${k.ordens.length} ordens recebidas` };
  }),
  verificar: async (ns, caso, trem) => {
    const interpretar = exige(ns, "interpretar"), executar = exige(ns, "executar");
    for (const o of caso.ordens){
      let esp, espErro = null; try { esp = interpretarRef(o); } catch (e){ espErro = e.message; }
      let r, rErro = null, lancou = false;
      try { r = interpretar(o); } catch (e){ lancou = true; rErro = e && e.message; }
      if (espErro){
        if (!lancou) return { ok: false, msg: `interpretar("${o}") deveria lançar um erro (${espErro}), mas devolveu ${fmt(r)}.` };
        if (rErro !== espErro) return { ok: false, msg: `interpretar("${o}") lançou o erro ${fmt(rErro)}, mas a mensagem certa é ${fmt(espErro)}.` };
      } else {
        if (lancou) return { ok: false, msg: `interpretar("${o}") lançou o erro ${fmt(rErro)}, mas essa ordem é válida.` };
        if (!igual(r, esp)) return { ok: false, msg: `interpretar("${o}") devolveu ${fmt(r)}, mas o certo é ${fmt(esp)}.` };
      }
    }
    const res = executar(caso.ordens.slice());
    const movs = [], erros = []; for (const o of caso.ordens){ try { movs.push(...interpretarRef(o)); } catch (e){ erros.push(e.message); } }
    if (!res || !Array.isArray(res.movimentos) || !Array.isArray(res.erros)) return { ok: false, msg: `executar precisa devolver { movimentos, erros }, mas devolveu ${fmt(res)}.` };
    if (!igual(res.erros, erros)) return { ok: false, msg: `executar devolveu erros = ${fmt(res.erros)}, mas o certo é ${fmt(erros)}.` };
    if (!igual(res.movimentos, movs)){ seguir(trem, res.movimentos); return { ok: false, msg: `executar devolveu movimentos = ${fmt(res.movimentos)}, mas o certo é ${fmt(movs)}.` }; }
    const s = seguir(trem, res.movimentos); if (!s.ok) return s;
    trem.dizer(`${erros.length} ordens descartadas`);
    return { ok: true, nota: `${movs.length} movimentos, ${erros.length} erros` };
  } },

{ id: "t13", zona: 4, titulo: "Sinal de partida", nomes: ["partir"],
  intro: `<p>Partir com segurança leva tempo: fechar as portas demora, e o sinal da linha só abre quando o trecho à frente está livre. Esses passos devolvem <b>Promises</b>, e o trem só pode acelerar depois que as duas terminarem.</p>
  <pre>async function exemplo(controle) {
  await controle.fecharPortas();   // espera as portas fecharem
  ...
}</pre>
  <p>O <code>controle</code> tem: <code>anunciar(texto)</code> (na hora), <code>fecharPortas()</code> (Promise), <code>aguardarSinal()</code> (Promise) e <code>acelerar()</code> (na hora). O destino do trem está em <code>controle.destino</code>.</p>`,
  task: `Escreva a função <code>async</code> <code>partir(controle)</code>, que anuncia <code>Próxima estação: X</code> (com o destino), espera as portas fecharem, espera o sinal abrir e só então acelera.`,
  starter: `async function partir(controle) {

}
`,
  solution: `async function partir(controle) {
  controle.anunciar(\`Próxima estação: \${controle.destino}\`);
  await controle.fecharPortas();
  await controle.aguardarSinal();
  controle.acelerar();
}
`,
  hint: `Quatro linhas: controle.anunciar(...) com uma template string, await controle.fecharPortas(), await controle.aguardarSinal() e controle.acelerar(). Sem o await, o trem aceleraria com as portas abertas.`,
  casos: [{ destino: "Aurora", sinal: 1500 }, { destino: "Porto Novo", sinal: 400 }, { destino: "Vila Solar", sinal: 3000 }].map(k => ({ ...k, map: linhaComGaragem(["A"], 6), nota: `Destino: ${k.destino}` })),
  verificar: async (ns, caso, trem) => {
    const partir = exige(ns, "partir");
    const log = []; const t0 = Date.now(); let portas = false, sinal = false;
    const controle = {
      destino: caso.destino,
      anunciar: (t) => { log.push(["anunciar", String(t)]); trem.dizer(String(t)); },
      fecharPortas: () => { log.push(["portas"]); return new Promise(r => setTimeout(() => { portas = true; trem.dizer("portas fechadas"); trem.esperar(400); r(); }, 800)); },
      aguardarSinal: () => { log.push(["sinal"]); return new Promise(r => setTimeout(() => { sinal = true; trem.dizer("sinal verde"); trem.esperar(400); r(); }, caso.sinal)); },
      acelerar: () => { log.push(["acelerar", portas, sinal, Date.now() - t0]); },
    };
    const p = partir(controle);
    if (!p || typeof p.then !== "function") return { ok: false, msg: `partir precisa ser uma função async (async function partir...).` };
    await p;
    const an = log.find(x => x[0] === "anunciar");
    if (!an) return { ok: false, msg: `O trem partiu sem anunciar a próxima estação.` };
    if (an[1] !== `Próxima estação: ${caso.destino}`) return { ok: false, msg: `O anúncio foi ${fmt(an[1])}, mas deveria ser ${fmt("Próxima estação: " + caso.destino)}.` };
    const ac = log.filter(x => x[0] === "acelerar");
    if (!ac.length) return { ok: false, msg: `O trem não acelerou. Chame controle.acelerar() no fim.` };
    if (ac.length > 1) return { ok: false, msg: `acelerar() foi chamado ${ac.length} vezes; uma basta.` };
    if (!ac[0][1]) return { ok: false, msg: `O trem acelerou com as portas abertas! Use await na Promise de fecharPortas().` };
    if (!ac[0][2]) return { ok: false, msg: `O trem acelerou antes do sinal abrir! Use await em aguardarSinal().` };
    while (!trem.naGaragem()) trem.mover("L");
    return { ok: true, nota: `Partiu ${ac[0][3]} ms depois do anúncio` };
  } },

{ id: "t14", zona: 4, titulo: "Painel ao vivo", nomes: ["painel"],
  intro: `<p>O painel da Central consulta a lotação de várias estações. Cada consulta é uma Promise que leva meio segundo. Esperar uma por uma deixaria o painel lento demais.</p>
  <p><code>Promise.all</code> dispara todas ao mesmo tempo e espera o conjunto. O resultado vem na mesma ordem do array original:</p>
  <pre>const promessas = ids.map(id => consultar(id));
const valores = await Promise.all(promessas);</pre>`,
  task: `Escreva a função <code>async</code> <code>painel(ids, consultar)</code>, que devolve <code>{ lotacoes, maisCheia }</code>: o array de lotações na ordem dos ids e o id da estação com maior lotação (em empate, a que aparece primeiro). O painel inteiro precisa ficar pronto em menos de 1 segundo.`,
  starter: `async function painel(ids, consultar) {

}
`,
  solution: `async function painel(ids, consultar) {
  const lotacoes = await Promise.all(ids.map(id => consultar(id)));
  let maior = 0;
  for (let i = 1; i < lotacoes.length; i++) {
    if (lotacoes[i] > lotacoes[maior]) maior = i;
  }
  return { lotacoes, maisCheia: ids[maior] };
}
`,
  hint: `const lotacoes = await Promise.all(ids.map(id => consultar(id))). Depois ache a posição do maior valor com um laço (use > para manter o primeiro em caso de empate) e devolva { lotacoes, maisCheia: ids[posicao] }.`,
  casos: [
    { ids: ["A", "B", "C", "D"], dados: { A: 120, B: 340, C: 90, D: 340 } },
    { ids: ["C", "A"], dados: { A: 15, C: 80 } },
    { ids: ["B", "C", "D", "A", "E"], dados: { A: 5, B: 0, C: 77, D: 12, E: 78 } },
  ].map(k => ({ ...k, map: linhaComGaragem([...k.ids].sort(), 3), nota: `${k.ids.length} estações consultadas` })),
  verificar: async (ns, caso, trem) => {
    const painel = exige(ns, "painel");
    let chamadas = 0;
    const consultar = (id) => { chamadas++; return new Promise(r => setTimeout(() => r(caso.dados[id]), 500)); };
    const t0 = Date.now();
    const p = painel(caso.ids.slice(), consultar);
    if (!p || typeof p.then !== "function") return { ok: false, msg: `painel precisa ser uma função async.` };
    const r = await p; const dt = Date.now() - t0;
    const lot = caso.ids.map(id => caso.dados[id]);
    let mi = 0; lot.forEach((v, i) => { if (v > lot[mi]) mi = i; });
    if (!r || !igual(r.lotacoes, lot)) return { ok: false, msg: `painel devolveu lotacoes = ${fmt(r && r.lotacoes)}, mas o certo é ${fmt(lot)} (na ordem dos ids).` };
    if (r.maisCheia !== caso.ids[mi]) return { ok: false, msg: `maisCheia veio ${fmt(r.maisCheia)}, mas o certo é ${fmt(caso.ids[mi])}.` };
    if (chamadas !== caso.ids.length) return { ok: false, msg: `consultar foi chamada ${chamadas} vezes, mas são ${caso.ids.length} estações.` };
    if (dt >= 1000) return { ok: false, msg: `O painel levou ${dt} ms para ficar pronto. Dispare todas as consultas juntas com Promise.all em vez de esperar uma por uma.` };
    for (const e of [...caso.ids].sort()){ while (trem.aqui() !== e) trem.mover("L"); trem.dizer(`${e}: ${caso.dados[e]}`); }
    while (!trem.naGaragem()) trem.mover("L");
    return { ok: true, nota: `Pronto em ${dt} ms · mais cheia: ${r.maisCheia}` };
  } },

{ id: "t15", zona: 4, titulo: "Rádio com chiado", nomes: ["comRetentativas"],
  intro: `<p>A comunicação com os trens às vezes falha. Em vez de desistir na primeira, a Central tenta de novo algumas vezes, esperando um pouco entre as tentativas.</p>
  <p>Com <code>await</code>, uma Promise rejeitada vira um erro comum, que o <code>try/catch</code> pega:</p>
  <pre>try {
  return await tarefa();
} catch (e) {
  ultimoErro = e;
}
await new Promise(r => setTimeout(r, 200));   // espera 200 ms</pre>`,
  task: `Escreva a função <code>async</code> <code>comRetentativas(tarefa, tentativas)</code>: chame <code>tarefa()</code> até ela dar certo, no máximo <code>tentativas</code> vezes, esperando <b>200 ms</b> entre uma tentativa e outra. Se der certo, devolva o resultado; se todas falharem, lance o <b>último</b> erro.`,
  starter: `const esperar = ms => new Promise(r => setTimeout(r, ms));

async function comRetentativas(tarefa, tentativas) {

}
`,
  solution: `const esperar = ms => new Promise(r => setTimeout(r, ms));

async function comRetentativas(tarefa, tentativas) {
  let ultimoErro;
  for (let i = 1; i <= tentativas; i++) {
    try {
      return await tarefa();
    } catch (e) {
      ultimoErro = e;
      if (i < tentativas) await esperar(200);
    }
  }
  throw ultimoErro;
}
`,
  hint: `Um for de 1 até tentativas. Dentro, try { return await tarefa(); } catch (e) { guarde e; se não for a última, await esperar(200); }. Depois do for, throw do último erro.`,
  casos: [{ falhas: 0, tentativas: 3 }, { falhas: 2, tentativas: 3 }, { falhas: 5, tentativas: 3 }, { falhas: 3, tentativas: 5 }].map(k => ({ ...k, map: linhaComGaragem(["A"], 5), nota: `O rádio falha ${k.falhas} vez${k.falhas === 1 ? "" : "es"}; limite de ${k.tentativas} tentativas` })),
  verificar: async (ns, caso, trem) => {
    const f = exige(ns, "comRetentativas");
    let chamadas = 0; const tempos = []; const t0 = Date.now();
    const tarefa = () => { chamadas++; tempos.push(Date.now() - t0); const k = chamadas;
      return new Promise((ok, falha) => setTimeout(() => k <= caso.falhas ? falha(new Error(`sem sinal (tentativa ${k})`)) : ok(`conectado na tentativa ${k}`), 50)); };
    let r, erro = null, lancou = false;
    const p = f(tarefa, caso.tentativas);
    if (!p || typeof p.then !== "function") return { ok: false, msg: `comRetentativas precisa ser uma função async.` };
    try { r = await p; } catch (e){ lancou = true; erro = e; }
    const espCham = Math.min(caso.falhas + 1, caso.tentativas), sucesso = caso.falhas < caso.tentativas;
    if (chamadas !== espCham) return { ok: false, msg: `tarefa() foi chamada ${chamadas} vezes, mas o certo seria ${espCham} (falha ${caso.falhas}, limite ${caso.tentativas}).` };
    for (let i = 1; i < tempos.length; i++) if (tempos[i] - tempos[i - 1] < 250) return { ok: false, msg: `Entre a tentativa ${i} e a ${i + 1} passaram só ${tempos[i] - tempos[i - 1] - 50} ms. Espere 200 ms antes de tentar de novo.` };
    if (sucesso){
      if (lancou) return { ok: false, msg: `A tentativa ${espCham} deu certo, mas comRetentativas lançou ${fmt(erro)}.` };
      if (r !== `conectado na tentativa ${espCham}`) return { ok: false, msg: `comRetentativas devolveu ${fmt(r)}, mas deveria devolver o resultado da tarefa: ${fmt("conectado na tentativa " + espCham)}.` };
      trem.dizer(r); while (!trem.naGaragem()) trem.mover("L");
      return { ok: true, nota: r };
    }
    if (!lancou) return { ok: false, msg: `Todas as ${caso.tentativas} tentativas falharam, então comRetentativas deveria lançar o último erro, mas devolveu ${fmt(r)}.` };
    if (!erro || erro.message !== `sem sinal (tentativa ${caso.tentativas})`) return { ok: false, msg: `O erro lançado foi ${fmt(erro && erro.message)}, mas deveria ser o último: ${fmt("sem sinal (tentativa " + caso.tentativas + ")")}.` };
    trem.dizer("sem sinal: trem fica na estação");
    return { ok: true, nota: `Desistiu depois de ${caso.tentativas} tentativas` , fica: true };
  } },

{ id: "t16", zona: 5, titulo: "Menor caminho", nomes: ["menorCaminho"],
  intro: `<p>A cidade virou um labirinto de trilhos. Para chegar à garagem gastando o mínimo de energia, o trem precisa do <b>menor caminho</b>.</p>
  <p>A <b>busca em largura</b> resolve isso: explore primeiro todas as casas a 1 passo, depois as a 2, e assim por diante, usando uma fila. Guarde de onde você veio para cada casa e, ao chegar, refaça o caminho de trás para frente.</p>
  <pre>const fila = [inicio];
const veioDe = new Map([[chave(inicio), null]]);
while (fila.length) {
  const atual = fila.shift();
  ...
}</pre>`,
  task: `Escreva <code>menorCaminho(mapa, inicio, fim)</code>, que devolve o array de movimentos (<code>"N"</code>, <code>"S"</code>, <code>"L"</code>, <code>"O"</code>) do menor caminho entre <code>inicio</code> e <code>fim</code> (ambos <code>[linha, coluna]</code>).`,
  starter: `const PASSO = { N: [-1, 0], S: [1, 0], L: [0, 1], O: [0, -1] };

function menorCaminho(mapa, inicio, fim) {

}
`,
  solution: `const PASSO = { N: [-1, 0], S: [1, 0], L: [0, 1], O: [0, -1] };

function menorCaminho(mapa, inicio, fim) {
  const chave = ([l, c]) => l + "," + c;
  const veioDe = new Map([[chave(inicio), null]]);
  const fila = [inicio];
  while (fila.length) {
    const atual = fila.shift();
    if (atual[0] === fim[0] && atual[1] === fim[1]) {
      const movimentos = [];
      let k = chave(atual);
      while (veioDe.get(k)) {
        const [anterior, mov] = veioDe.get(k);
        movimentos.push(mov);
        k = anterior;
      }
      return movimentos.reverse();
    }
    for (const [mov, [dl, dc]] of Object.entries(PASSO)) {
      const viz = [atual[0] + dl, atual[1] + dc];
      if (mapa[viz[0]][viz[1]] === "#" || veioDe.has(chave(viz))) continue;
      veioDe.set(chave(viz), [chave(atual), mov]);
      fila.push(viz);
    }
  }
  return null;
}
`,
  hint: `Use uma fila (array com push e shift) e um Map veioDe que guarda, para cada casa "l,c", a casa anterior e o movimento usado. Ao tirar o fim da fila, volte pelo veioDe juntando os movimentos e inverta com reverse().`,
  casos: [[7, 5, 3, 6], [9, 6, 11, 10], [6, 7, 29, 14]].map(([w, h, seed, abrir]) => { const m = mapaLabirinto(w, h, seed, abrir); return { map: m, nota: `Labirinto ${w * 2 + 1} × ${h * 2 + 1}` }; }),
  verificar: async (ns, caso, trem) => {
    const f = exige(ns, "menorCaminho");
    const ini = [caso.map.start[1], caso.map.start[0]], fim = posDe(caso.map.grid, "@");
    const r = f(caso.map.grid.slice(), ini.slice(), fim.slice());
    const ref = bfsRef(caso.map.grid, ini, fim);
    if (!Array.isArray(r)) return { ok: false, msg: `menorCaminho precisa devolver um array de movimentos, mas devolveu ${fmt(r)}.` };
    const s = seguir(trem, r); if (!s.ok) return s;
    const c = chegada(trem); if (!c.ok) return c;
    if (r.length > ref.length) return { ok: false, msg: `O trem chegou, mas com ${r.length} movimentos. O menor caminho tem ${ref.length}.` };
    return { ok: true, nota: `${r.length} movimentos (o mínimo possível)` };
  } },

{ id: "t17", zona: 5, titulo: "Baldeação", nomes: ["rotaEntreEstacoes"],
  intro: `<p>Passageiros querem ir de uma estação a outra com o <b>menor número de paradas</b>. A Central monta um objeto com as conexões diretas de cada estação:</p>
  <pre>{ A: ["B", "E"], B: ["A", "C"], C: ["B"], E: ["A"] }</pre>
  <p>É o mesmo problema da missão anterior, mas agora num <b>grafo</b>: cada estação é um nó e as conexões são as ligações. A busca em largura continua funcionando.</p>`,
  task: `Escreva <code>rotaEntreEstacoes(conexoes, origem, destino)</code>, que devolve o array de estações da origem até o destino (incluindo as duas) com o menor número de paradas, ou <code>null</code> se não houver caminho. Se origem e destino forem iguais, devolva <code>[origem]</code>.`,
  starter: `function rotaEntreEstacoes(conexoes, origem, destino) {

}
`,
  solution: `function rotaEntreEstacoes(conexoes, origem, destino) {
  const anterior = { [origem]: null };
  const fila = [origem];
  while (fila.length) {
    const atual = fila.shift();
    if (atual === destino) {
      const rota = [];
      for (let e = destino; e !== null; e = anterior[e]) rota.push(e);
      return rota.reverse();
    }
    for (const vizinha of conexoes[atual] || []) {
      if (!(vizinha in anterior)) {
        anterior[vizinha] = atual;
        fila.push(vizinha);
      }
    }
  }
  return null;
}
`,
  hint: `Igual à busca em largura do menor caminho: fila começando na origem e um objeto anterior. Para cada vizinha ainda não vista, guarde anterior[vizinha] = atual. Ao chegar no destino, volte pelo anterior até a origem e inverta.`,
  casos: [
    { rows: METRO[0], de: "A", para: "F" }, { rows: METRO[1], de: "G", para: "D" }, { rows: METRO[0], de: "K", para: "K" }, { rows: METRO[2], de: "A", para: "D" },
  ].map(k => { const p = posDe(k.rows, k.de); const grid = k.rows.map(r => r); return { map: { grid, start: [p[1], p[0]] }, de: k.de, para: k.para, conexoes: conexoesDe(grid), nota: `De ${k.de} para ${k.para}` }; }),
  verificar: async (ns, caso, trem) => {
    const f = exige(ns, "rotaEntreEstacoes");
    const con = JSON.parse(JSON.stringify(caso.conexoes));
    const r = f(con, caso.de, caso.para);
    const ref = rotaEstacoesRef(caso.conexoes, caso.de, caso.para);
    if (ref === null){
      if (r !== null) return { ok: false, msg: `Não existe caminho de ${caso.de} até ${caso.para}, então o certo é devolver null, mas veio ${fmt(r)}.` };
      trem.dizer("sem caminho"); return { ok: true, nota: `Sem caminho de ${caso.de} até ${caso.para}`, fica: true };
    }
    if (!Array.isArray(r)) return { ok: false, msg: `rotaEntreEstacoes precisa devolver um array de estações, mas devolveu ${fmt(r)}.` };
    if (r[0] !== caso.de || r[r.length - 1] !== caso.para) return { ok: false, msg: `A rota ${fmt(r)} precisa começar em ${caso.de} e terminar em ${caso.para}.` };
    for (let i = 1; i < r.length; i++) if (!(caso.conexoes[r[i - 1]] || []).includes(r[i])) return { ok: false, msg: `Na rota ${fmt(r)}, não existe ligação direta entre ${r[i - 1]} e ${r[i]}.` };
    if (r.length > ref.length) return { ok: false, msg: `A rota ${fmt(r)} tem ${r.length - 1} trechos, mas dá para ir com ${ref.length - 1}: ${fmt(ref)}.` };
    for (let i = 1; i < r.length; i++){
      const alvo = posDe(caso.map.grid, r[i]);
      const movs = bfsRef(caso.map.grid, [trem.l, trem.c], alvo, (ch) => !/[A-Z]/.test(ch));
      seguir(trem, movs); trem.dizer(r[i]);
    }
    return { ok: true, nota: r.join(" → "), fica: true };
  } },

{ id: "t18", zona: 5, titulo: "Missão final: entregas", nomes: ["planejarEntregas"],
  intro: `<p>Última missão! Antes de recolher, o trem precisa passar por todos os pontos de entrega <code>"E"</code> da cidade e terminar na garagem <code>"@"</code>, com energia limitada.</p>

  solution: `const PASSO = { N: [-1, 0], S: [1, 0], L: [0, 1], O: [0, -1] };

function menorCaminho(mapa, inicio, fim) {
  const chave = ([l, c]) => l + "," + c;
  const veioDe = new Map([[chave(inicio), null]]);
  const fila = [inicio];
  while (fila.length) {
    const atual = fila.shift();
    if (atual[0] === fim[0] && atual[1] === fim[1]) {
      const movimentos = [];
      let k = chave(atual);
      while (veioDe.get(k)) {
        const [anterior, mov] = veioDe.get(k);
        movimentos.push(mov);
        k = anterior;
      }
      return movimentos.reverse();
    }
    for (const [mov, [dl, dc]] of Object.entries(PASSO)) {
      const viz = [atual[0] + dl, atual[1] + dc];
      if (mapa[viz[0]][viz[1]] === "#" || veioDe.has(chave(viz))) continue;
      veioDe.set(chave(viz), [chave(atual), mov]);
      fila.push(viz);
    }
  }
  return null;
}

function acharTodas(mapa, letra) {
  const casas = [];
  mapa.forEach((linha, l) => {
    [...linha].forEach((ch, c) => {
      if (ch === letra) casas.push([l, c]);
    });
  });
  return casas;
}

function planejarEntregas(mapa, inicio) {
  const faltam = acharTodas(mapa, "E");
  const rota = [];
  let pos = inicio;
  while (faltam.length) {
    let melhor = null;
    let indice = -1;
    faltam.forEach((alvo, i) => {
      const caminho = menorCaminho(mapa, pos, alvo);
      if (!melhor || caminho.length < melhor.length) {
        melhor = caminho;
        indice = i;
      }
    });
    rota.push(...melhor);
    pos = faltam.splice(indice, 1)[0];
  }
  rota.push(...menorCaminho(mapa, pos, acharTodas(mapa, "@")[0]));
  return rota;
}
`,
  hint: `Ache todas as casas "E". Enquanto faltar alguma: calcule o menorCaminho da posição atual até cada uma, escolha o mais curto, junte os movimentos na rota e tire essa entrega da lista. No fim, some o caminho até "@".`,
  casos: [[6, 4, 5, 6, 4], [8, 5, 12, 8, 6], [9, 6, 31, 12, 7]].map(([w, h, seed, abrir, n]) => {
    const m = mapaLabirinto(w, h, seed, abrir, n);

    return { map: m, energia: m.limite, nota: `${n} entregas · energia: ${m.limite} movimentos` };
  }),

    const r = f(caso.map.grid.slice(), ini.slice());

    trem.limite = caso.energia + 1;

    const total = acharTodos(caso.map.grid, "E").length;
    if (r.length > caso.energia) return { ok: false, msg: `A rota tem ${r.length} movimentos, mas a energia só dá para ${caso.energia}. Escolha sempre a entrega mais próxima.` };
    if (trem.coletados.size < total) return { ok: false, msg: `O trem passou por ${trem.coletados.size} de ${total} pontos de entrega.` };
    const c = chegada(trem); if (!c.ok) return c;
    return { ok: true, nota: `${total} entregas em ${r.length} movimentos (energia: ${caso.energia})` };
  } },
];

const MOTOR_URL = URL.createObjectURL(new Blob([MOTOR_SRC], { type: "text/javascript" }));
let semWorker = false;
function rodarSemWorker(msg){
  return new Promise((resolve) => {
    const falso = { postMessage: (m) => resolve(m), addEventListener(){}, onmessage: null };
    try { new Function("self", MOTOR_SRC)(falso); falso.onmessage({ data: msg }); }
    catch (e){ resolve({ out: [], error: { name: "Erro", message: String(e && e.message || e) } }); }
  });
}
function rodarJS(msg, timeout = 4000){
  if (semWorker) return rodarSemWorker(msg);
  return new Promise((resolve) => {
    let w;
    try { w = new Worker(MOTOR_URL); } catch (e){ semWorker = true; resolve(rodarSemWorker(msg)); return; }
    const t = setTimeout(() => { w.terminate(); resolve({ out: [], error: { name: "Timeout", message: "demorou demais" } }); }, timeout);
    w.onmessage = (e) => { clearTimeout(t); w.terminate(); resolve(e.data); };
    w.onerror = (e) => { e.preventDefault(); clearTimeout(t); w.terminate(); semWorker = true; resolve(rodarSemWorker(msg)); };
    w.postMessage(msg);
  });
}

function explicarErro(e){
  if (e.name === "Timeout") return { msg: "O código demorou demais e a Central interrompeu.", hint: "Algum laço nunca termina, ou a busca está repetindo casas já visitadas." };

  const h = HINTS.find(([re]) => re.test(base));

}
async function rodarCaso(m, k, code){
  const r = await rodarJS({ code, inputs: [], prelude: preludio(m, m.casos[k]), suffix: sufixo(m), seed: 7 + k });
  const out = (r.out || []).map(x => typeof x === "string" ? x : x[1]).join("");
  const fin = r.jogo || { res: null, trace: [] };
  return { trace: fin.trace || [], res: fin.res, err: r.error, out };
}
async function runAll(){
  if (!ready || running) return;
  const m = MISSOES[cur], code = codeEl.value;
  codeEl.blur(); fbEl.innerHTML = "";
  const sx = checarSintaxe(code);
  if (sx){ attempts++; return fail(`Erro de sintaxe${sx.line ? " na linha " + sx.line : ""}: ${sx.msg}.`, "O JavaScript não conseguiu entender o código. Olhe a linha indicada e a de cima dela."); }
  running = true; abort = false; attempts++;
  const myRun = ++runId;
  $("#run").hidden = true; $("#stop").hidden = false;
  mapStatus = m.casos.map(()=>null); renderMaps();
  if (isPhone()) $(".boardcard").scrollIntoView({behavior:"smooth", block:"start"});
  let allOk = true;
  for (let k = 0; k < m.casos.length; k++){
    shownMap = k; renderMaps(); resetBoard();
    if (k>0) await wait(300);
    if (myRun !== runId) return;
    const { trace, res, err, out } = await rodarCaso(m, k, code);
    if (myRun !== runId) return;
    const done = await animate(trace);
    if (myRun !== runId) return;
    $("#out").textContent = out.trim();
    if (!done){ allOk = false; fbEl.innerHTML = `<div class="feedback bad"><b>Envio interrompido</b>Ajuste o código e envie de novo.</div>`; break; }
    if (err){ const { msg, hint } = explicarErro(err); mapStatus[k] = false; renderMaps(); allOk = false; fail(`${m.casos.length>1?`Cenário ${k+1}: `:""}${msg}`, hint); break; }
    if (!res || !res.ok){ mapStatus[k] = false; renderMaps(); allOk = false; fail(`${m.casos.length>1?`Cenário ${k+1}: `:""}${res ? res.msg : "a Central não recebeu resposta. Confira se as funções terminam (e se as Promises se resolvem)."}`, ""); break; }
    if (res.nota) $("#note").textContent = res.nota;
    mapStatus[k] = true; renderMaps();
    await wait(Math.max(450, speed*3));
  }
  running = false; $("#run").hidden = false; $("#stop").hidden = true;
  if (allOk) win(m, code);
}
function stopRun(){ abort = true; running = false; runId++; }
function win(m, code){
  const n = starsFor(m, code), lines = linhasDeCodigo(code);
  const best = Math.max(stars[m.id]||0, n); stars[m.id] = best; store.set("stars", stars); updateStarCount();
  const last = cur === MISSOES.length-1;
  const ov = document.createElement("div"); ov.className = "overlay";
  ov.innerHTML = `<div class="win" role="dialog" aria-label="Missão concluída"><b>${last?"A rede está no ar!":"Missão cumprida!"}</b><div class="stars">${starsHtml(n)}</div>
    <span>${lines} linhas de código · meta para 3 estrelas: ${m.par}</span>
    ${n<3?`<span style="color:var(--ink-soft);font-size:.88rem">Funciona! Dá para deixar mais enxuto?</span>`:""}
    <div class="row">${last?`<button class="btn primary" data-lv>Ver linhas</button>`:`<button class="btn primary" data-next>Próxima missão →</button>`}<button class="btn" data-stay>Ficar aqui</button></div></div>`;
  $("#stage").appendChild(ov);
  const nx = ov.querySelector("[data-next]"); if (nx) nx.onclick = ()=>openLevel(cur+1);
  const lv = ov.querySelector("[data-lv]"); if (lv) lv.onclick = showLevels;
  ov.querySelector("[data-stay]").onclick = ()=>ov.remove();
  fbEl.innerHTML = `<div class="feedback ok"><b>Missão concluída com ${n} estrela${n>1?"s":""}</b>${m.casos.length>1?`O código passou nos ${m.casos.length} cenários.`:"A Central aprovou o código."}</div>`;
  $("#mission .goal").lastElementChild.innerHTML = `Melhor: <b style="color:var(--star)">${"★".repeat(best)}</b>`;
}
function fail(msg, hint){
  const m = MISSOES[cur];
  fbEl.innerHTML = `<div class="feedback bad"><b>Ainda não</b><span>${esc(msg)}</span>${hint?`<span style="color:var(--ink)">${esc(hint)}</span>`:""}
    <div class="row"><button class="btn" data-hint>Ver dica</button>${attempts>=2?`<button class="btn" data-sol>Ver solução</button>`:""}</div><div data-extra></div></div>`;
  fbEl.querySelector("[data-hint]").onclick = ()=> fbEl.querySelector("[data-extra]").innerHTML = `<div class="hint">${esc(m.hint)}</div>`;
  const sb = fbEl.querySelector("[data-sol]");
  if (sb) sb.onclick = ()=>{
    const box = fbEl.querySelector("[data-extra]");
    box.innerHTML = `<pre class="solution">${esc(m.solution)}</pre><div class="row" style="margin-top:6px"><button class="btn" data-use>Usar no editor</button></div>`;
    box.querySelector("[data-use]").onclick = ()=>{ codeEl.value = m.solution; syncGutter(); saveCode(); };
  };
}

/* ---------------- editor ---------------- */
function syncGutter(){
  if (!codeEl) return;
  const n = codeEl.value.split("\n").length;
  gutterEl.textContent = Array.from({length:n},(_,i)=>i+1).join("\n");
  codeEl.style.height = "auto"; codeEl.style.height = codeEl.scrollHeight+"px";
  const pw = codeEl.parentElement.clientWidth-42;
  codeEl.style.width = "auto"; codeEl.style.width = Math.max(pw, codeEl.scrollWidth)+"px";
}
function insert(t, back=0){
  codeEl.setRangeText(t, codeEl.selectionStart, codeEl.selectionEnd, "end");
  if (back){ const p = codeEl.selectionStart-back; codeEl.setSelectionRange(p,p); }
  codeEl.dispatchEvent(new Event("input"));
}
function newline(){
  const v = codeEl.value, s = codeEl.selectionStart;
  const line = v.slice(v.lastIndexOf("\n", s-1)+1, s);
  const ind = line.match(/^ */)[0];
  if (/[{[(]\s*$/.test(line)){
    if (/^[}\])]/.test(v.slice(codeEl.selectionEnd))){ insert("\n" + ind + "  " + "\n" + ind, ind.length + 1); return; }
    insert("\n" + ind + "  "); return;
  }
  insert("\n"+ind);
}
function dedent(){
  const v = codeEl.value, s = codeEl.selectionStart, ls = v.lastIndexOf("\n", s-1)+1;
  const sp = v.slice(ls).match(/^ {1,2}/);
  if (sp){ codeEl.setRangeText("", ls, ls+sp[0].length, "end"); const p = Math.max(ls, s-sp[0].length); codeEl.setSelectionRange(p,p); codeEl.dispatchEvent(new Event("input")); }
}
function setupEditor(){
  codeEl.addEventListener("input", ()=>{ syncGutter(); saveCode(); });
  codeEl.addEventListener("keydown", e=>{
    const v = codeEl.value, s = codeEl.selectionStart, en = codeEl.selectionEnd;
    if ((e.ctrlKey||e.metaKey) && e.key==="Enter"){ e.preventDefault(); runAll(); return; }
    if (e.key==="Tab"){ e.preventDefault(); e.shiftKey ? dedent() : insert("  "); return; }
    if (e.key==="Enter" && !e.isComposing){ e.preventDefault(); newline(); return; }
    if ((e.key==="}" || e.key==="]" || e.key===")") && s===en){
      const before = v.slice(v.lastIndexOf("\n", s-1)+1, s);
      if (/^ {2,}$/.test(before)){ e.preventDefault(); codeEl.setRangeText(e.key, s-2, s, "end"); codeEl.dispatchEvent(new Event("input")); return; }
    }
    if (e.key==="Backspace" && s===en){
      const before = v.slice(v.lastIndexOf("\n", s-1)+1, s);
      if (before.length && /^ +$/.test(before)){ e.preventDefault(); const k = (before.length-1)%2+1; codeEl.setRangeText("", s-k, s, "end"); codeEl.dispatchEvent(new Event("input")); }
    }
  });
  syncGutter();
}
const KEYS = [["⇥","tab"],["⇤","dedent"],[";",";"],["{ }","{}",1],["( )","()",1],["[ ]","[]",1],["\" \"","\"\"",1],["` `","``",1],["${ }","${}",1],["=>"," => "],["===","==="],["!","!"],["&&"," && "],["||"," || "],["...","..."],[".","."],[",",", "],["const","const "],["let","let "],["return","return "],["this","this."],["await","await "],["↵","enter"]];
function setupKeys(){
  const kb = $("#keys"); kb.innerHTML = "";
  KEYS.forEach(([label,val,back])=>{
    const b = document.createElement("button"); b.type="button"; b.textContent=label;
    b.setAttribute("aria-label", val==="tab"?"Recuar":val==="dedent"?"Desfazer recuo":val==="enter"?"Nova linha":"Inserir "+val.trim());
    b.addEventListener("pointerdown", e=>e.preventDefault());
    b.onclick = ()=>{ if (document.activeElement!==codeEl) codeEl.focus();
      if (val==="tab") insert("  "); else if (val==="dedent") dedent(); else if (val==="enter") newline(); else insert(val, back||0); };
    kb.appendChild(b);
  });
}
let lastW = window.innerWidth;
window.addEventListener("resize", ()=>{
  if (Math.abs(window.innerWidth - lastW) < 40) return;
  lastW = window.innerWidth;
  if (cur!==null && !running){ resetBoard(); syncGutter(); }
});

(()=>{
  updateStarCount();
  ready = typeof Worker !== "undefined" && !!window.acorn;
  const c = store.get("cur", null);
  if (c!==null && MISSOES[c] && unlocked(c)) openLevel(c); else showLevels();
})();
</script>

if ("serviceWorker" in navigator) {

}
