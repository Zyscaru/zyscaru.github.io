<style>
/* Layout: mesa de brinquedo — missão + editor à esquerda, tabuleiro fixo à direita; no celular: missão, tabuleiro, editor */
:root{
  --bg:#eef4e2; --panel:#ffffff; --ink:#24301c; --ink-soft:#5a6a4c; --line:#d3e0bf;
  --floor:#cfe6ad; --floor2:#c3dd9e; --wall:#3e7a36; --wall-hi:#5d9a4f;
  --robot:#f2b81b; --robot-dark:#b9860a; --coin:#e05b9a; --coin-hi:#ffd1e6; --flag:#c77d12;
  --accent:#2f7a2a; --code-bg:#1d2618; --code-fg:#eef3e6; --code-dim:#93a385; --key:#2c3825;
  --ok:#2f7a2a; --ok-bg:#e3f2d9; --err:#c2362f; --err-bg:#fbe6e4; --star:#f2b81b; --star-off:#cfd8c3;
  --f-display:"Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Nunito Sans", "Segoe UI", system-ui, sans-serif;
  --f-code:"JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10170d; --panel:#182214; --ink:#e9f0df; --ink-soft:#a5b496; --line:#2c3a24;
  --floor:#273a1f; --floor2:#22331b; --wall:#2b5626; --wall-hi:#447a3a;
  --accent:#9bd67f; --code-bg:#0c1209; --key:#202b1a; --flag:#e09a2c;
  --ok:#8fd36f; --ok-bg:#1b3215; --err:#ff8c84; --err-bg:#43212a; --star-off:#3a4a30; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#10170d; --panel:#182214; --ink:#e9f0df; --ink-soft:#a5b496; --line:#2c3a24;
  --floor:#273a1f; --floor2:#22331b; --wall:#2b5626; --wall-hi:#447a3a;
  --accent:#9bd67f; --code-bg:#0c1209; --key:#202b1a; --flag:#e09a2c;
  --ok:#8fd36f; --ok-bg:#1b3215; --err:#ff8c84; --err-bg:#43212a; --star-off:#3a4a30; color-scheme:dark;}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1320px;margin:0 auto;padding-block:14px 4px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:1.5rem;letter-spacing:.01em}
.logo svg{width:36px;height:36px}
.top-r{display:flex;align-items:center;gap:8px}
.pill{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--panel);border-radius:99px;padding:6px 12px;font-weight:800;font-size:.9rem;font-variant-numeric:tabular-nums}
.pill .st{color:var(--star)}
.btn{border:1.5px solid var(--ink);background:var(--panel);border-radius:10px;padding:9px 16px;font-weight:800;font-size:.92rem;min-height:42px}
.btn:hover{background:var(--floor2)}
.btn.primary{background:var(--robot);border-color:var(--robot);color:#24301c}
.btn.primary:hover{background:#ffcc33;border-color:#ffcc33}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-soft);font-weight:700}
.btn:disabled{opacity:.5;cursor:not-allowed}

.wrap{max-width:1320px;margin:0 auto;padding-block:10px 40px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.game{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);grid-template-areas:"mission board" "editor board";gap:16px;align-items:start}
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:16px;min-width:0}
.mission{grid-area:mission;padding:20px 22px}
.boardcard{grid-area:board;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);padding:14px;display:flex;flex-direction:column;gap:10px}
.edcol{grid-area:editor;display:flex;flex-direction:column;gap:10px;min-width:0}
.eyebrow{font-family:var(--f-display);font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--robot-dark)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .eyebrow{color:var(--robot)}}
:root[data-theme="dark"] .eyebrow{color:var(--robot)}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(1.6rem,3vw,2.2rem);line-height:1.1;margin:4px 0 12px;text-wrap:balance}
.mission p{margin:0 0 10px;max-width:62ch}
.mission code,.ref code{font-family:var(--f-code);font-size:.86em;background:var(--floor2);padding:1px 5px;border-radius:4px}
.mission pre{background:var(--code-bg);color:var(--code-fg);font-family:var(--f-code);font-size:.86rem;border-radius:10px;padding:10px 14px;margin:0 0 12px;overflow-x:auto}
.ref{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.ref h2{font-family:var(--f-display);font-size:.95rem;margin:0;letter-spacing:.02em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--floor);border-radius:8px;padding:5px 9px;font-family:var(--f-code);font-size:.82rem;text-align:left}
.chip:hover{border-color:var(--accent)}
.chip small{display:block;font-family:var(--f-body);font-size:.75rem;color:var(--ink-soft)}
.goal{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.85rem;color:var(--ink-soft);margin-top:10px}
.goal b{color:var(--ink)}

/* editor */
.editor{background:var(--code-bg);border-radius:16px;overflow:hidden}
.ed-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px 9px 16px;border-bottom:1px solid #ffffff14;color:var(--code-dim);font-family:var(--f-code);font-size:.78rem}
.ed-body{display:grid;grid-template-columns:40px 1fr;min-height:220px;max-height:50vh;overflow:auto}
.gutter{padding:12px 8px 12px 0;text-align:right;font-family:var(--f-code);font-size:.92rem;line-height:1.6;color:#56608a;user-select:none;white-space:pre;font-variant-numeric:tabular-nums}
#code{background:transparent;color:var(--code-fg);border:0;resize:none;outline:none;padding:12px 12px 12px 10px;font-family:var(--f-code);font-size:.92rem;line-height:1.6;white-space:pre;overflow:hidden;tab-size:4;caret-color:var(--coin);min-height:220px;width:100%}
.keys{display:flex;gap:6px;overflow-x:auto;padding:8px;border-top:1px solid #ffffff14;scrollbar-width:none}
.keys::-webkit-scrollbar{display:none}
.keys button{flex:0 0 auto;min-width:40px;height:40px;padding:0 10px;border:0;border-radius:8px;background:var(--key);color:var(--code-fg);font-family:var(--f-code);font-size:.95rem}
.keys button:active{background:var(--accent)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.speed{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;margin-left:auto}
.speed button{border:0;background:var(--panel);padding:8px 10px;font-size:.8rem;font-weight:700;color:var(--ink-soft)}
.speed button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.feedback{border-radius:12px;padding:12px 14px;font-size:.93rem;display:flex;flex-direction:column;gap:6px}
.feedback.ok{background:var(--ok-bg);color:var(--ok);border:1.5px solid var(--ok)}
.feedback.bad{background:var(--err-bg);color:var(--err);border:1.5px solid var(--err)}
.feedback b{font-family:var(--f-display);font-size:1rem}
.feedback .row{display:flex;gap:8px;flex-wrap:wrap}
.feedback .btn{font-size:.85rem;padding:6px 12px;min-height:36px}
.hint{color:var(--ink);background:var(--panel);border-radius:8px;padding:8px 10px;font-size:.88rem;white-space:pre-wrap;font-family:var(--f-code)}
.solution{background:var(--code-bg);color:var(--code-fg);border-radius:8px;padding:10px 12px;font-family:var(--f-code);font-size:.85rem;white-space:pre;overflow-x:auto;margin:0}

/* tabuleiro */
.bhead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.85rem;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.bhead b{color:var(--ink)}
.maps{display:flex;gap:6px}
.maps button{border:1.5px solid var(--line);background:var(--floor);border-radius:8px;padding:3px 9px;font-size:.78rem;font-weight:700;color:var(--ink-soft)}
.maps button[aria-current="true"]{border-color:var(--ink);color:var(--ink)}
.maps button.ok{border-color:var(--ok);color:var(--ok);background:var(--ok-bg)}
.maps button.bad{border-color:var(--err);color:var(--err);background:var(--err-bg)}
.stage{position:relative;display:grid;place-items:center;background:var(--floor2);border-radius:12px;padding:10px;overflow:hidden;min-height:180px}
.board{position:relative;display:grid;gap:0}
.cell{width:var(--c);height:var(--c);position:relative}
.cell.f{background:var(--floor)}
.cell.f.alt{background:var(--floor2)}
.cell.w{background:radial-gradient(circle at 30% 30%,var(--wall-hi) 0 18%,transparent 19%),radial-gradient(circle at 70% 62%,var(--wall-hi) 0 14%,transparent 15%),var(--wall);border-radius:calc(var(--c)*.3);box-shadow:inset 0 calc(var(--c)*-.1) 0 rgba(0,0,0,.2);transform:scale(.94)}
.coin{position:absolute;left:50%;top:50%;width:70%;height:70%;transform:translate(-50%,-50%);transition:transform .3s, filter .3s, opacity .3s;z-index:2}
.coin svg{width:100%;height:100%;display:block}
.coin.got{transform:translate(-50%,-50%) scale(.7);filter:grayscale(1);opacity:.45}
.pollen{position:absolute;width:calc(var(--c)*.22);height:calc(var(--c)*.22);border-radius:50%;background:#ffd84a;z-index:6;pointer-events:none;animation:sobe .7s ease-out forwards}
@keyframes sobe{to{transform:translateY(calc(var(--c)*-.9)) scale(.3);opacity:0}}
.flag{position:absolute;inset:8%;z-index:1}
.robot{position:absolute;left:0;top:0;width:var(--c);height:var(--c);z-index:3;transition:transform var(--spd,180ms) ease-in-out}
.robot svg{width:100%;height:100%;transition:transform var(--spd,180ms) ease-in-out;filter:drop-shadow(0 4px 2px rgba(0,0,0,.22))}
.robot svg .asa{transform-origin:50% 46%;animation:bate .16s infinite alternate}
@keyframes bate{to{transform:scaleX(.82)}}
.robot.crash svg{animation:shake .35s}
@keyframes shake{0%,100%{translate:0}25%{translate:-8% 0}75%{translate:8% 0}}
.boom{position:absolute;width:var(--c);height:var(--c);border-radius:20%;background:var(--err);opacity:.45;z-index:4;animation:fade 1s forwards}
@keyframes fade{to{opacity:0}}
.bubble{position:absolute;z-index:5;transform:translate(-50%,-100%);background:var(--panel);color:var(--ink);border:2px solid var(--ink);border-radius:10px;padding:2px 10px;font-weight:800;font-family:var(--f-display);font-size:1rem;white-space:nowrap}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--floor2) 82%,transparent);z-index:10;padding:16px}
.win{background:var(--panel);border:2px solid var(--ink);border-radius:16px;padding:18px 20px;text-align:center;max-width:320px;display:flex;flex-direction:column;gap:8px;align-items:center}
.win b{font-family:var(--f-display);font-size:1.4rem}
.stars{display:flex;gap:4px;font-size:2rem;line-height:1}
.stars span{color:var(--star-off)}
.stars span.on{color:var(--star)}
.win .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.out{font-family:var(--f-code);font-size:.82rem;color:var(--ink-soft);white-space:pre-wrap;max-height:90px;overflow:auto}
.out:empty{display:none}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem;color:var(--ink-soft)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}

/* mapa de fases */
.levels{display:flex;flex-direction:column;gap:14px}
.world{padding:18px 20px}
.world h2{font-family:var(--f-display);margin:0;font-size:1.25rem}
.world p{margin:2px 0 12px;color:var(--ink-soft);font-size:.92rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:4px;text-align:left;border:1.5px solid var(--line);background:var(--floor);border-radius:12px;padding:10px 12px}
.tile:hover:not(:disabled){border-color:var(--ink)}
.tile .n{font-family:var(--f-display);font-size:.78rem;color:var(--ink-soft);letter-spacing:.06em}
.tile b{font-size:.95rem;line-height:1.2}
.tile .s{font-size:1rem;letter-spacing:2px}
.tile .s span{color:var(--star-off)} .tile .s span.on{color:var(--star)}
.tile:disabled{opacity:.55;cursor:not-allowed}
.tile.next{border-color:var(--robot);box-shadow:0 0 0 2px var(--robot) inset}
.intro-card{padding:20px 22px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.intro-card p{margin:0;max-width:60ch}
.loading{font-size:.8rem;color:var(--code-dim)}

@media (max-width:980px){
  .game{grid-template-columns:minmax(0,1fr);grid-template-areas:"mission" "board" "editor"}
  .boardcard{position:static}
}
@media (max-width:600px){
  .mission{padding:16px}
  .top .pill.lvl{display:none}
  #code,.gutter{font-size:16px}
  .actions .btn{flex:1}
  .speed{margin-left:0;width:100%}
  .speed button{flex:1}
}
@media (pointer:fine) and (min-width:981px){.keys{display:none}}
@media (prefers-reduced-motion:reduce){.robot,.robot svg,.coin{transition:none}.robot.crash svg,.robot svg .asa,.pollen{animation:none}}
</style>
</head>

        </div>
      </div>
      <div id="feedback"></div>
    </section>
  </div>
</template>

/* Voo da Abelha — simulação (roda tanto na página quanto dentro do Worker) */
var DIRS = { N:0, L:1, S:2, O:3 };          // N=cima, L=direita, S=baixo, O=esquerda
var DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];
class ErroAbelha extends Error {}
class Sim {
  constructor(map){
    this.grid = map.grid.map(r => r.split(""));
    this.h = this.grid.length; this.w = this.grid[0].length;
    this.x = map.start[0]; this.y = map.start[1]; this.dir = DIRS[map.start[2]];
    this.flores = new Set(); this.totalFlores = 0;
    this.grid.forEach((row, y) => row.forEach((c, x) => {

      if (c === "F" || c === "G") this.colmeia = [x, y];

  }

  tick(){ if (++this.passos > 1500) this.erro("A abelha fez movimentos demais. Talvez o laço nunca termine: confira a condição do while."); }

    if (this.parede(nx, ny)){ this.trace.push({ t:"crash", x:nx, y:ny }); this.erro("A abelha bateu na cerca viva!"); }

  }
  virar(lado){ this.tick(); this.dir = (this.dir + (lado > 0 ? 1 : 3)) % 4; this.trace.push({ t:"turn", d:lado }); }

    this.tick();

function corredor(len, flores = [], colmeia = true){
  const w = len + 3;
  const row = ["#"];
  for (let x = 1; x <= len + 1; x++){
    if (x === len + 1) row.push(colmeia ? (flores.includes(x) ? "G" : "F") : (flores.includes(x) ? "o" : "."));
    else row.push(flores.includes(x) ? "o" : ".");
  }
  row.push("#");
  return { grid: ["#".repeat(w), row.join(""), "#".repeat(w)], start: [1, 1, "L"] };
}
function trilha(segmentos, dirInicial = "L", floresEm = []){
  let x = 0, y = 0, d = DIRS[dirInicial];
  const cells = [[0, 0]];
  segmentos.forEach((len) => {
    for (let k = 0; k < len; k++){ x += DX[d]; y += DY[d]; cells.push([x, y]); }
    d = (d + 1) % 4;
  });
  const minX = Math.min(...cells.map(c => c[0])), minY = Math.min(...cells.map(c => c[1]));
  const maxX = Math.max(...cells.map(c => c[0])), maxY = Math.max(...cells.map(c => c[1]));
  const W = maxX - minX + 3, H = maxY - minY + 3;
  const g = Array.from({ length: H }, () => Array(W).fill("#"));
  cells.forEach(([cx, cy], i) => {
    const gx = cx - minX + 1, gy = cy - minY + 1;
    const last = i === cells.length - 1, flor = floresEm.includes(i);
    g[gy][gx] = last ? (flor ? "G" : "F") : (flor ? "o" : ".");
  });
  return { grid: g.map(r => r.join("")), start: [1 - minX, 1 - minY, dirInicial] };
}

/* ---------------- execução ---------------- */
const MOTOR_URL = URL.createObjectURL(new Blob([MOTOR_SRC], { type: "text/javascript" }));
let semWorker = false;
function rodarSemWorker(msg){
  return new Promise((resolve) => {
    const falso = { postMessage: (m) => resolve(m), addEventListener(){}, onmessage: null };
    try { new Function("self", MOTOR_SRC)(falso); falso.onmessage({ data: msg }); }
    catch (e){ resolve({ out: [], error: { name: "Erro", message: String(e && e.message || e) } }); }
  });
}
function rodarJS(msg, timeout = 3000){
  if (semWorker) return rodarSemWorker(msg);
  return new Promise((resolve) => {
    let w;
    try { w = new Worker(MOTOR_URL); } catch (e){ semWorker = true; resolve(rodarSemWorker(msg)); return; }
    const t = setTimeout(() => { w.terminate(); resolve({ out: [], error: { name: "Timeout", message: "demorou demais" } }); }, timeout);
    w.onmessage = (e) => { clearTimeout(t); w.terminate(); resolve(e.data); };
    w.onerror = (e) => { e.preventDefault(); clearTimeout(t); w.terminate(); semWorker = true; resolve(rodarSemWorker(msg)); };
    w.postMessage(msg);
  });
}
const prelude = (map) => SIM_SRC + `\nconst sim = new Sim(${JSON.stringify(map)});\nreturn { globais: sim.comandos(), final: () => sim.final() };`;
function checarSintaxe(code){
  try { acorn.parse(code, { ecmaVersion: "latest", sourceType: "script", allowAwaitOutsideFunction: true }); return null; }
  catch (e){
    const msg = String(e.message).replace(/\s*\(\d+:\d+\)\s*$/, "");
    let txt = "algo inesperado: confira parênteses, chaves, vírgulas e aspas";
    if (/Unterminated string/.test(msg)) txt = "aspas abertas que não foram fechadas";
    else if (/already been declared/.test(msg)) txt = "uma variável ou função criada duas vezes com o mesmo nome";
    else if (/Unexpected character/.test(msg)) txt = "um caractere estranho no código";
    return { line: e.loc ? e.loc.line : null, msg: txt };
  }
}
const NOMES = Object.keys(COMANDOS);
function semParenteses(code){
  const limpo = code.replace(/\/\/.*$/gm, "");
  for (const n of NOMES){ const m = new RegExp(`\\b${n}\\b(?!\\s*\\()`).exec(limpo); if (m && !new RegExp(`function\\s+${n}\\b`).test(limpo)) return n; }
  return null;
}
async function simulate(f, map, code){
  const r = await rodarJS({ code, inputs: [], prelude: prelude(map), seed: 7 });
  const out = (r.out || []).map(x => typeof x === "string" ? x : x[1]).join("");
  const fin = r.jogo || { trace: [], ditos: [], chegou: false, restantes: 0, total: 0, falha: null };
  let err = null, res = null;
  if (fin.falha) err = fin.falha;
  else if (r.error){
    if (r.error.name === "Timeout") err = "O programa demorou demais e foi interrompido.";
    else err = `${r.error.name}: ${r.error.message}${r.error.line ? ` (linha ${r.error.line})` : ""}`;
  } else if (!fin.chegou) res = { ok:false, msg:"O programa terminou, mas a abelha não chegou à colmeia." };
  else if (fin.restantes) res = { ok:false, msg:`A abelha chegou, mas ficaram ${fin.restantes} flor${fin.restantes>1?"es":""} sem coletar.` };
  else if (f.say){
    const ult = fin.ditos.length ? fin.ditos[fin.ditos.length-1] : null;
    if (ult === null) res = { ok:false, msg:"A abelha chegou, mas não disse nada. Use dizer(...) para informar a resposta." };
    else if (ult !== String(fin.total)) res = { ok:false, msg:`A abelha disse ${ult}, mas a resposta certa neste mapa era ${fin.total}.` };
    else res = { ok:true };
  } else res = { ok:true };
  return { sim: fin, out, err, res, line: r.error && r.error.line };
}
const HINTS = [
  [/bateu na cerca/, "Confira para onde a abelha está olhando (a cabeça mostra a frente) e quantas casas há até a próxima curva."],
  [/flor aqui/, "O coletar() só funciona em cima de uma flor. Talvez falte ou sobre um voar() antes dele."],
  [/movimentos demais|demorou demais/i, "O programa não terminou. Se usar while, garanta que a abelha possa chegar ao fim (por exemplo, while (!chegou()))."],
  [/is not defined/, "O JavaScript não conhece esse nome. Confira se o comando está escrito igual (maiúsculas contam, como em virarDireita) e se a função foi criada com function."],
  [/não recebe valores/, "Esse comando não leva nada entre os parênteses: escreva voar(); e repita com um for."],
  [/is not a function/, "Você chamou com parênteses algo que não é uma função. Confira o nome."],
  [/before initialization/, "Uma variável foi usada antes da linha em que é criada. Mova o let para cima."],
];
const explain = msg => { const h = HINTS.find(([re])=>re.test(msg)); return { msg, hint: h ? h[1] : "" }; };

async function runAll(){
  if (!ready || running) return;
  const f = FASES[cur], code = codeEl.value;
  codeEl.blur(); fbEl.innerHTML = "";
  const sx = checarSintaxe(code);
  if (sx){ attempts++; return fail(`Erro de sintaxe${sx.line ? " na linha " + sx.line : ""}: ${sx.msg}.`, "O JavaScript não conseguiu entender o código. Olhe com calma a linha indicada e a de cima dela."); }
  const sp = semParenteses(code);
  if (sp){ attempts++; return fail(`Faltaram os parênteses em ${sp}.`, `Todo comando é chamado com parênteses no fim, mesmo vazios: ${sp}()`); }
  for (const r of (f.require||[])) if (!r.re.test(code)) return fail(r.msg);
  running = true; abort = false; attempts++;
  const myRun = ++runId;
  $("#run").hidden = true; $("#stop").hidden = false;
  mapStatus = f.maps.map(()=>null); renderMaps();
  if (isPhone()) $(".boardcard").scrollIntoView({behavior:"smooth", block:"start"});
  let allOk = true;
  for (let k = 0; k < f.maps.length; k++){
    shownMap = k; renderMaps(); resetBoard();
    if (k>0) await wait(350);
    if (myRun !== runId) return;
    const { sim, out, err, res } = await simulate(f, f.maps[k], code);
    if (myRun !== runId) return;
    const done = await animate(sim.trace);
    if (myRun !== runId) return;
    $("#out").textContent = out.trim();
    if (!done){ allOk = false; fbEl.innerHTML = `<div class="feedback bad"><b>Execução interrompida</b>Ajuste o código e execute de novo.</div>`; break; }
    if (err){
      const { msg, hint } = explain(err);
      mapStatus[k] = false; renderMaps(); allOk = false;
      fail(`${f.maps.length>1?`No mapa ${k+1}: `:""}${msg}`, hint); break;
    }
    if (!res.ok){
      mapStatus[k] = false; renderMaps(); allOk = false;
      fail(`${f.maps.length>1?`No mapa ${k+1}: `:""}${res.msg}`, k>0 ? "Funcionou num mapa mas não em outro: o programa precisa servir para qualquer versão do caminho. Use os sensores." : ""); break;
    }
    mapStatus[k] = true; renderMaps();
  }
  running = false; $("#run").hidden = false; $("#stop").hidden = true;
  if (allOk) win(f, code);
}
function stopRun(){ abort = true; running = false; runId++; }

function win(f, code){
  const n = starsFor(f, code), lines = linesOf(code);
  const best = Math.max(stars[f.id]||0, n); stars[f.id] = best; store.set("stars", stars); updateStarCount();
  const last = cur === FASES.length-1;
  const ov = document.createElement("div"); ov.className = "overlay";
  ov.innerHTML = `<div class="win" role="dialog" aria-label="Fase concluída"><b>${last?"Você zerou o jogo!":"Missão cumprida!"}</b><div class="stars">${starsHtml(n)}</div>
    <span>${lines} linha${lines>1?"s":""} de código · meta para 3 estrelas: ${f.par}</span>
    ${n<3?`<span style="color:var(--ink-soft);font-size:.88rem">Dá para fazer com menos linhas. Que tal um for ou uma função? (Linhas só com chaves não contam.)</span>`:""}
    <div class="row">${last?`<button class="btn primary" data-lv>Ver fases</button>`:`<button class="btn primary" data-next>Próxima fase →</button>`}<button class="btn" data-stay>Melhorar</button></div></div>`;
  $("#stage").appendChild(ov);
  const nx = ov.querySelector("[data-next]"); if (nx) nx.onclick = ()=>openLevel(cur+1);
  const lv = ov.querySelector("[data-lv]"); if (lv) lv.onclick = showLevels;
  ov.querySelector("[data-stay]").onclick = ()=>ov.remove();
  fbEl.innerHTML = `<div class="feedback ok"><b>Fase concluída com ${n} estrela${n>1?"s":""}</b>${f.maps.length>1?`O programa funcionou nos ${f.maps.length} mapas.`:"A abelha voltou para a colmeia."}</div>`;
  $("#mission .goal").lastElementChild.innerHTML = `Melhor: <b style="color:var(--star)">${"★".repeat(best)}</b>`;
}
function fail(msg, hint){
  const f = FASES[cur];
  fbEl.innerHTML = `<div class="feedback bad"><b>Ainda não</b><span>${esc(msg)}</span>${hint?`<span style="color:var(--ink)">${esc(hint)}</span>`:""}
    <div class="row"><button class="btn" data-hint>Ver dica</button>${attempts>=2?`<button class="btn" data-sol>Ver solução</button>`:""}</div><div data-extra></div></div>`;
  fbEl.querySelector("[data-hint]").onclick = ()=> fbEl.querySelector("[data-extra]").innerHTML = `<div class="hint">${esc(f.hint)}</div>`;
  const sb = fbEl.querySelector("[data-sol]");
  if (sb) sb.onclick = ()=>{
    const box = fbEl.querySelector("[data-extra]");
    box.innerHTML = `<pre class="solution">${esc(f.solution)}</pre><div class="row" style="margin-top:6px"><button class="btn" data-use>Usar no editor</button></div>`;
    box.querySelector("[data-use]").onclick = ()=>{ codeEl.value = f.solution; syncGutter(); saveCode(); };
  };
}

/* ---------------- editor ---------------- */
function syncGutter(){
  if (!codeEl) return;
  const n = codeEl.value.split("\n").length;
  gutterEl.textContent = Array.from({length:n},(_,i)=>i+1).join("\n");
  codeEl.style.height = "auto"; codeEl.style.height = codeEl.scrollHeight+"px";
  const pw = codeEl.parentElement.clientWidth-40;
  codeEl.style.width = "auto"; codeEl.style.width = Math.max(pw, codeEl.scrollWidth)+"px";
}
function insert(t, back=0){
  codeEl.setRangeText(t, codeEl.selectionStart, codeEl.selectionEnd, "end");
  if (back){ const p = codeEl.selectionStart-back; codeEl.setSelectionRange(p,p); }
  codeEl.dispatchEvent(new Event("input"));
}
function insertLine(cmd, back){
  if (document.activeElement !== codeEl){ codeEl.focus(); const e = codeEl.value.length; codeEl.setSelectionRange(e,e); }
  const v = codeEl.value, s = codeEl.selectionStart;
  const ls = v.lastIndexOf("\n", s-1)+1, line = v.slice(ls, s);
  if (line.trim()===""){ insert(cmd, back); }
  else { let ind = line.match(/^ */)[0]; if (/\{\s*$/.test(line)) ind += "  "; const nl = v.indexOf("\n", s) < 0 ? v.length : v.indexOf("\n", s); codeEl.setSelectionRange(nl, nl); insert("\n"+ind+cmd, back); }
}
function newline(){
  const v = codeEl.value, s = codeEl.selectionStart;
  const line = v.slice(v.lastIndexOf("\n", s-1)+1, s);
  const ind = line.match(/^ */)[0];
  if (/[{[(]\s*$/.test(line)){
    if (/^[}\])]/.test(v.slice(codeEl.selectionEnd))){ insert("\n" + ind + "  " + "\n" + ind, ind.length + 1); return; }
    insert("\n" + ind + "  "); return;
  }
  insert("\n"+ind);
}
function dedent(){
  const v = codeEl.value, s = codeEl.selectionStart, ls = v.lastIndexOf("\n", s-1)+1;
  const sp = v.slice(ls).match(/^ {1,2}/);
  if (sp){ codeEl.setRangeText("", ls, ls+sp[0].length, "end"); const p = Math.max(ls, s-sp[0].length); codeEl.setSelectionRange(p,p); codeEl.dispatchEvent(new Event("input")); }
}
function setupEditor(){
  codeEl.addEventListener("input", ()=>{ syncGutter(); saveCode(); });
  codeEl.addEventListener("keydown", e=>{
    const v = codeEl.value, s = codeEl.selectionStart, en = codeEl.selectionEnd;
    if ((e.ctrlKey||e.metaKey) && e.key==="Enter"){ e.preventDefault(); runAll(); return; }
    if (e.key==="Tab"){ e.preventDefault(); e.shiftKey ? dedent() : insert("  "); return; }
    if (e.key==="Enter" && !e.isComposing){ e.preventDefault(); newline(); return; }
    if ((e.key==="}" || e.key==="]" || e.key===")") && s===en){
      const before = v.slice(v.lastIndexOf("\n", s-1)+1, s);
      if (/^ {2,}$/.test(before)){ e.preventDefault(); codeEl.setRangeText(e.key, s-2, s, "end"); codeEl.dispatchEvent(new Event("input")); return; }
    }
    if (e.key==="Backspace" && s===en){
      const before = v.slice(v.lastIndexOf("\n", s-1)+1, s);
      if (before.length && /^ +$/.test(before)){ e.preventDefault(); const k = (before.length-1)%2+1; codeEl.setRangeText("", s-k, s, "end"); codeEl.dispatchEvent(new Event("input")); }
    }
  });
  syncGutter();
}
const KEYS = [["⇥","tab"],["⇤","dedent"],[";",";"],["{ }","{}",1],["( )","()",1],["for","for (let i = 0; i < ; i++) {}",8],["if","if () {}",4],["else"," else {}",1],["while","while () {}",4],["!","!"],["function","function () {}",6],["let","let "],["++","++"],["<","<"],["=","="],["[ ]","[]",1],[",",", "],["↵","enter"]];
function setupKeys(){
  const kb = $("#keys"); kb.innerHTML = "";
  KEYS.forEach(([label,val,back])=>{
    const b = document.createElement("button"); b.type="button"; b.textContent=label;
    b.setAttribute("aria-label", val==="tab"?"Recuar":val==="dedent"?"Desfazer recuo":val==="enter"?"Nova linha":"Inserir "+val);
    b.addEventListener("pointerdown", e=>e.preventDefault());
    b.onclick = ()=>{ if (document.activeElement!==codeEl) codeEl.focus();
      if (val==="tab") insert("  "); else if (val==="dedent") dedent(); else if (val==="enter") newline(); else insert(val, back||0); };
    kb.appendChild(b);
  });
}
let lastW = window.innerWidth;
window.addEventListener("resize", ()=>{
  if (Math.abs(window.innerWidth - lastW) < 40) return;   // ignora barras de rolagem e teclado do celular
  lastW = window.innerWidth;
  if (cur!==null && !running){ resetBoard(); syncGutter(); }
});

/* ---------------- início ---------------- */
(()=>{
  updateStarCount();
  ready = typeof Worker !== "undefined" && !!window.acorn;
  const c = store.get("cur", null);
  if (c!==null && FASES[c] && unlocked(c)) openLevel(c); else showLevels();
})();
</script>

<script>
/* Navegação comum do Código em Jogo:
   - nos jogos: botão "← (lista)" dentro da missão e o "voltar" do celular volta para a lista de missões;
   - nos cursos: o "voltar" do celular volta para o mapa do curso;
   - em todas as telas: botão "Início" no topo, que volta para a página do Código em Jogo. */
(function(){
  var css = document.createElement("style");
  css.textContent = ".cj-voltar{display:inline-flex;align-items:center;gap:6px;margin:0 0 12px;padding:6px 14px 6px 10px;border-radius:99px;border:1.5px solid currentColor;background:transparent;color:inherit;font:inherit;font-weight:700;font-size:.86rem;line-height:1.2;cursor:pointer;opacity:.8;min-height:36px}" +
    ".cj-voltar:hover,.cj-voltar:focus-visible{opacity:1}" +
    ".cj-portal{display:inline-flex;align-items:center;gap:6px;margin:0 0 12px;font-weight:700;font-size:.88rem;color:inherit;opacity:.75;text-decoration:none}" +
    ".cj-portal:hover,.cj-portal:focus-visible{opacity:1;text-decoration:underline}" +
    ".cj-inicio{display:inline-flex;align-items:center;gap:6px;text-decoration:none}" +
    ".cj-inicio svg{width:18px;height:18px;flex:none}" +
    ".cj-inicio-c{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;padding:6px 12px 6px 9px;border:1.5px solid currentColor;border-radius:99px;font-weight:700;font-size:.82rem;line-height:1.2;color:inherit;text-decoration:none;opacity:.8}" +
    ".cj-inicio-c:hover,.cj-inicio-c:focus-visible{opacity:1}" +
    ".cj-inicio-c svg{width:16px;height:16px;flex:none}" +
    "@media (max-width:600px){.cj-inicio span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}.cj-inicio{padding-left:11px!important;padding-right:11px!important}}";
  document.head.appendChild(css);
  var PORTAL = "/";
  var CASA = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 9.8V20h13V9.8"/><path d="M10 20v-5.5h4V20"/></svg>';
  // jogos: botão no cabeçalho, ao lado da lista de missões
  var topo = document.querySelector(".top-r");
  if (topo && !topo.querySelector(".cj-inicio")){
    var a1 = document.createElement("a");
    a1.className = "btn cj-inicio"; a1.href = PORTAL; a1.title = "Voltar para o Código em Jogo";
    a1.setAttribute("aria-label", "Início: voltar para o Código em Jogo");
    a1.innerHTML = CASA + "<span>Início</span>";
    topo.insertBefore(a1, topo.firstChild);
  }
  // cursos: botão no alto da barra lateral (no celular, no alto da página)
  var trilha = document.querySelector("aside.trail");
  if (trilha && !trilha.querySelector(".cj-inicio-c")){
    var a2 = document.createElement("a");
    a2.className = "cj-inicio-c"; a2.href = PORTAL; a2.title = "Voltar para o Código em Jogo";
    a2.innerHTML = CASA + "<span>Código em Jogo</span>";
    trilha.insertBefore(a2, trilha.firstChild);
  }
  function linkPortal(){ return document.createComment("início no topo"); }

  /* ---------- jogos ---------- */
  if (typeof openLevel === "function" && typeof showLevels === "function"){
    var btn = document.getElementById("levelsBtn");
    var rotulo = btn ? btn.textContent.trim() : "Missões";
    var abrir = openLevel, lista = showLevels;
    var naMissao = false, voltando = false;
    try { history.replaceState({ cj: "lista" }, ""); } catch (e){}
    var poeBotao = function(){
      var m = document.getElementById("mission");
      if (!m || m.querySelector(".cj-voltar")) return;
      var b = document.createElement("button");
      b.type = "button"; b.className = "cj-voltar"; b.textContent = "← " + rotulo;
      b.setAttribute("aria-label", "Voltar para a lista de " + rotulo.toLowerCase());
      b.onclick = function(){ showLevels(); };
      m.insertBefore(b, m.firstChild);
    };
    var poePortal = function(){
      var v = document.getElementById("view");
      if (v && !v.querySelector(".cj-portal")) v.insertBefore(linkPortal(), v.firstChild);
    };
    var entrou = function(){
      if (!document.getElementById("mission")) return;
      if (!naMissao){ try { history.pushState({ cj: "missao" }, ""); } catch (e){} naMissao = true; }
      poeBotao();
    };
    openLevel = function(){ var r = abrir.apply(this, arguments); entrou(); return r; };
    showLevels = function(){
      var r = lista.apply(this, arguments);
      if (naMissao && !voltando){ naMissao = false; try { history.back(); } catch (e){} }
      naMissao = false;
      poePortal();
      return r;
    };
    window.addEventListener("popstate", function(){
      if (naMissao){ voltando = true; naMissao = false; try { showLevels(); } finally { voltando = false; } }
    });
    if (document.getElementById("mission")) entrou(); else poePortal();
    return;
  }

  /* ---------- cursos ---------- */
  if (typeof openItem === "function"){
    var abrirItem = openItem;
    var noItem = false, voltandoItem = false;
    try { history.replaceState({ cj: "mapa" }, ""); } catch (e){}
    var mapa = function(){
      var l = document.getElementById("lesson");
      if (l && !l.querySelector(".cj-portal")) l.insertBefore(linkPortal(), l.firstChild);
    };
    var depois = function(i){
      if (i === -1){
        if (noItem && !voltandoItem){ noItem = false; try { history.back(); } catch (e){} }
        noItem = false; mapa();
      } else if (!noItem){ try { history.pushState({ cj: "item" }, ""); } catch (e){} noItem = true; }
    };
    openItem = function(i){ var r = abrirItem.apply(this, arguments); depois(i); return r; };
    window.addEventListener("popstate", function(){
      if (noItem){ voltandoItem = true; noItem = false; try { openItem(-1); } finally { voltandoItem = false; } }
    });
    if (typeof current !== "undefined" && current !== -1) depois(current); else mapa();
  }
})();
</script>
